<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FOOD FIRST</title>
  <script src="./theme.js"></script>
  <link rel="stylesheet" href="./common.css" />
  <link rel="stylesheet" href="./theme.css" />
  <script src="./config.js"></script>

  <script>
    window.addEventListener("load", () => {
      const s = document.createElement("script");
      s.src = `https://dapi.kakao.com/v2/maps/sdk.js?appkey=${CONFIG.KAKAO_MAP_KEY}&autoload=false`;
      s.onload = () => kakao.maps.load(() => { window._kakaoReady = true; });
      document.head.appendChild(s);
    });
  </script>

  <style>
    /* ── 컨테이너 ── */
    .app-container { max-width: var(--max-width); margin: 0 auto; background: var(--color-bg); }

    /* ── 상단 네비 ── */
    .avatar:hover { transform: scale(1.05); }

    /* ── 카테고리 칩 ── */
    .category-tabs { display: flex; flex-wrap: wrap; gap: 10px; max-width: var(--max-width); margin: 0 auto; padding: 20px 32px 4px; }
    .category-tab { padding: 9px 18px; border-radius: 999px; font-size: 0.875rem; font-weight: 600; background: var(--color-bg-card); color: var(--color-text-secondary); border: 1px solid var(--color-border); cursor: pointer; transition: all .16s; font-family: var(--font-main); white-space: nowrap; }
    .category-tab:hover { border-color: var(--color-primary); color: var(--color-primary); transform: translateY(-1px); }
    .category-tab.active { background: var(--color-primary); color: #fff; border-color: var(--color-primary); box-shadow: var(--shadow-btn); }
    .taste-tabs { display: flex; flex-wrap: wrap; gap: 8px; max-width: var(--max-width); margin: 0 auto; padding: 6px 32px 0; }
    .taste-tab { padding: 6px 13px; border-radius: 999px; font-size: 0.8125rem; font-weight: 500; background: var(--color-bg-input); color: var(--color-text-secondary); border: none; cursor: pointer; transition: all .16s; font-family: var(--font-main); white-space: nowrap; }
    .taste-tab:hover { color: var(--color-primary); }
    .taste-tab.active { background: var(--color-primary-light); color: var(--color-primary-dark); font-weight: 700; }

    /* ── 영업중만 보기 토글 ── */
    .open-only-toggle { display: flex; align-items: center; gap: 7px; padding: 9px 14px; border-radius: 999px; font-family: var(--font-main); font-size: 0.875rem; font-weight: 600; color: var(--color-text-secondary); background: var(--color-bg-input); border: 1px solid var(--color-border); cursor: pointer; transition: all .16s; white-space: nowrap; }
    .open-only-toggle:hover { border-color: var(--color-primary); color: var(--color-primary); }
    .open-only-toggle.active { background: var(--color-primary-light); color: var(--color-primary-dark); border-color: var(--color-primary); }
    .open-only-toggle .toggle-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--color-border); flex-shrink: 0; transition: background .16s; }
    .open-only-toggle.active .toggle-dot { background: #22c55e; }

    /* ── 필터 바 ── */
    .filter-bar { display: flex; align-items: center; justify-content: space-between; max-width: var(--max-width); margin: 0 auto; padding: 16px 32px; }
    .result-count { font-size: 0.875rem; color: var(--color-text-secondary); font-weight: 600; }
    .sort-dropdown { position: relative; }
    .sort-btn { display: flex; align-items: center; gap: 5px; font-family: var(--font-main); font-size: 0.875rem; font-weight: 600; color: var(--color-text-primary); background: var(--color-bg-input); border: 1px solid var(--color-border); padding: 9px 14px; border-radius: 999px; cursor: pointer; transition: background .15s; }
    .sort-btn:hover { background: var(--color-border); }
    .sort-chevron { transition: transform .2s; flex-shrink: 0; }
    .sort-dropdown.open .sort-chevron { transform: rotate(180deg); }
    .sort-menu { display: none; position: absolute; right: 0; top: calc(100% + 8px); background: var(--color-bg-card); border-radius: var(--radius-lg); box-shadow: var(--shadow-modal); overflow: hidden; min-width: 120px; z-index: 150; }
    .sort-dropdown.open .sort-menu { display: block; }
    .sort-option { display: block; width: 100%; padding: 12px 18px; text-align: left; font-family: var(--font-main); font-size: 0.875rem; font-weight: 500; color: var(--color-text-primary); background: none; border: none; cursor: pointer; transition: background .12s; }
    .sort-option:hover { background: var(--color-bg-input); }
    .sort-option.active { color: var(--color-primary); font-weight: 700; }

    /* ── 마소너리 그리드 ──
       랜덤: CSS 다단(column-count) → 컬럼 높이 자동 균등(바닥이 고르게 정리되어 예쁨)
       거리순(.row-major): flex 컬럼 + JS 라운드로빈 → 행 우선(윗줄 왼→오로 가까운 순) */
    .page-content { padding-bottom: 80px; }
    .restaurant-grid { column-count: 5; column-gap: 20px; max-width: var(--max-width); margin: 0 auto; padding: 0 32px; }
    @media (max-width: 1280px) { .restaurant-grid { column-count: 4; } }
    @media (max-width: 980px)  { .restaurant-grid { column-count: 3; } }
    @media (max-width: 700px)  { .restaurant-grid { column-count: 2; } }
    .restaurant-grid.row-major { display: flex; gap: 20px; align-items: flex-start; }
    .grid-col { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 20px; }

    /* ── 카드 (사진만, 원본 비율 유지) ── */
    .restaurant-card { background: var(--color-bg-card); border-radius: 16px; box-shadow: var(--shadow-card); overflow: hidden; cursor: pointer; transition: transform .22s cubic-bezier(.2,.7,.2,1), box-shadow .22s; position: relative; break-inside: avoid; -webkit-column-break-inside: avoid; margin: 0 0 20px; }
    .restaurant-grid.row-major .restaurant-card { margin-bottom: 0; }   /* 거리순 flex 컬럼은 gap이 간격 담당 */
    .restaurant-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-card-hover); }
    .restaurant-card:active { transform: scale(0.99); }
    .card-img-wrap { position: relative; overflow: hidden; background: var(--color-bg-input); aspect-ratio: 4 / 3; }
    .card-img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; object-fit: cover; transition: transform .45s cubic-bezier(.2,.7,.2,1); }
    .card-img.is-loaded + .card-img-placeholder { display: none; }   /* 이미지 로드되면 플레이스홀더 숨김 */
    .restaurant-card:hover .card-img { transform: scale(1.04); }
    .card-img-placeholder { position: absolute; inset: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 3rem; }
    .card-closed-badge, .card-dayoff-badge, .card-break-badge { position: absolute; top: 10px; left: 10px; font-size: 0.6875rem; font-weight: 700; padding: 5px 10px; border-radius: 999px; color: #fff; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
    .card-closed-badge  { background: rgba(0,0,0,0.55); }
    .card-dayoff-badge { background: rgba(99,60,180,0.82); }
    .card-break-badge   { background: rgba(230,81,0,0.88); }
    .card-heart { position: absolute; top: 10px; right: 10px; width: 34px; height: 34px; border: none; padding: 0; border-radius: 999px; background: rgba(255,255,255,0.92); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; font-size: 1rem; box-shadow: 0 2px 8px rgba(0,0,0,0.15); cursor: pointer; transition: transform .15s; }
    .card-heart:focus-visible { outline: 2px solid var(--color-primary); outline-offset: 2px; }
    .card-heart:hover { transform: scale(1.08); }
    .card-heart:active { transform: scale(0.85); }

    /* ── 빈 상태 ── */
    .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 80px var(--spacing-md); gap: 12px; color: var(--color-text-secondary); text-align: center; }
    .empty-state-icon { font-size: 3rem; }
    .empty-state-text { font-size: 0.9375rem; font-weight: 500; }

    /* ── 테마 토글 FAB ── */
    .theme-fab { position: fixed; bottom: 24px; right: 24px; z-index: 60; width: 48px; height: 48px; border-radius: 999px; background: var(--color-bg-card); border: 1px solid var(--color-border); color: var(--color-text-primary); display: inline-flex; align-items: center; justify-content: center; box-shadow: var(--shadow-card-hover); transition: transform .15s; }
    .theme-fab:hover { transform: scale(1.06); }
    .theme-fab svg { width: 20px; height: 20px; }
    .theme-fab .moon { display: none; }
    html[data-theme="dark"] .theme-fab .sun { display: none; }
    html[data-theme="dark"] .theme-fab .moon { display: block; }

    /* ── 맨 위로 버튼 ── */
    .scroll-top-btn { position: fixed; bottom: 84px; right: 24px; width: 48px; height: 48px; border-radius: 50%; background: var(--color-primary); color: #fff; font-size: 1.125rem; font-weight: 700; border: none; cursor: pointer; box-shadow: var(--shadow-btn); opacity: 0; pointer-events: none; transform: translateY(16px); transition: opacity .2s, transform .2s; z-index: 60; }
    .scroll-top-btn.visible { opacity: 1; pointer-events: auto; transform: translateY(0); }
    .reexplore-btn { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(20px); display: inline-flex; align-items: center; gap: 7px; padding: 13px 22px; border-radius: 999px; background: var(--color-primary); color: #fff; font-family: var(--font-main); font-size: 0.9375rem; font-weight: 700; border: none; cursor: pointer; box-shadow: 0 8px 24px color-mix(in srgb, var(--color-primary) 50%, transparent); opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; z-index: 70; }
    .reexplore-btn.visible { opacity: 1; pointer-events: auto; transform: translateX(-50%) translateY(0); }
    .reexplore-btn:hover { transform: translateX(-50%) translateY(-2px); }
    .reexplore-btn .ic svg { width: 17px; height: 17px; }

    /* ── 메뉴 하트 버튼 ── */
    .menu-item-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .menu-heart-btn { background: none; border: none; cursor: pointer; padding: 4px; display: flex; align-items: center; justify-content: center; color: var(--color-text-tertiary); transition: color .15s, transform .15s; border-radius: 50%; }
    .menu-heart-btn:hover { transform: scale(1.15); }
    .menu-heart-btn.active { color: var(--color-primary); }
    .menu-heart-btn svg { width: 18px; height: 18px; }

    /* ── 리뷰 ── */
    .review-avg { font-size: 0.8125rem; font-weight: 600; color: var(--color-text-secondary); margin-left: 4px; }
    .review-avg .star.on { color: #FFB23E; }
    .review-cnt { color: var(--color-text-tertiary); font-weight: 500; }
    .review-loading, .review-empty { color: var(--color-text-tertiary); font-size: 0.8125rem; padding: 12px 0; text-align: center; }
    .review-form { background: var(--color-bg-input); border-radius: var(--radius-lg); padding: 12px; margin-bottom: 14px; }
    .review-form-title { font-size: 0.8125rem; font-weight: 700; margin-bottom: 8px; }
    .review-quick-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
    .review-quick-tag { padding: 4px 11px; border-radius: 999px; font-size: 0.75rem; font-weight: 500; background: var(--color-bg-card); border: 1px solid var(--color-border); color: var(--color-text-secondary); cursor: pointer; font-family: var(--font-main); transition: all .14s; }
    .review-quick-tag:hover { border-color: var(--color-primary); color: var(--color-primary); }
    .review-quick-hint { font-size: 0.75rem; color: var(--color-text-tertiary); }
    .star-row { display: flex; gap: 2px; margin-bottom: 10px; }
    .star-btn { background: none; border: none; cursor: pointer; font-size: 1.5rem; line-height: 1; color: #c2c2c8; padding: 0; font-family: inherit; }
    .star-btn.on { color: #FFB23E; }
    .star { color: #c2c2c8; font-size: 0.875rem; }
    .star.on { color: #FFB23E; }
    .review-input { width: 100%; padding: 9px 12px; border: 1px solid var(--color-border); border-radius: var(--radius-md); background: var(--color-bg-card); color: var(--color-text-primary); font-size: 0.875rem; font-family: var(--font-main); margin-bottom: 10px; }
    .review-form-bottom { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .review-vis { padding: 7px 10px; border: 1px solid var(--color-border); border-radius: var(--radius-md); background: var(--color-bg-card); color: var(--color-text-primary); font-size: 0.8125rem; font-family: var(--font-main); cursor: pointer; }
    .review-submit { padding: 8px 16px; border: none; border-radius: 999px; background: var(--color-primary); color: #fff; font-size: 0.8125rem; font-weight: 700; cursor: pointer; font-family: var(--font-main); }
    .review-del { padding: 8px 12px; border: none; border-radius: 999px; background: var(--color-bg-input); color: var(--color-text-secondary); font-size: 0.8125rem; font-weight: 700; cursor: pointer; font-family: var(--font-main); }
    .review-item { display: flex; gap: 10px; padding: 10px 0; border-top: 1px solid var(--color-border-light); }
    .review-ava { width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0; background: var(--color-primary); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.8125rem; overflow: hidden; }
    .review-ava img { width: 100%; height: 100%; object-fit: cover; }
    .review-body { flex: 1; min-width: 0; }
    .review-top { display: flex; align-items: center; gap: 8px; }
    .review-name { font-size: 0.8125rem; font-weight: 600; }
    .review-stars { line-height: 1; }
    .review-text { font-size: 0.8125rem; color: var(--color-text-secondary); margin-top: 3px; line-height: 1.4; }


    /* 다크모드: 빈 별 중간 회색 (채워진 별은 금색 유지) */
    html[data-theme="dark"] .star-btn:not(.on),
    html[data-theme="dark"] .star:not(.on),
    html[data-theme="dark"] .feed-review-off { color:#6f6f74; }

  </style>
</head>
<body>

  <!-- 상단 네비게이션 -->
  <header class="top-nav">
    <div class="top-nav-inner">
      <a href="./index.html" class="brand"><span class="brand-mark"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2v7c0 1.1.9 2 2 2h0a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/></svg></span>FOOD&nbsp;FIRST</a>
      <nav class="nav-links">
        <a href="./index.html" class="nav-link is-active">홈</a>
        <a href="./swipe.html" class="nav-link">스와이프</a>
        <a href="./mypage.html" class="nav-link">마이</a>
      </nav>
      <div class="nav-right">
        <a href="./mypage.html" class="avatar" title="마이페이지" id="navAvatar">나</a>
      </div>
    </div>
  </header>

  <!-- 네비 아바타: 캐시된 프로필 사진 즉시 적용 ("나" 깜빡임 방지) -->
  <script src="./navavatar.js"></script>
  <script type="module" src="./notifications.js"></script>

  <div class="app-container">

    <!-- 카테고리 탭 -->
    <div class="category-tabs" id="categoryTabs">
      <button class="category-tab active" data-category="전체">전체</button>
      <button class="category-tab" data-category="한식">한식</button>
      <button class="category-tab" data-category="중식">중식</button>
      <button class="category-tab" data-category="일식">일식</button>
      <button class="category-tab" data-category="양식">양식</button>
      <button class="category-tab" data-category="분식">분식</button>
      <button class="category-tab" data-category="패스트푸드">패스트푸드</button>
      <button class="category-tab" data-category="아시아">아시아</button>
    </div>

    <!-- 맛 필터 -->
    <div class="taste-tabs" id="tasteTabs">
      <button class="taste-tab active" data-taste="전체">맛 전체</button>
      <button class="taste-tab" data-taste="매콤한">매콤한</button>
      <button class="taste-tab" data-taste="국물/탕">국물</button>
      <button class="taste-tab" data-taste="바삭한">바삭한</button>
      <button class="taste-tab" data-taste="감칠맛">감칠맛</button>
      <button class="taste-tab" data-taste="단짠">단짠</button>
      <button class="taste-tab" data-taste="달콤한">달콤한</button>
    </div>

    <!-- 필터 바 -->
    <div class="filter-bar">
      <span class="result-count" id="resultCount">메뉴 로딩 중...</span>
      <div style="display:flex;align-items:center;gap:8px">
        <button class="open-only-toggle" id="openOnlyToggle" onclick="toggleOpenOnly()">
          <span class="toggle-dot"></span>영업중만 보기
        </button>
        <div class="sort-dropdown" id="sortDropdown">
          <button class="sort-btn" onclick="toggleSortMenu()">
            <span id="sortLabel">랜덤</span>
            <svg class="sort-chevron" viewBox="0 0 24 24" fill="currentColor" width="14" height="14"><path d="M7 10l5 5 5-5z"/></svg>
          </button>
          <div class="sort-menu">
            <button class="sort-option active" onclick="selectSort('random','랜덤',this)">랜덤</button>
            <button class="sort-option" onclick="selectSort('distance','거리순',this)">거리순</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 식당 그리드 -->
    <div class="page-content">
      <div class="restaurant-grid" id="restaurantGrid">
        <div class="spinner-wrap" style="column-span:all">
          <div class="spinner"></div>
          <span>식당 불러오는 중...</span>
        </div>
      </div>
    </div>

  </div>

  <!-- 식당 상세 모달 -->
  <div class="modal-overlay" id="modalOverlay" onclick="handleModalOutsideClick(event)">
    <div class="modal-sheet" id="modalSheet">
      <div class="modal-hero" id="modalHero">
        <div class="modal-hero-placeholder" id="modalHeroPlaceholder">🍽️</div>
        <button class="modal-close" onclick="closeModal()"><span class="ic" data-icon="close"></span></button>
      </div>
      <div class="modal-scroll-body">
        <div class="modal-body">
          <div class="modal-title-row">
            <h2 class="modal-title" id="modalName"></h2>
            <span class="badge" id="modalStatusBadge"></span>
          </div>
          <p class="modal-meta" id="modalMeta"></p>
          <div class="tag-list" id="modalTags"></div>
          <div class="modal-divider"></div>
          <h3 class="modal-section-title">메뉴</h3>
          <div class="menu-list" id="modalMenuList"></div>
          <div class="modal-divider"></div>
          <h3 class="modal-section-title">리뷰 <span id="reviewAvg" class="review-avg"></span></h3>
          <div id="reviewArea"></div>
          <div class="modal-divider"></div>
          <h3 class="modal-section-title">위치</h3>
          <div class="modal-map-wrap">
            <div id="modalMap" class="modal-map"></div>
          </div>
          <div class="modal-map-link" onclick="openKakaoMap()">카카오맵에서 크게 보기 ›</div>
        </div>
      </div>
      <div class="modal-btn-row">
        <button class="modal-icon-btn" id="modalRegularBtn" onclick="handleModalRegular()">
          <span class="icon" id="modalRegularIcon" data-icon="bookmark"></span>
          <span class="label" id="modalRegularLabel">단골</span>
        </button>
        <button class="btn-primary" onclick="openKakaoNav()">길찾기<span class="ic" data-icon="navigation"></span></button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <!-- 테마 토글 FAB -->
  <button class="theme-fab" id="themeFab" aria-label="테마 전환">
    <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M5 19l1.5-1.5M17.5 6.5 19 5"/></svg>
    <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
  </button>

  <!-- 맨 위로 가기 -->
  <button class="scroll-top-btn" id="scrollTopBtn" aria-label="맨 위로"
    onclick="window.scrollTo({top:0,behavior:'smooth'})"><span class="ic" data-icon="arrowUp"></span></button>

  <!-- 재탐색하기 (맨 아래 도달 시 표시) -->
  <button class="reexplore-btn" id="reexploreBtn" onclick="reexplore()">
    <span class="ic" data-icon="shuffle"></span> 재탐색하기
  </button>

  <script>
    // 맨 위로 버튼 노출
    (function() {
      const btn = document.getElementById("scrollTopBtn");
      if (!btn) return;
      const onScroll = () => {
        if (window.scrollY > 300) btn.classList.add("visible");
        else btn.classList.remove("visible");
      };
      window.addEventListener("scroll", onScroll, { passive: true });
      onScroll();
    })();

    // 테마 토글 FAB (theme.js와 동일한 ff_theme 키 사용)
    (function() {
      const fab = document.getElementById("themeFab");
      if (!fab) return;
      fab.addEventListener("click", () => {
        const html = document.documentElement;
        const next = html.getAttribute("data-theme") === "dark" ? "light" : "dark";
        html.setAttribute("data-theme", next);
        localStorage.setItem("ff_theme", next); window.__persistAppearance && window.__persistAppearance({theme:next});
      });
    })();
  </script>

  <script type="module">
    import {
      getAllMenus, getMenusByRestaurant,
      addMenuLike, removeMenuLike, addRecentView, getUserDoc,
      addRegular, removeRegular,
      getStorageUrl, getRestaurantPhoto, getOpenStatus, seoulNow, calcDistanceM, formatDistance, loadRestaurantData,
      updateNavAvatar,
      setReview, deleteReview, getMyReview, getRestaurantReviews,
    } from "./firebase.js";
    import { onAuthChanged } from "./auth.js";
    import { ICONS, applyIcons } from "./icons.js";
    import { escapeHtml, safeImageSrc } from "./escape.js";
    applyIcons();   // 정적 마크업의 data-icon 요소에 SVG 주입

    // ── 토스트 메시지 ──
    function showToast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.classList.add("show");
      setTimeout(() => t.classList.remove("show"), 2000);
    }

    // ── 메뉴 메모리 캐시 (모달 단위) ──
    const menuCache = {};

    // ── 상태 ──
    let allRestaurants = [];
    let allMenus       = [];
    let filteredMenus  = [];
    let currentUser       = null;
    let userMenuLikes     = [];   // 메뉴 좋아요 (메뉴 ID 배열)
    let userRegulars      = [];
    let userFriends       = [];
    let userName          = "";
    let userPhoto         = "";
    let currentRestaurant = null;
    let currentCategory   = "전체";
    let currentTaste      = "전체";
    let currentSort       = "random";
    let currentOpenOnly   = false;   // 영업중만 보기 토글

    let _authReady = false;
    let _pendingModalId = null;

    onAuthChanged(async (user) => {
      currentUser = user;
      if (user) {
        const userData = await getUserDoc(user.uid);
        userMenuLikes = userData.menuLikes || [];
        userRegulars = userData.regulars || [];
        userFriends  = userData.friends  || [];
        userName     = userData.displayName || user.displayName || "사용자";
        userPhoto    = userData.photoBase64 || user.photoURL || "";
        updateNavAvatar(user, userData);
        renderGrid();
      } else {
        updateNavAvatar(null);
      }

      if (!_authReady) {
        _authReady = true;
        if (_pendingModalId) {
          openModal(_pendingModalId);
          _pendingModalId = null;
        }
      }
    });

    async function init() {
      const { restaurants, menus } = await loadRestaurantData(true);
      allMenus       = menus;
      allMenus.forEach(m => { m._rand = Math.random(); });   // 안정적 랜덤 키 (편향 없는 셔플 + 필터 토글 시 순서 유지)
      allRestaurants = restaurants.map(r => ({ ...r, photo: getRestaurantPhoto(r, menus) }));
      applyFilterAndSort();

      const params   = new URLSearchParams(window.location.search);
      const targetId = params.get("restaurant");
      if (targetId) {
        if (_authReady) {
          openModal(targetId);
        } else {
          _pendingModalId = targetId;
        }
      }
    }
    init();

    // ── 카테고리 탭 ──
    document.getElementById("categoryTabs").addEventListener("click", (e) => {
      const tab = e.target.closest(".category-tab");
      if (!tab) return;
      document.querySelectorAll(".category-tab").forEach(t => t.classList.remove("active"));
      tab.classList.add("active");
      currentCategory = tab.dataset.category;
      applyFilterAndSort();
    });

    // ── 맛 필터 ──
    document.getElementById("tasteTabs").addEventListener("click", (e) => {
      const tab = e.target.closest(".taste-tab");
      if (!tab) return;
      document.querySelectorAll(".taste-tab").forEach(t => t.classList.remove("active"));
      tab.classList.add("active");
      currentTaste = tab.dataset.taste;
      applyFilterAndSort();
    });

    // ── 정렬 드롭다운 ──
    window.toggleSortMenu = function () {
      document.getElementById("sortDropdown").classList.toggle("open");
    };

    window.selectSort = function (value, label, el) {
      currentSort = value;
      document.getElementById("sortLabel").textContent = label;
      document.querySelectorAll(".sort-option").forEach(o => o.classList.remove("active"));
      el.classList.add("active");
      document.getElementById("sortDropdown").classList.remove("open");
      applyFilterAndSort();
    };

    document.addEventListener("click", (e) => {
      if (!e.target.closest("#sortDropdown")) {
        document.getElementById("sortDropdown").classList.remove("open");
      }
    });

    // ── 영업중만 보기 토글 ──
    window.toggleOpenOnly = function () {
      currentOpenOnly = !currentOpenOnly;
      document.getElementById("openOnlyToggle").classList.toggle("active", currentOpenOnly);
      applyFilterAndSort();
    };

    // ── 필터 + 정렬 ──
    function applyFilterAndSort() {
      const restaurantMap = Object.fromEntries(allRestaurants.map(r => [r.id, r]));

      let menus = allMenus
        .map(m => ({ ...m, restaurant: restaurantMap[m.restaurantId] }))
        .filter(m => m.restaurant);

      if (currentCategory !== "전체") {
        menus = menus.filter(m => m.restaurant.category === currentCategory);
      }
      if (currentTaste !== "전체") {
        menus = menus.filter(m => (m.tags || "").split(",").map(t => t.trim()).includes(currentTaste));
      }
      if (currentOpenOnly) {
        menus = menus.filter(m => getOpenStatus(m.restaurant) === "open");
      }

      if (currentSort === "distance") {
        menus.sort((a, b) => {
          const r1 = a.restaurant, r2 = b.restaurant;
          const da = (r1.lat && r1.lng) ? calcDistanceM(CONFIG.HANSUNG_LAT, CONFIG.HANSUNG_LNG, r1.lat, r1.lng) : 99999;
          const db = (r2.lat && r2.lng) ? calcDistanceM(CONFIG.HANSUNG_LAT, CONFIG.HANSUNG_LNG, r2.lat, r2.lng) : 99999;
          return da - db;
        });
      } else {
        menus.sort((a, b) => (a._rand ?? 0) - (b._rand ?? 0));   // 고정 랜덤 키 정렬 = 균등 셔플 (Math.random()-0.5 편향 제거)
      }

      filteredMenus = menus;
      renderGrid();
      preloadRatios(menus.filter(m => !m.ratio));   // 비율은 Firestore에 저장돼 있어 다운로드 불필요 — 미저장분만 폴백
      document.getElementById("resultCount").textContent = `${filteredMenus.length}개 메뉴`;
    }

    // 배경에서 이미지 원본 비율을 미리 읽어 캐시 → 스크롤 시 자리 튐(지지직) 방지
    // 보이는 이미지가 먼저 받도록: 낮은 우선순위 + 동시 4개 제한 + 유휴 시간에 시작
    function preloadRatios(menus) {
      const urls = [];
      menus.forEach(m => {
        if (!m.photo) return;
        const u = getStorageUrl(m.photo);
        if (!imgRatioCache[u] && !urls.includes(u)) urls.push(u);
      });
      let i = 0;
      const CONC = 4;
      function next() {
        if (i >= urls.length) return;
        const url = urls[i++];
        const im = new Image();
        try { im.fetchPriority = "low"; } catch (e) {}
        const done = () => next();
        im.onload = () => {
          if (im.naturalWidth && im.naturalHeight) {
            const ratio = `${im.naturalWidth} / ${im.naturalHeight}`;
            imgRatioCache[url] = ratio;
            document.querySelectorAll('#restaurantGrid .card-img').forEach(el => {
              if (el.getAttribute('src') === url) {
                const wrap = el.closest('.card-img-wrap');
                if (wrap && !wrap.style.aspectRatio) wrap.style.aspectRatio = ratio;
              }
            });
          }
          done();
        };
        im.onerror = done;
        im.src = url;
      }
      const start = () => { for (let k = 0; k < CONC; k++) next(); };
      if (window.requestIdleCallback) requestIdleCallback(start, { timeout: 1500 });
      else setTimeout(start, 400);
    }

    // ── 컬럼 수 (CSS 브레이크포인트와 일치) ──
    function getColumnCount() {
      const w = window.innerWidth;
      if (w <= 700)  return 2;
      if (w <= 980)  return 3;
      if (w <= 1280) return 4;
      return 5;
    }

    // 이미지 원본 비율 캐시 (url → "W/H") — 로드 전 자리 예약용
    const imgRatioCache = {};

    window.onCardImg = function(img) {
      img.classList.add('is-loaded');
      const w = img.naturalWidth, h = img.naturalHeight;
      if (w && h) {
        const ratio = `${w} / ${h}`;
        imgRatioCache[img.getAttribute('src')] = ratio;
        const wrap = img.closest('.card-img-wrap');
        if (wrap) wrap.style.aspectRatio = ratio;
      }
    };

    // ── 카드 1장 HTML ──
    function cardHtml(m, i = 99) {
      const r       = m.restaurant;
      const status  = getOpenStatus(r);
      const liked   = userMenuLikes.includes(m.id);
      const regular = userRegulars.includes(r.id);
      const url     = m.photo ? getStorageUrl(m.photo) : '';
      const ratio   = m.ratio || (url && imgRatioCache[url] ? imgRatioCache[url] : '');
      const eager   = i < 10;   // 첫 두 줄 정도는 즉시·우선 로드
      const imgAttr = eager ? 'loading="eager" fetchpriority="high"' : 'loading="lazy" fetchpriority="auto"';
      return `
        <div class="restaurant-card" onclick="openModal('${r.id}','${m.id}')">
          <div class="card-img-wrap"${ratio ? ` style="aspect-ratio:${ratio}"` : ''}>
            ${m.photo
              ? `<img class="card-img" src="${url}" alt="${m.name}" ${imgAttr} decoding="async" onload="onCardImg(this)" onerror="this.remove()" /><div class="card-img-placeholder">${getCategoryEmoji(r.category)}</div>`
              : `<div class="card-img-placeholder">${getCategoryEmoji(r.category)}</div>`}
            ${status === 'closed'  ? '<span class="card-closed-badge">영업종료</span>' : ''}
            ${status === 'dayoff' ? '<span class="card-dayoff-badge">휴무일</span>' : ''}
            ${status === 'break'   ? '<span class="card-break-badge">브레이크타임</span>' : ''}
            ${regular ? '<span class="card-closed-badge" style="background:rgba(255,150,0,0.9);left:10px;bottom:10px;top:auto">' + ICONS.bookmark + ' 단골</span>' : ''}
            <button type="button" class="card-heart" onclick="handleMenuHeart(event,'${m.id}')" id="menu-heart-${m.id}"
                    aria-label="좋아요" aria-pressed="${liked}">
              ${liked ? ICONS.heartFill : ICONS.heart}
            </button>
          </div>
        </div>`;
    }

    // ── 그리드 렌더링 ──
    // 정렬 순서를 컬럼에 행 우선(라운드로빈)으로 분배 → 윗줄 왼→오로 읽으면 정렬 순서대로
    function renderGrid() {
      const grid = document.getElementById("restaurantGrid");

      if (filteredMenus.length === 0) {
        grid.classList.remove("row-major");
        grid.innerHTML = `
          <div class="empty-state" style="column-span:all;width:100%">
            <div class="empty-state-icon">${ICONS.search}</div>
            <div class="empty-state-text">해당 카테고리 메뉴가 없습니다</div>
          </div>`;
        toggleReexplore(false);
        return;
      }

      if (currentSort === "distance") {
        // 거리순: 행 우선(가로) 분배 — 카드 i → 컬럼 (i % 컬럼수)
        // → 각 컬럼 맨 위가 0,1,2…번 = 윗줄을 왼→오로 읽으면 가까운 순
        grid.classList.add("row-major");
        const colCount = getColumnCount();
        const cols = Array.from({ length: colCount }, () => []);
        filteredMenus.forEach((m, i) => cols[i % colCount].push(cardHtml(m, i)));
        grid.innerHTML = cols.map(c => `<div class="grid-col">${c.join('')}</div>`).join('');
      } else {
        // 랜덤: CSS 다단 — 컬럼 높이가 자동 균등화되어 바닥이 고르게 정리됨
        grid.classList.remove("row-major");
        grid.innerHTML = filteredMenus.map((m, i) => cardHtml(m, i)).join('');
      }

      // 캐시되어 이미 로드된 이미지는 onload가 안 뜰 수 있어 즉시 보정
      grid.querySelectorAll('.card-img').forEach(img => {
        if (img.complete && img.naturalWidth) onCardImg(img);
      });
    }

    // ── 재탐색하기 ──
    function toggleReexplore(show) {
      const btn = document.getElementById("reexploreBtn");
      if (btn) btn.classList.toggle("visible", !!show);
    }
    window.reexplore = function () {
      allMenus.forEach(m => { m._rand = Math.random(); });   // 재탐색 누를 때만 새로 섞음
      applyFilterAndSort();   // 현재 필터 유지하며 순서 다시 섞기
      window.scrollTo({ top: 0, behavior: "smooth" });
      toggleReexplore(false);
      showToast("새로 탐색해요");
    };
    // 맨 아래 근처에 도달하면 재탐색 버튼 노출
    window.addEventListener("scroll", () => {
      if (filteredMenus.length === 0) { toggleReexplore(false); return; }
      const nearBottom = window.innerHeight + window.scrollY >= document.body.offsetHeight - 60;
      toggleReexplore(nearBottom);
    }, { passive: true });

    // 거리순(flex 컬럼)일 때만: 화면 폭이 바뀌어 컬럼 수가 달라지면 재분배 (디바운스)
    // (랜덤은 CSS 다단이라 브라우저가 알아서 컬럼 수를 조정함)
    let _gridResizeTimer, _lastColCount = getColumnCount();
    window.addEventListener("resize", () => {
      if (currentSort !== "distance") return;
      clearTimeout(_gridResizeTimer);
      _gridResizeTimer = setTimeout(() => {
        const c = getColumnCount();
        if (c !== _lastColCount && filteredMenus.length) { _lastColCount = c; renderGrid(); }
      }, 200);
    }, { passive: true });

    // ── 그리드 메뉴 하트 버튼 클릭 ──
    window.handleMenuHeart = async function (e, menuId) {
      e.stopPropagation();
      if (!currentUser) { showToast("로그인이 필요합니다"); return; }
      const heartEl = document.getElementById(`menu-heart-${menuId}`);
      const liked   = userMenuLikes.includes(menuId);
      if (liked) {
        userMenuLikes = userMenuLikes.filter(id => id !== menuId);
        await removeMenuLike(currentUser.uid, menuId);
        if (heartEl) { heartEl.innerHTML = ICONS.heart; heartEl.setAttribute('aria-pressed', 'false'); }
        showToast("좋아요 취소");
      } else {
        userMenuLikes.push(menuId);
        await addMenuLike(currentUser.uid, menuId, allMenus.find(m => m.id === menuId)?.restaurantId);
        if (heartEl) { heartEl.innerHTML = ICONS.heartFill; heartEl.setAttribute('aria-pressed', 'true'); }
        showToast("좋아요!");
      }
      // 모달이 열려있으면 메뉴 리스트 하트도 갱신
      updateModalMenuLikes();
    };

    // ── 모달 열기 ──
    window.openModal = async function (restaurantId, selectedMenuId = null) {
      const restaurant = allRestaurants.find(r => r.id === restaurantId);
      if (!restaurant) return;
      currentRestaurant = restaurant;

      if (currentUser) addRecentView(currentUser.uid, restaurantId);

      const hero        = document.getElementById("modalHero");
      const placeholder = document.getElementById("modalHeroPlaceholder");
      if (restaurant.photo) {
        const img = document.createElement("img");
        img.src = getStorageUrl(restaurant.photo);
        img.style.cssText = "width:100%;height:100%;object-fit:cover;position:absolute;inset:0";
        img.onerror = () => { img.remove(); placeholder.style.display = "flex"; };
        placeholder.style.display = "none";
        hero.querySelectorAll("img").forEach(i => i.remove());
        hero.appendChild(img);
      }

      document.getElementById("modalName").textContent = restaurant.name;
      const badge  = document.getElementById("modalStatusBadge");
      const status = getOpenStatus(restaurant);
      const statusMap = {
        open:    { text: "영업중",      cls: "badge-open"    },
        break:   { text: "브레이크타임", cls: "badge-break"   },
        closed:  { text: "영업종료",    cls: "badge-closed"  },
        dayoff: { text: "휴무일",      cls: "badge-dayoff" },
      };
      badge.textContent = statusMap[status].text;
      badge.className   = `badge ${statusMap[status].cls}`;

      const distVal = (restaurant.lat && restaurant.lng)
        ? formatDistance(CONFIG.HANSUNG_LAT, CONFIG.HANSUNG_LNG, restaurant.lat, restaurant.lng)
        : (restaurant.distance ? restaurant.distance + 'km' : '-');

      const metaRows = [
        { icon: ICONS.tag,    label: "카테고리", value: restaurant.category || "-" },
        { icon: ICONS.mapPin, label: "거리",     value: distVal },
        { icon: ICONS.clock,  label: "영업시간", value: restaurant.hours || "-" },
      ];
      if (restaurant.break_time && restaurant.break_time !== "없음")
        metaRows.push({ icon: ICONS.coffee, label: "브레이크", value: restaurant.break_time });
      if (restaurant.closed_day && restaurant.closed_day !== "없음")
        metaRows.push({ icon: ICONS.calendarX, label: "정기휴무", value: restaurant.closed_day });

      document.getElementById("modalMeta").innerHTML = metaRows.map(r => `
        <div class="modal-meta-row">
          <span class="modal-meta-icon">${r.icon}</span>
          <span class="modal-meta-label">${r.label}</span>
          <span class="modal-meta-value">${r.value}</span>
        </div>`).join("");

      const tagsEl = document.getElementById("modalTags");
      tagsEl.innerHTML = restaurant.tags
        ? restaurant.tags.split(",").map(t => `<span class="tag">${t.trim()}</span>`).join("")
        : "";

      if (!menuCache[restaurantId]) {
        menuCache[restaurantId] = await getMenusByRestaurant(restaurantId);
      }
      let menus = [...menuCache[restaurantId]];
      // 클릭한 메뉴를 맨 위로 이동
      if (selectedMenuId) {
        const i = menus.findIndex(m => m.id === selectedMenuId);
        if (i > -1) menus = [menus[i], ...menus.slice(0, i), ...menus.slice(i + 1)];
      }
      const menuList = document.getElementById("modalMenuList");
      menuList.innerHTML = menus.length > 0
        ? menus.map(m => {
          const picked      = selectedMenuId && m.id === selectedMenuId;
          const menuLiked   = userMenuLikes.includes(m.id);
          return `
          <div class="menu-item${picked ? ' menu-item--picked' : ''}">
            <div class="menu-item-left">
              ${m.photo
                ? `<img class="menu-photo" src="${getStorageUrl(m.photo)}" alt="${m.name}" onerror="this.outerHTML='<div class=\\'menu-photo-placeholder\\'>🍽️</div>'" />`
                : `<div class="menu-photo-placeholder">🍽️</div>`}
              <div class="menu-name-wrap">
                ${picked ? '<span class="menu-pick-badge">✓ 내가 고른 메뉴</span>' : ''}
                <span class="menu-name">${m.name}</span>
              </div>
            </div>
            <div class="menu-item-right">
              <span class="menu-price">${m.price ? m.price.toLocaleString() + '원' : '-'}</span>
              <button class="menu-heart-btn${menuLiked ? ' active' : ''}" onclick="handleMenuHeart(event,'${m.id}')" id="menu-heart-${m.id}" aria-label="메뉴 좋아요">
                ${menuLiked ? ICONS.heartFill : ICONS.heart}
              </button>
            </div>
          </div>`;
        }).join('')
        : '<p style="color:var(--color-text-tertiary);font-size:0.8125rem">메뉴 정보가 없습니다</p>';

      updateModalRegularBtn();

      renderReviews(restaurant.id);

      const _sb = document.querySelector(".modal-scroll-body");
      if (_sb) _sb.scrollTop = 0;            // 새 식당 열 때 맨 위부터
      document.getElementById("modalOverlay").classList.add("open");
      document.body.style.overflow = "hidden";

      setTimeout(() => initModalMap(restaurant), 400);
    };

    // ─── 리뷰 ───────────────────────────────
    let _myReviewDraft = { rating: 0 };

    // 별점별 추천 태그 (1~5점 각기 다른 멘트)
    const QUICK_TAGS_BY_RATING = {
      5: ["완전 맛있어요","또 올 거예요","강력 추천","양이 푸짐해요","분위기 최고","친절해요","가성비 좋아요","인테리어 예뻐요","재료가 신선해요","데이트하기 좋아요"],
      4: ["맛있어요","만족스러워요","가성비 좋아요","또 올 만해요","친절해요","양 적당해요","깔끔해요","혼밥하기 좋아요","분위기 좋아요","무난하게 좋아요"],
      3: ["무난해요","평범해요","가격은 적당","나쁘지 않아요","그럭저럭이에요","기본은 해요","특별하진 않아요","다시 갈진 모르겠어요","가끔 생각나요","호불호 갈려요"],
      2: ["좀 아쉬워요","기대보단 별로","가격대비 아쉬워요","양이 적어요","불친절해요","음식의 질이 아쉬워요","위생이 걱정돼요","웨이팅 길어요","시끄러워요","재방문 글쎄요"],
      1: ["별로예요","비추천","맛이 아쉬워요","양이 적어요","서비스가 별로예요","위생이 아쉬워요","불친절해요","주차 어려워요","웨이팅 너무 길어요","가격이 비싸요"],
    };
    function quickTagsHtml(rating, onclickFor) {
      const tags = QUICK_TAGS_BY_RATING[rating];
      if (!tags) return `<span class="review-quick-hint">별점을 선택하면 추천 태그가 나와요</span>`;
      return tags.map(t => `<button class="review-quick-tag" onclick="${onclickFor(t)}">${t}</button>`).join('');
    }

    function starsHtml(rating, interactive) {
      let s = "";
      for (let i = 1; i <= 5; i++) {
        const on = i <= rating;
        s += interactive
          ? `<button class="star-btn ${on?'on':''}" onclick="setReviewStar(${i})" aria-label="${i}점">★</button>`
          : `<span class="star ${on?'on':''}">★</span>`;
      }
      return s;
    }

    async function renderReviews(restaurantId) {
      const area = document.getElementById("reviewArea");
      const avgEl = document.getElementById("reviewAvg");
      area.innerHTML = `<div class="review-loading">리뷰 불러오는 중…</div>`;
      avgEl.textContent = "";

      if (!currentUser) {
        area.innerHTML = `<div class="review-empty">로그인하면 리뷰를 보고 남길 수 있어요</div>`;
        return;
      }

      const [mine, list] = await Promise.all([
        getMyReview(currentUser.uid, restaurantId),
        getRestaurantReviews(restaurantId, currentUser.uid, userFriends),
      ]);

      // 평균 별점
      if (list.length) {
        const avg = (list.reduce((a, r) => a + (r.rating||0), 0) / list.length);
        avgEl.innerHTML = `<span class="star on">★</span> ${avg.toFixed(1)} <span class="review-cnt">(${list.length})</span>`;
      }

      // 내 리뷰 작성/수정 폼
      _myReviewDraft = { rating: mine?.rating || 0 };
      const visMap = { friends: "친구만", private: "나만" };
      const myVis = mine?.visibility || "friends";
      const formHtml = `
        <div class="review-form" id="reviewForm">
          <div class="review-form-title">${mine ? "내 리뷰 수정" : "리뷰 남기기"}</div>
          <div class="star-row" id="starRow">${starsHtml(_myReviewDraft.rating, true)}</div>
          <div class="review-quick-tags" id="reviewQuickTags">${quickTagsHtml(_myReviewDraft.rating, t=>`appendReviewTag('${t}')`)}</div>
          <input id="reviewText" class="review-input" maxlength="100" placeholder="한 줄 평 (선택)" autocomplete="off" value="${escapeHtml(mine?.text||'')}" />
          <div class="review-form-bottom">
            <select id="reviewVis" class="review-vis">
              <option value="friends" ${myVis==='friends'?'selected':''}>친구만</option>
              <option value="private" ${myVis==='private'?'selected':''}>나만</option>
            </select>
            <div style="display:flex;gap:6px">
              ${mine ? `<button class="review-del" onclick="handleDeleteReview('${restaurantId}')">삭제</button>` : ``}
              <button class="review-submit" onclick="handleSubmitReview('${restaurantId}')">${mine ? "저장" : "등록"}</button>
            </div>
          </div>
        </div>`;

      // 남들 리뷰 목록 (내 것 제외하고 표시, 내 건 폼 위에 이미 반영)
      const others = list.filter(r => r.uid !== currentUser.uid);
      const listHtml = others.length
        ? others.map(r => `
          <div class="review-item">
            <div class="review-ava">${safeImageSrc(r.photoBase64) ? `<img src="${safeImageSrc(r.photoBase64)}" alt="프로필">` : escapeHtml((r.displayName||'?').charAt(0).toUpperCase())}</div>
            <div class="review-body">
              <div class="review-top">
                <span class="review-name">${escapeHtml(r.displayName||'익명')}</span>
                <span class="review-stars">${starsHtml(r.rating, false)}</span>
              </div>
              ${r.text ? `<div class="review-text">${escapeHtml(r.text)}</div>` : ``}
            </div>
          </div>`).join("")
        : `<div class="review-empty">아직 다른 리뷰가 없어요</div>`;

      area.innerHTML = formHtml + listHtml;
    }

    window.setReviewStar = function(n) {
      _myReviewDraft.rating = n;
      const row = document.getElementById("starRow");
      if (row) row.innerHTML = starsHtml(n, true);
      const tagsEl = document.getElementById("reviewQuickTags");
      if (tagsEl) tagsEl.innerHTML = quickTagsHtml(n, t=>`appendReviewTag('${t}')`);
    };

    window.appendReviewTag = function(tag) {
      const el = document.getElementById("reviewText");
      if (!el) return;
      const cur = el.value.trim();
      el.value = cur ? cur + " · " + tag : tag;
      el.focus();
    };

    window.handleSubmitReview = async function(restaurantId) {
      if (!currentUser) { showToast("로그인이 필요해요"); return; }
      if (!_myReviewDraft.rating) { showToast("별점을 선택해주세요"); return; }
      const text = document.getElementById("reviewText").value.trim();
      const visibility = document.getElementById("reviewVis").value;
      try {
        await setReview(currentUser.uid, userName, userPhoto, restaurantId, {
          rating: _myReviewDraft.rating, text, visibility,
        });
        showToast("리뷰가 저장됐어요");
        renderReviews(restaurantId);
      } catch (e) { showToast("저장 실패. 다시 시도해주세요"); }
    };

    window.handleDeleteReview = async function(restaurantId) {
      if (!currentUser) return;
      try {
        await deleteReview(currentUser.uid, restaurantId);
        showToast("리뷰를 삭제했어요");
        renderReviews(restaurantId);
      } catch (e) { showToast("삭제 실패"); }
    };

    // ── 모달 내 메뉴 하트 일괄 갱신 (카드 하트 토글 시 동기화용) ──
    function updateModalMenuLikes() {
      document.querySelectorAll(".menu-heart-btn").forEach(btn => {
        const menuId = btn.id.replace("menu-heart-", "");
        const liked  = userMenuLikes.includes(menuId);
        btn.innerHTML = liked ? ICONS.heartFill : ICONS.heart;
        btn.classList.toggle("active", liked);
      });
    }

    function updateModalRegularBtn() {
      if (!currentRestaurant) return;
      const isRegular = userRegulars.includes(currentRestaurant.id);
      const btn       = document.getElementById("modalRegularBtn");
      btn.classList.toggle("active", isRegular);
      document.getElementById("modalRegularIcon").innerHTML = isRegular ? ICONS.bookmarkFill : ICONS.bookmark;
      document.getElementById("modalRegularLabel").textContent = isRegular ? "단골 ✓" : "단골";
    }

    window.closeModal = function () {
      document.getElementById("modalOverlay").classList.remove("open");
      document.body.style.overflow = "";
    };

    window.handleModalOutsideClick = function (e) {
      if (e.target === document.getElementById("modalOverlay")) closeModal();
    };

    window.handleModalRegular = async function () {
      if (!currentUser) { showToast("로그인이 필요합니다"); return; }
      if (!currentRestaurant) return;
      const isRegular = userRegulars.includes(currentRestaurant.id);
      if (isRegular) {
        userRegulars = userRegulars.filter(id => id !== currentRestaurant.id);
        await removeRegular(currentUser.uid, currentRestaurant.id);
        showToast("단골 해제");
      } else {
        userRegulars.push(currentRestaurant.id);
        await addRegular(currentUser.uid, currentRestaurant.id);
        showToast("단골 등록");
      }
      updateModalRegularBtn();
      renderGrid();
    };

    window.openKakaoMap = function () {
      if (!currentRestaurant) return;
      window.open(`https://map.kakao.com/link/map/${currentRestaurant.name},${currentRestaurant.lat},${currentRestaurant.lng}`, "_blank");
    };

    window.openKakaoNav = function () {
      if (!currentRestaurant) return;
      window.open(`https://map.kakao.com/link/from/한성대학교,${CONFIG.HANSUNG_LAT},${CONFIG.HANSUNG_LNG}/to/${currentRestaurant.name},${currentRestaurant.lat},${currentRestaurant.lng}`, "_blank");
    };

    // ── 카카오맵 인라인 지도 초기화 ──
    function initModalMap(restaurant) {
      const mapEl = document.getElementById("modalMap");
      if (!mapEl) return;

      function drawMap() {
        mapEl.innerHTML = "";
        const hasCoord = restaurant.lat && restaurant.lng;
        const center   = new kakao.maps.LatLng(
          hasCoord ? restaurant.lat : CONFIG.HANSUNG_LAT,
          hasCoord ? restaurant.lng : CONFIG.HANSUNG_LNG
        );
        const map = new kakao.maps.Map(mapEl, { center, level: 4 });

        const makeMarkerImage = (fill) => {
          const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="32" height="42" viewBox="0 0 32 42">
            <path d="M16 0C7.2 0 0 7 0 15.6c0 10.5 14.4 25 15 25.6.6.5 1.4.5 2 0 .6-.6 15-15.1 15-25.6C32 7 24.8 0 16 0z" fill="${fill}"/>
            <circle cx="16" cy="15" r="5.5" fill="#fff"/>
          </svg>`;
          const url = "data:image/svg+xml;utf8," + encodeURIComponent(svg);
          return new kakao.maps.MarkerImage(url, new kakao.maps.Size(28, 37), { offset: new kakao.maps.Point(14, 37) });
        };
        const grayImg = makeMarkerImage("#9CA3AF");
        const blueImg = makeMarkerImage("#2563EB");

        const hansungPos = new kakao.maps.LatLng(CONFIG.HANSUNG_LAT, CONFIG.HANSUNG_LNG);
        new kakao.maps.Marker({ map, position: hansungPos, image: grayImg });

        if (hasCoord) {
          const restPos = new kakao.maps.LatLng(restaurant.lat, restaurant.lng);
          new kakao.maps.Marker({ map, position: restPos, image: blueImg });
          const bounds = new kakao.maps.LatLngBounds();
          bounds.extend(hansungPos);
          bounds.extend(restPos);
          map.setBounds(bounds, 60);
        }
      }

      if (window.kakao && window.kakao.maps) {
        kakao.maps.load(drawMap);
      } else {
        let retries = 0;
        const wait = setInterval(() => {
          if (window.kakao && window.kakao.maps) { clearInterval(wait); kakao.maps.load(drawMap); }
          else if (++retries > 10) clearInterval(wait);
        }, 300);
      }
    }

    function getCategoryEmoji(category) {
      const map = { 한식:"🍚",중식:"🥢",일식:"🍣",양식:"🍝",분식:"🌮",패스트푸드:"🍔",아시아:"🍜",카페:"☕",기타:"🍽️" };
      return map[category] || "🍽️";
    }

  </script>
