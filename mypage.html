  </button>

  <script>
    // 스크롤 위치에 따라 버튼 표시/숨김
    (function() {
      const btn = document.getElementById("scrollTopBtn");
      if (!btn) return;
      const onScroll = () => {
        if (window.scrollY > 300) btn.classList.add("visible");
        else btn.classList.remove("visible");
      };
      window.addEventListener("scroll", onScroll, { passive: true });
      onScroll();
    })();

    // 테마 토글 FAB (theme.js와 동일한 ff_theme 키 사용)
    (function(){ var f=document.getElementById("themeFab"); if(!f)return;
      f.addEventListener("click",function(){ var h=document.documentElement;
        var n=h.getAttribute("data-theme")==="dark"?"light":"dark";
        h.setAttribute("data-theme",n); localStorage.setItem("ff_theme",n); window.__persistAppearance && window.__persistAppearance({theme:n}); }); })();
  </script>

  <script src="./sidebar.js"></script>
  <script type="module">
    import { getMenusByRestaurant, getAllMenus, getUserDoc,
             addMenuLike, removeMenuLike,
             clearRecentViews as fbClearRecent,
             removeRecentView as fbRemoveRecent,
             addRegular, removeRegular,
             updateUserProfile,
             getTasteProfile, resetTasteProfile,
             getBlockedMenus, unblockMenu, clearBlockedMenus,
             getStorageUrl, getRestaurantPhoto, getOpenStatus, seoulNow, formatDistance, loadRestaurantData,
             updateNavAvatar,
             applyAccent, ACCENT_COLORS,
             getUserSettings, updateUserSettings,
             saveUserIdentity, findUserByEmail, sendFriendRequest, acceptFriendRequest,
             rejectFriendRequest, cancelFriendRequest, removeFriend, getUsersByIds,
             getFriendsFeed, getMyReviews,
             setReview, deleteReview, getMyReview, getRestaurantReviews,
           } from "./firebase.js";
    import { onAuthChanged, logout } from "./auth.js";
    import { ICONS, applyIcons } from "./icons.js";
    import { escapeHtml, safeImageSrc } from "./escape.js";
    applyIcons();

    // ── 대표색(Accent) ──
    const ACCENT_LABELS = { orange:"주황", red:"빨강", amber:"노랑", green:"초록", blue:"파랑", purple:"보라", pink:"분홍" };
    const ACCENT_PREVIEW = { orange:"#F4502E", red:"#E53935", amber:"#E8961B", green:"#2E9E5B", blue:"#2D7FF9", purple:"#7C4DFF", pink:"#E84393" };

    const catEmoji = { 한식:"🍚",중식:"🥢",일식:"🍣",양식:"🍝",분식:"🌮",패스트푸드:"🍔",아시아:"🍜",카페:"☕",기타:"🍽️" };

    let allRestaurants     = [];
    let allMenus           = [];   // 전체 메뉴 (좋아요한 음식 섹션용)
    let currentUser        = null;
    let userData           = null;
    let tasteProfile       = null;
    let blockedMenus       = [];
    let currentViewallType = null;

    // escapeHtml은 escape.js에서 import (중복 정의 제거)

    onAuthChanged(async (user) => {
      currentUser    = user;
      try {
        const { restaurants, menus } = await loadRestaurantData(true);
        allMenus       = menus;
        allRestaurants = restaurants.map(r => ({ ...r, photo: getRestaurantPhoto(r, menus) }));
        if (!user) { updateNavAvatar(null); renderGuest(); return; }
        userData = await getUserDoc(user.uid);
        saveUserIdentity(user.uid, user.email, user.displayName);  // 이메일 백필(친구 검색용)
        tasteProfile = await getTasteProfile(user.uid);
        blockedMenus = await getBlockedMenus(user.uid);
        updateNavAvatar(user, userData);
        renderAll();
      } catch (err) {
        // 로드 실패 → 영구 스피너 대신 에러 안내
        console.error("마이페이지 로드 실패:", err);
        updateNavAvatar(user || null);
        const main = document.getElementById("mainContent");
        if (main) {
          main.classList.add("is-single-col");
          main.innerHTML = `
            <div class="guest-section">
              <div class="guest-icon">${ICONS.frown}</div>
              <div class="guest-title">불러오지 못했어요</div>
              <div class="guest-sub">네트워크 확인 후 다시 시도해주세요</div>
              <button class="btn-primary" onclick="location.reload()" style="max-width:200px">새로고침</button>
            </div>`;
        }
      }
    });

    // ─── RENDER ───────────────────────────────

    function renderGuest() {
      const isGuest = sessionStorage.getItem("guestMode") === "true";
      const title   = isGuest ? "둘러보기 모드예요" : "로그인이 필요해요";
      const sub     = isGuest
        ? "로그인하면 좋아요·단골 맛집과<br/>스와이프 기록을 저장할 수 있어요"
        : "로그인하면 좋아요, 단골 맛집을<br/>한눈에 확인할 수 있어요";

      const main = document.getElementById("mainContent");
      main.classList.add("is-single-col");
      main.innerHTML = `
        <div class="guest-section">
          <div class="guest-icon">${ICONS.user}</div>
          <div class="guest-title">${title}</div>
          <div class="guest-sub">${sub}</div>
          <button class="btn-primary" onclick="goLogin()" style="max-width:200px">로그인하기</button>
        </div>
        <div class="settings-footer">FOOD FIRST v1.0.0<br/>한성대학교 융합보안학과</div>`;
    }

    window.goLogin = function () {
      sessionStorage.removeItem("guestMode");
      location.href = "./login.html";
    };

    function renderAll() {
      const menuLikedIds = [...(userData.menuLikes  || [])].reverse();
      const recentIds    = userData.recentViews || [];
      const regularIds   = [...(userData.regulars || [])].reverse();
      const likedMenus = menuLikedIds.map(id => allMenus.find(m => m.id === id)).filter(Boolean);
      const recent     = recentIds  .map(id => allRestaurants.find(r => r.id === id)).filter(Boolean);
      const regulars   = regularIds .map(id => allRestaurants.find(r => r.id === id)).filter(Boolean);

      const nameInitial = (currentUser.displayName||"U")[0].toUpperCase();
      const displayName = userData.displayName || currentUser.displayName || '사용자';
      const photoSrc    = userData.photoBase64 || currentUser.photoURL || '';

      const main = document.getElementById("mainContent");
      main.classList.remove("is-single-col");
      main.innerHTML = `
        <div class="mp-left-col">
        <div class="profile-section">
          <div class="profile-top">
            <div class="profile-avatar" style="cursor:default">
              ${photoSrc
                ? `<img src="${escapeHtml(photoSrc)}" alt="프로필" onerror="this.style.display='none'" />`
                : escapeHtml(nameInitial)}
            </div>
            <div class="profile-info">
              <div class="profile-name">${escapeHtml(displayName)}님</div>
              <div class="profile-email">${escapeHtml(currentUser.email||'')}</div>
            </div>
            <button class="btn-settings" onclick="openSettingsSheet()">설정</button>
            <button class="btn-logout" onclick="openLogoutConfirm()">로그아웃</button>
          </div>
          <div class="stats-row">
            <div class="stat-item"><div class="stat-number" id="statSwipe">0</div><div class="stat-label">스와이프</div></div>
            <div class="stat-item"><div class="stat-number" id="statLikes">0</div><div class="stat-label">좋아요 음식</div></div>
            <div class="stat-item"><div class="stat-number" id="statRegulars">0</div><div class="stat-label">단골</div></div>
          </div>
        </div>

        <div class="profile-section friends-card" id="friendsCard">
          <div class="fr-loading">친구 불러오는 중…</div>
        </div>
        </div><!-- /mp-left-col -->

        <div class="mp-right-col">
          <div class="section-wrap mp-list-section" id="friendFeedWrap">
            <div class="section-header">
              <div class="section-title"><span class="ic">${ICONS.heartFill}</span> 친구 활동</div>
            </div>
            <div id="friendFeedList"><div class="fr-loading">불러오는 중…</div></div>
          </div>

          <div class="section-wrap mp-list-section">
            <div class="section-header">
              <div class="section-title"><span class="ic">${ICONS.eye}</span> 최근 본 맛집</div>
              <div class="section-right">
                ${recent.length>0?`<button class="btn-view-all" id="recentViewAllBtn" onclick="openViewall('recent')">전체보기 ${recent.length}개 ›</button>`:''}
              </div>
            </div>
            <div id="recentList">${buildScrollCards(recent.slice(0,5),'recent')}</div>
          </div>

          <div class="section-wrap mp-list-section">
            <div class="section-header">
              <div class="section-title"><span class="ic">${ICONS.heartFill}</span> 좋아요한 음식</div>
              <div class="section-right">
                ${likedMenus.length>0?`<button class="btn-view-all" id="likesViewAllBtn" onclick="openViewall('likes')">전체보기 ${likedMenus.length}개 ›</button>`:''}
              </div>
            </div>
            <div id="likesList">${buildScrollMenuCards(likedMenus.slice(0,5))}</div>
          </div>

          <div class="section-wrap mp-list-section">
            <div class="section-header">
              <div class="section-title"><span class="ic">${ICONS.bookmark}</span> 단골 식당</div>
              <div class="section-right">
                ${regulars.length>0?`<button class="btn-view-all" id="regularsViewAllBtn" onclick="openViewall('regulars')">전체보기 ${regulars.length}개 ›</button>`:''}
              </div>
            </div>
            <div id="regularsList">${buildScrollCards(regulars.slice(0,5),'regulars')}</div>
          </div>

          <div class="section-wrap mp-list-section" id="myReviewsWrap">
            <div class="section-header">
              <div class="section-title"><span class="ic">${ICONS.star || "⭐"}</span> 내가 남긴 리뷰</div>
              <div class="section-right" id="reviewsViewAllWrap"></div>
            </div>
            <div id="myReviewsList"><div class="fr-loading">불러오는 중…</div></div>
          </div>
          <div class="section-wrap mp-list-section" id="tasteSectionWrap">
            ${renderTasteSection()}
          </div>
          <div class="section-wrap mp-list-section" id="blockedSectionWrap">
            ${renderBlockedSection()}
          </div>
        </div>

        <div class="settings-footer">FOOD FIRST v1.0.0<br/>한성대학교 융합보안학과<br/>© 2026 아무거나</div>`;

      animateCount("statSwipe",    userData.swipeCount||0);
      animateCount("statLikes",    menuLikedIds.length);
      animateCount("statRegulars", regularIds.length);
      renderFriendsInline();
      renderFriendFeed();
      renderMyReviews();
    }

    // ─── 취향 분석 섹션 ───
    function renderTasteSection() {
      if (!tasteProfile || tasteProfile.sessionCount === 0) {
        return `
          <div class="section-header">
            <div class="section-title"><span class="ic">${ICONS.target}</span> 취향 분석</div>
          </div>
          <div class="empty-mini">
            <div class="empty-mini-icon">${ICONS.target}</div>
            <div class="empty-mini-text">스와이프를 완료하면<br/>취향 데이터가 쌓여요!</div>
          </div>`;
      }

      const tagScore = tasteProfile.tagScore || {};
      const topTags = Object.entries(tagScore).sort((a, b) => b[1] - a[1]).slice(0, 8);
      const maxScore = topTags[0]?.[1] || 1;
      const sessionCount = tasteProfile.sessionCount || 0;

      return `
        <div class="section-header">
          <div class="section-title"><span class="ic">${ICONS.target}</span> 취향 분석</div>
          <div class="section-count">${sessionCount}회 누적</div>
        </div>

        ${topTags.length > 0 ? `
        <div style="background:var(--color-bg-card);border-radius:var(--radius-lg);padding:16px;box-shadow:var(--shadow-card);margin-bottom:12px">
          <div style="font-size:0.8125rem;font-weight:600;color:var(--color-text-secondary);margin-bottom:12px">선호 태그 TOP ${topTags.length}</div>
          ${topTags.map(([tag, score]) => `
            <div style="margin-bottom:8px">
              <div style="display:flex;justify-content:space-between;font-size:0.8125rem;margin-bottom:3px">
                <span style="font-weight:500">${escapeHtml(tag)}</span>
                <span style="color:var(--color-primary);font-weight:700">${score}회</span>
              </div>
              <div style="height:6px;background:var(--color-bg-input);border-radius:999px;overflow:hidden">
                <div style="height:100%;width:${Math.round((score/maxScore)*100)}%;background:var(--color-primary);border-radius:999px;transition:width 0.5s"></div>
              </div>
            </div>`).join('')}
        </div>` : ''}
        <button onclick="handleResetTaste()" style="width:100%;padding:12px;background:var(--color-bg-card);border:1.5px solid var(--color-border);border-radius:var(--radius-lg);font-size:0.8125rem;font-weight:600;color:var(--color-text-secondary);cursor:pointer;font-family:var(--font-main);transition:border-color 0.15s,color 0.15s"
          onmouseover="this.style.borderColor='var(--color-danger)';this.style.color='var(--color-danger)'"
          onmouseout="this.style.borderColor='var(--color-border)';this.style.color='var(--color-text-secondary)'">
          <span class="ic">${ICONS.trash}</span> 취향 데이터 초기화
        </button>`;
    }

    // ─── 다시 보지 않기 (차단 메뉴) 섹션 ───
    function renderBlockedSection() {
      if (!blockedMenus || blockedMenus.length === 0) return "";
      return `
        <div class="section-header">
          <div class="section-title"><span class="ic">${ICONS.ban}</span> 다시 보지 않기</div>
          <div class="section-right">
            <span class="section-count">${blockedMenus.length}개</span>
            <button class="btn-clear" onclick="handleClearBlocked()">전체 초기화</button>
          </div>
        </div>
        <div style="display:flex;flex-direction:column;gap:8px;max-height:280px;overflow-y:auto;padding-right:2px">
          ${blockedMenus.map(m => `
            <div style="display:flex;align-items:center;justify-content:space-between;background:var(--color-bg-card);border-radius:var(--radius-lg);padding:12px 14px;box-shadow:var(--shadow-card);flex-shrink:0">
              <div style="min-width:0;flex:1">
                <div style="font-size:0.875rem;font-weight:600">${escapeHtml(m.menuName)}</div>
                <div style="font-size:0.75rem;color:var(--color-text-secondary);margin-top:2px">${escapeHtml(m.restaurantName)}</div>
              </div>
              <button onclick="handleUnblock('${escapeHtml(m.menuId)}')" style="padding:6px 12px;background:#FFEBEE;color:var(--color-danger);border:none;border-radius:var(--radius-full);font-size:0.75rem;font-weight:600;cursor:pointer;font-family:var(--font-main);flex-shrink:0;margin-left:8px">
                해제
              </button>
            </div>`).join('')}
        </div>`;
    }

    // ─── 취향 데이터 초기화 ───
    window.handleResetTaste = function () {
      if (!currentUser) return;
      openActionConfirm({
        icon: ICONS.target,
        title: "취향 데이터를 초기화할까요?",
        desc: "스와이프 기록이 모두 삭제되며<br/>되돌릴 수 없습니다.",
        okLabel: "초기화",
        onConfirm: async () => {
          try {
            await resetTasteProfile(currentUser.uid);
            tasteProfile = { tagScore: {}, sessionCount: 0 };
            const el = document.getElementById("tasteSectionWrap");
            if (el) el.innerHTML = renderTasteSection();
            showToast("취향 데이터가 초기화됐어요");
          } catch (e) {
            console.error(e);
            showToast("초기화 실패. 다시 시도해주세요");
          }
        },
      });
    };

    // ─── 차단 메뉴 해제 ───
    window.handleUnblock = async function (menuId) {
      if (!currentUser) return;
      try {
        await unblockMenu(currentUser.uid, menuId);
        blockedMenus = blockedMenus.filter(m => m.menuId !== menuId);
        const el = document.getElementById("blockedSectionWrap");
        if (el) el.innerHTML = renderBlockedSection();
        showToast("다시 보지 않기를 해제했어요");
      } catch (e) {
        console.error(e);
        showToast("해제 실패. 다시 시도해주세요");
      }
    };

    // ─── 차단 메뉴 전체 초기화 ───
    window.handleClearBlocked = function () {
      if (!currentUser) return;
      openActionConfirm({
        icon: ICONS.ban,
        title: "다시 보지 않기를 모두 초기화할까요?",
        desc: "차단한 메뉴 목록이<br/>모두 삭제돼요.",
        okLabel: "초기화",
        onConfirm: async () => {
          try {
            await clearBlockedMenus(currentUser.uid);
            blockedMenus = [];
            const el = document.getElementById("blockedSectionWrap");
            if (el) el.innerHTML = renderBlockedSection();
            showToast("다시 보지 않기 목록을 초기화했어요");
          } catch (e) {
            console.error(e);
            showToast("초기화 실패. 다시 시도해주세요");
          }
        },
      });
    };

    // ─── 메뉴 스크롤 카드 (좋아요한 음식용) ─────
    function buildScrollMenuCards(menus) {
      if (!menus.length) {
        return `<div class="empty-mini"><div class="empty-mini-icon">${ICONS.heartFill}</div><div class="empty-mini-text">아직 좋아요한 음식이 없어요</div></div>`;
      }
      return `<div class="restaurant-scroll">${menus.map(m => {
        const restaurant = allRestaurants.find(r => String(r.id) === String(m.restaurantId));
        const name = escapeHtml(m.name);
        const emoji = catEmoji[restaurant?.category] || '🍽️';
        return `
        <div class="scroll-card" role="button" tabindex="0" onclick="openRestaurant('${escapeHtml(String(m.restaurantId))}')">
          <div class="scroll-card-img">
            ${m.photo
              ? `<img src="${getStorageUrl(m.photo)}" alt="${name}" onerror="this.replaceWith(Object.assign(document.createElement('span'),{textContent:'${emoji}',style:'font-size:1.75rem'}))" />`
              : `<span style="font-size:1.75rem">${emoji}</span>`}
          </div>
          <div class="scroll-card-info">
            <div class="scroll-card-name">${name}</div>
            <div class="scroll-card-meta">${escapeHtml(restaurant?.name || '-')}</div>
          </div>
        </div>`;
      }).join('')}</div>`;
    }

    // ─── 스크롤 카드 ──────────────────────────

    function buildScrollCards(restaurants, type) {
      if (restaurants.length === 0) {
        const msgs  = { recent:'최근 본 맛집이 없어요', regulars:'단골 식당이 없어요. 식당 상세에서 등록해보세요!' };
        const icons = { recent: ICONS.eye, regulars: ICONS.bookmark };
        return `<div class="empty-mini"><div class="empty-mini-icon">${icons[type]||ICONS.search}</div><div class="empty-mini-text">${msgs[type]||''}</div></div>`;
      }
      return `<div class="restaurant-scroll">${restaurants.map(r=>{
        const emoji = catEmoji[r.category]||'🍽️';
        const name  = escapeHtml(r.name);
        const cat   = escapeHtml(r.category);
        return `
        <div class="scroll-card" role="button" tabindex="0" onclick="openRestaurant('${escapeHtml(r.id)}')">
          <div class="scroll-card-img">
            ${r.photo
                ? `<img src="${getStorageUrl(r.photo)}" alt="${name}" onerror="this.replaceWith(Object.assign(document.createElement('span'),{textContent:'${emoji}',style:'font-size:1.75rem'}))" />`
                : `<span style="font-size:1.75rem">${emoji}</span>`}
          </div>
          <div class="scroll-card-info">
            <div class="scroll-card-name">${name}</div>
            <div class="scroll-card-meta">${cat} · ${(r.lat && r.lng) ? formatDistance(CONFIG.HANSUNG_LAT, CONFIG.HANSUNG_LNG, r.lat, r.lng) : (r.distance ? r.distance + 'km' : '-')}</div>
          </div>
        </div>`;
      }).join('')}</div>`;
    }

    // ─── 전체보기 바텀시트 ────────────────────

    let isSelectMode = false;
    let selectedIds  = new Set();

    window.openViewall = function(type) {
      isSelectMode = false;
      selectedIds.clear();
      currentViewallType = type;
      const titles = { likes:'좋아요한 음식', recent:'최근 본 맛집', regulars:'단골 식당', reviews:'내가 남긴 리뷰' };
      const list   = getList(type);
      document.getElementById("viewallTitle").textContent = `${titles[type]} ${list.length}개`;
      const hasItems = list.length > 0;
      document.getElementById("viewallClearBtn").style.display  = hasItems ? '' : 'none';
      document.getElementById("viewallSelectBtn").style.display = hasItems ? '' : 'none';
      document.getElementById("viewallSelectBar").style.display = 'none';
      document.getElementById("viewallGrid").innerHTML = buildGridCards(list, type);
      document.getElementById("viewallOverlay").classList.add("open");
      document.body.style.overflow = "hidden";
    };

    window.closeViewall = function() {
      isSelectMode = false;
      selectedIds.clear();
      document.getElementById("viewallOverlay").classList.remove("open");
      document.body.style.overflow = "";
    };

    document.getElementById("viewallOverlay").addEventListener("click", e => {
      if (e.target === document.getElementById("viewallOverlay")) closeViewall();
    });

    function getList(type) {
      const menuLikedIds = [...(userData?.menuLikes   || [])].reverse();
      const recentIds    = userData?.recentViews  || [];
      const regularIds   = [...(userData?.regulars || [])].reverse();
      if (type==='likes')    return menuLikedIds.map(id=>allMenus.find(m=>m.id===id)).filter(Boolean);
      if (type==='recent')   return recentIds   .map(id=>allRestaurants.find(r=>r.id===id)).filter(Boolean);
      if (type==='regulars') return regularIds  .map(id=>allRestaurants.find(r=>r.id===id)).filter(Boolean);
      if (type==='reviews')  return _myReviews || [];
      return [];
    }

    function buildGridCards(items, type) {
      if (!items.length) return `<div style="grid-column:1/-1" class="empty-mini"><div class="empty-mini-icon">🍽️</div><div class="empty-mini-text">목록이 비어있어요</div></div>`;

      // reviews 타입 — myrev-card 구조로 전체 너비 표시
      if (type === 'reviews') {
        return `<div style="grid-column:1/-1">${items.map(rv => {
          const selected = selectedIds.has(rv.restaurantId);
          if (isSelectMode) {
            const r = allRestaurants.find(x => x.id === rv.restaurantId);
            const name = r ? escapeHtml(r.name) : "(삭제된 식당)";
            const menuWithPhoto = allMenus.find(m => String(m.restaurantId) === String(rv.restaurantId) && m.photo);
            const emoji = catEmoji[r?.category] || '🍽️';
            const thumbHtml = menuWithPhoto
              ? `<img src="${getStorageUrl(menuWithPhoto.photo)}" alt="" onerror="this.style.display='none'">`
              : `<span style="font-size:1.5rem">${emoji}</span>`;
            return `
              <div class="myrev-card${selected?' grid-card-selected':''}" role="button" tabindex="0" onclick="toggleSelectCard('${rv.restaurantId}')">
                <div class="myrev-thumb" style="position:relative">${thumbHtml}
                  <div class="grid-select-dot${selected?' grid-card-selected':''}">${selected?'✓':''}</div>
                </div>
                <div class="myrev-left">
                  <div style="display:flex;align-items:center;gap:6px;margin-bottom:3px">
                    <span class="myrev-stars">${"★".repeat(rv.rating||0)}<span class="feed-review-off">${"★".repeat(5-(rv.rating||0))}</span></span>
                  </div>
                  <div class="feed-line"><b>${name}</b></div>
                  ${rv.text ? `<div class="feed-review" style="color:var(--color-text-secondary)">${escapeHtml(rv.text)}</div>` : ""}
                </div>
              </div>`;
          }
          return _buildReviewCard(rv);
        }).join('')}</div>`;
      }

      // likes 타입은 메뉴 단위
      if (type === 'likes') {
        return items.map(m => {
          const restaurant = allRestaurants.find(r => String(r.id) === String(m.restaurantId));
          const emoji  = catEmoji[restaurant?.category] || '🍽️';
          const name   = escapeHtml(m.name);
          const id     = escapeHtml(m.id);
          const selected = selectedIds.has(m.id);
          if (isSelectMode) {
            return `
            <div class="grid-card${selected?' grid-card-selected':''}" role="button" tabindex="0" onclick="toggleSelectCard('${id}')">
              <div class="grid-card-img">
                ${m.photo
                  ? `<img src="${getStorageUrl(m.photo)}" alt="${name}" onerror="this.replaceWith(Object.assign(document.createElement('span'),{textContent:'${emoji}',style:'font-size:1.75rem'}))" />`
                  : `<span style="font-size:1.75rem">${emoji}</span>`}
                <div class="grid-select-dot">${selected?'✓':''}</div>
              </div>
              <div class="grid-card-info">
                <div class="grid-card-name">${name}</div>
                <div class="grid-card-meta">${escapeHtml(restaurant?.name||'-')}</div>
              </div>
            </div>`;
          }
          return `
          <div class="grid-card" role="button" tabindex="0" onclick="openRestaurant('${escapeHtml(String(m.restaurantId))}')">
            <div class="grid-card-img">
              ${m.photo
                ? `<img src="${getStorageUrl(m.photo)}" alt="${name}" onerror="this.replaceWith(Object.assign(document.createElement('span'),{textContent:'${emoji}',style:'font-size:1.75rem'}))" />`
                : `<span style="font-size:1.75rem">${emoji}</span>`}
              <button class="grid-btn" style="top:4px;right:4px;color:#e53935;font-weight:700;font-size:0.8125rem"
                onclick="handleGridDelete(event,'${id}','likes')">${ICONS.close}</button>
            </div>
            <div class="grid-card-info">
              <div class="grid-card-name">${name}</div>
              <div class="grid-card-meta">${escapeHtml(restaurant?.name||'-')}</div>
            </div>
          </div>`;
        }).join('');
      }

      // recent / regulars 는 식당 단위
      return items.map(r=>{
        const emoji    = catEmoji[r.category]||'🍽️';
        const name     = escapeHtml(r.name);
        const cat      = escapeHtml(r.category);
        const id       = escapeHtml(r.id);
        const selected = selectedIds.has(r.id);
        if (isSelectMode) {
          return `
          <div class="grid-card${selected?' grid-card-selected':''}" role="button" tabindex="0" onclick="toggleSelectCard('${id}')">
            <div class="grid-card-img">
              ${r.photo
                ? `<img src="${getStorageUrl(r.photo)}" alt="${name}" onerror="this.replaceWith(Object.assign(document.createElement('span'),{textContent:'${emoji}',style:'font-size:1.75rem'}))" />`
                : `<span style="font-size:1.75rem">${emoji}</span>`}
              <div class="grid-select-dot">${selected?'✓':''}</div>
            </div>
            <div class="grid-card-info">
              <div class="grid-card-name">${name}</div>
              <div class="grid-card-meta">${cat}</div>
            </div>
          </div>`;
        }
        return `
        <div class="grid-card" role="button" tabindex="0" onclick="openRestaurant('${id}')">
          <div class="grid-card-img">
            ${r.photo
              ? `<img src="${getStorageUrl(r.photo)}" alt="${name}" onerror="this.replaceWith(Object.assign(document.createElement('span'),{textContent:'${emoji}',style:'font-size:1.75rem'}))" />`
              : `<span style="font-size:1.75rem">${emoji}</span>`}
            <button class="grid-btn" style="top:4px;right:4px;color:#e53935;font-weight:700;font-size:0.8125rem"
              onclick="handleGridDelete(event,'${id}','${escapeHtml(type)}')">${ICONS.close}</button>
          </div>
          <div class="grid-card-info">
            <div class="grid-card-name">${name}</div>
            <div class="grid-card-meta">${cat}</div>
          </div>
        </div>`;
      }).join('');
    }

    window.toggleSelectCard = function(id) {
      if (!isSelectMode) return;
      if (selectedIds.has(id)) selectedIds.delete(id);
      else selectedIds.add(id);
      const list = getList(currentViewallType);
      document.getElementById("viewallGrid").innerHTML = buildGridCards(list, currentViewallType);
      updateSelectCount();
    };

    window.enterSelectMode = function() {
      isSelectMode = true;
      selectedIds.clear();
      document.getElementById("viewallSelectBar").style.display = "flex";
      document.getElementById("viewallClearBtn").style.display  = "none";
      document.getElementById("viewallSelectBtn").style.display = "none";
      const list = getList(currentViewallType);
      document.getElementById("viewallGrid").innerHTML = buildGridCards(list, currentViewallType);
      updateSelectCount();
    };

    window.exitSelectMode = function() {
      isSelectMode = false;
      selectedIds.clear();
      document.getElementById("viewallSelectBar").style.display = "none";
      const list = getList(currentViewallType);
      document.getElementById("viewallClearBtn").style.display  = list.length > 0 ? "" : "none";
      document.getElementById("viewallSelectBtn").style.display = list.length > 0 ? "" : "none";
      document.getElementById("viewallGrid").innerHTML = buildGridCards(list, currentViewallType);
    };

    function updateSelectCount() {
      const n = selectedIds.size;
      document.getElementById("selectCountText").textContent = `${n}개 선택됨`;
      const btn = document.getElementById("selectDeleteBtn");
      btn.textContent  = `삭제 (${n}개)`;
      btn.disabled     = n === 0;
      btn.style.color  = n > 0 ? "var(--color-danger)" : "var(--color-text-tertiary)";
    }

    window.handleSelectDelete = async function() {
      if (selectedIds.size === 0) return;
      const count = selectedIds.size;
      const type  = currentViewallType;
      openActionConfirm({
        icon: ICONS.trash, title: `선택한 ${count}개를 삭제할까요?`, desc: "선택한 항목들이 삭제됩니다.",
        onConfirm: async () => {
          for (const id of [...selectedIds]) {
            if (type === 'likes') {
              userData.menuLikes = (userData.menuLikes||[]).filter(x=>x!==id);
              await removeMenuLike(currentUser.uid, id);
            } else if (type === 'recent') {
              userData.recentViews = (userData.recentViews||[]).filter(x=>x!==id);
              await fbRemoveRecent(currentUser.uid, id);
            } else if (type === 'regulars') {
              userData.regulars = (userData.regulars||[]).filter(x=>x!==id);
              await removeRegular(currentUser.uid, id);
            } else if (type === 'reviews') {
              await deleteReview(currentUser.uid, id);
              _myReviews = _myReviews.filter(rv => rv.restaurantId !== id);
            }
          }
          if (type === 'likes') refreshLikesUI();
          else if (type === 'recent') refreshRecentUI();
          else if (type === 'regulars') refreshRegularsUI();
          else if (type === 'reviews') renderMyReviews();
          showToast(`${count}개 삭제됐어요`);
          exitSelectMode();
          const list = getList(type);
          document.getElementById("viewallGrid").innerHTML = buildGridCards(list, type);
          const titleEl = document.getElementById("viewallTitle");
          titleEl.textContent = titleEl.textContent.replace(/\d+개/, `${list.length}개`);
          if (list.length === 0) {
            document.getElementById("viewallClearBtn").style.display  = 'none';
            document.getElementById("viewallSelectBtn").style.display = 'none';
          }
        },
      });
    };

    // ─── 개별 삭제 ────────────────────────────

    window.handleGridDelete = async function(e, id, type) {
      e.stopPropagation();
      if (!currentUser) return;
      if (type==='likes') {
        userData.menuLikes = (userData.menuLikes||[]).filter(x=>x!==id);
        await removeMenuLike(currentUser.uid, id);
        showToast("좋아요 취소");
        refreshLikesUI();
      } else if (type==='recent') {
        userData.recentViews = (userData.recentViews||[]).filter(x=>x!==id);
        await fbRemoveRecent(currentUser.uid, id);
        showToast("삭제됐어요");
        refreshRecentUI();
      } else if (type==='regulars') {
        userData.regulars = (userData.regulars||[]).filter(x=>x!==id);
        await removeRegular(currentUser.uid, id);
        showToast("단골 해제");
        refreshRegularsUI();
      }
      const list = getList(type);
      document.getElementById("viewallGrid").innerHTML = buildGridCards(list, type);
      document.getElementById("viewallTitle").textContent =
        document.getElementById("viewallTitle").textContent.replace(/\d+개/, `${list.length}개`);
      document.getElementById("viewallClearBtn").style.display  = list.length > 0 ? '' : 'none';
      document.getElementById("viewallSelectBtn").style.display = list.length > 0 ? '' : 'none';
    };

    window.handleViewallClearAll = function() {
      if (!currentUser) return;
      const opts = {
        recent:   { icon:ICONS.eye, title:"최근 본 맛집을 모두 삭제할까요?", desc:"최근 본 맛집 기록이<br/>모두 사라져요.",
                    run: doClearRecent,   title0:'최근 본 맛집 0개' },
        likes:    { icon:ICONS.heartFill, title:"좋아요를 모두 취소할까요?", desc:"좋아요한 음식이<br/>모두 사라져요.",
                    run: doClearLikes,    title0:'좋아요한 음식 0개' },
        regulars: { icon:ICONS.bookmark, title:"단골 식당을 모두 해제할까요?",   desc:"단골로 등록한 식당이<br/>모두 사라져요.",
                    run: doClearRegulars, title0:'단골 식당 0개' },
        reviews:  { icon:ICONS.trash, title:"리뷰를 모두 삭제할까요?", desc:"남긴 리뷰가<br/>모두 사라져요.",
                    run: doClearReviews,  title0:'내가 남긴 리뷰 0개' },
      }[currentViewallType];
      if (!opts) return;

      const type = currentViewallType;
      openActionConfirm({
        icon: opts.icon, title: opts.title, desc: opts.desc,
        onConfirm: async () => {
          await opts.run();
          if (currentViewallType === type) {
            document.getElementById("viewallGrid").innerHTML = buildGridCards([], type);
            document.getElementById("viewallTitle").textContent = opts.title0;
            document.getElementById("viewallClearBtn").style.display  = 'none';
            document.getElementById("viewallSelectBtn").style.display = 'none';
          }
          showToast("전체 삭제됐어요");
        },
      });
    };

    // ─── UI 리프레시 ──────────────────────────

    function refreshLikesUI() {
      const likedMenus = [...(userData.menuLikes||[])].reverse()
        .map(id=>allMenus.find(m=>m.id===id)).filter(Boolean);
      document.getElementById("likesList").innerHTML = buildScrollMenuCards(likedMenus.slice(0,5));
      animateCount("statLikes", likedMenus.length);
      const btn = document.getElementById("likesViewAllBtn");
      if (btn) btn.textContent = `전체보기 ${likedMenus.length}개 ›`;
    }

    function refreshRecentUI() {
      const recent = (userData.recentViews||[]).map(id=>allRestaurants.find(r=>r.id===id)).filter(Boolean);
      document.getElementById("recentList").innerHTML = buildScrollCards(recent.slice(0,5),'recent');
      const btn = document.getElementById("recentViewAllBtn");
      if (btn) btn.textContent = `전체보기 ${recent.length}개 ›`;
    }

    function refreshRegularsUI() {
      const regulars = [...(userData.regulars||[])].reverse().map(id=>allRestaurants.find(r=>r.id===id)).filter(Boolean);
      document.getElementById("regularsList").innerHTML = buildScrollCards(regulars.slice(0,5),'regulars');
      animateCount("statRegulars", regulars.length);
      const btn = document.getElementById("regularsViewAllBtn");
      if (btn) btn.textContent = `전체보기 ${regulars.length}개 ›`;
    }

    // ─── 전체 삭제 확인 모달 ──────────────────

    let pendingConfirmAction = null;

    function openActionConfirm({ icon, title, desc, okLabel, onConfirm }) {
      document.getElementById("actionConfirmIcon").innerHTML  = icon || ICONS.trash;
      document.getElementById("actionConfirmTitle").textContent = title;
      document.getElementById("actionConfirmDesc").innerHTML    = desc;
      document.getElementById("actionConfirmOk").textContent    = okLabel || "삭제";
      pendingConfirmAction = onConfirm;
      document.getElementById("actionConfirm").classList.add("open");
    }

    window.closeActionConfirm = function() {
      document.getElementById("actionConfirm").classList.remove("open");
      pendingConfirmAction = null;
    };

    document.getElementById("actionConfirmOk").addEventListener("click", async () => {
      const action = pendingConfirmAction;
      closeActionConfirm();
      if (action) await action();
    });

    document.getElementById("actionConfirm").addEventListener("click", e => {
      if (e.target === document.getElementById("actionConfirm")) closeActionConfirm();
    });

    // ─── 전체 삭제 실행부 ─────────────────────

    async function doClearRecent() {
      await fbClearRecent(currentUser.uid);
      userData.recentViews = [];
      refreshRecentUI();
    }

    async function doClearLikes() {
      for (const id of [...(userData.menuLikes||[])]) await removeMenuLike(currentUser.uid, id);
      userData.menuLikes = [];
      refreshLikesUI();
    }

    async function doClearRegulars() {
      for (const id of [...(userData.regulars||[])]) await removeRegular(currentUser.uid, id);
      userData.regulars = [];
      refreshRegularsUI();
    }

    async function doClearReviews() {
      for (const rv of [...(_myReviews||[])]) await deleteReview(currentUser.uid, rv.restaurantId);
      _myReviews = [];
      renderMyReviews();
    }

    // ─── 기타 액션 ────────────────────────────

    window.openRestaurant = function(id) {
      // 전체보기 시트가 열려있으면 닫고 모달 열기
      document.getElementById("viewallOverlay").classList.remove("open");
      openModal(id);
    };

    window.openLogoutConfirm  = () => document.getElementById("logoutConfirm").classList.add("open");
    window.closeLogoutConfirm = () => document.getElementById("logoutConfirm").classList.remove("open");
    window.confirmLogout = async () => { await logout(); window.location.href="./login.html"; };

    document.getElementById("logoutConfirm").addEventListener("click", e => {
      if (e.target===document.getElementById("logoutConfirm")) closeLogoutConfirm();
    });

    window.toggleDarkMode = function() {
      const html = document.documentElement;
      const next = html.getAttribute("data-theme")==="dark" ? "light" : "dark";
      html.setAttribute("data-theme", next);
      localStorage.setItem("ff_theme", next);
      const btn = document.getElementById("darkToggle");
      if (btn) btn.classList.toggle("on", next==="dark");
      _persistAccent({ theme: next });   // 계정별 저장
    };

    window.changeFontSize = function(dir) {
      const sizes  = ["sm","md","lg","xl"];
      const labels = ["작게","보통","크게","매우 크게"];
      const html   = document.documentElement;
      const cur    = html.getAttribute("data-font-size") || "md";
      const idx    = Math.max(0, Math.min(sizes.length-1, sizes.indexOf(cur) + dir));
      const next   = sizes[idx];
      html.setAttribute("data-font-size", next);
      localStorage.setItem("ff_fontSize", next);
      const label = document.getElementById("fontSizeLabel");
      if (label) label.textContent = labels[idx];
      _persistAccent({ fontSize: next });   // 계정별 저장
    };

    // ── 대표색 선택 (프리셋 + 여러 개의 커스텀 색) ──

    // 현재 대표색 상태를 localStorage에서 읽기
    function _getAccentState() {
      const accent = localStorage.getItem("ff_accent") || "orange";
      const custom = localStorage.getItem("ff_accentCustom") || "";
      let list = [];
      try { list = JSON.parse(localStorage.getItem("ff_accentCustomList") || "[]"); } catch (e) {}
      if (!Array.isArray(list)) list = [];
      return { accent, custom, list };
    }

    // 스와치 영역 HTML 생성: 프리셋 + 추가된 커스텀들 + 항상 남아있는 (+)
    function accentSwatchesHTML() {
      const { accent, custom, list } = _getAccentState();
      const presets = ACCENT_COLORS.map(c =>
        `<button class="accent-swatch ${accent===c?'is-active':''}"
                 title="${ACCENT_LABELS[c]}" aria-label="${ACCENT_LABELS[c]}"
                 style="--sw:${ACCENT_PREVIEW[c]}" onclick="setAccent('${c}')"></button>`
      ).join('');
      const customs = list.map(hex => {
        const on = accent==='custom' && custom.toLowerCase()===hex.toLowerCase();
        return `<span class="accent-chip-wrap">
                 <button class="accent-swatch accent-custom-chip ${on?'is-active':''}"
                   title="${hex}" aria-label="커스텀 색 ${hex}"
                   style="--sw:${hex}" onclick="selectCustom('${hex}')"></button>
                 <button class="accent-chip-del" onclick="event.stopPropagation(); removeCustom('${hex}')" title="이 색 삭제" aria-label="커스텀 색 삭제">×</button>
               </span>`;
      }).join('');
      const plus = `<button class="accent-swatch accent-custom" title="색 추가" aria-label="색상 직접 추가"
                 onclick="openColorPalette()"><span class="plus">+</span></button>`;
      return presets + customs + plus;
    }

    // 스와치 영역만 다시 그리기 (시트 전체 재렌더 없이 즉시 반영)
    function refreshAccentSwatches() {
      const el = document.getElementById("accentSwatches");
      if (el) el.innerHTML = accentSwatchesHTML();
    }

    // 기존 설정을 보존하며 대표색 관련 필드만 갱신해 Firebase에 저장
    async function _persistAccent(patch) {
      if (!currentUser) return;  // 비로그인은 localStorage 캐시만
      try {
        const s = await getUserSettings(currentUser.uid);
        await updateUserSettings(currentUser.uid, { ...s, ...patch });
      } catch (e) { console.error("대표색 저장 실패:", e); }
    }

    // 프리셋 선택
    window.setAccent = function(accent) {
      applyAccent(accent);                       // 즉시 화면 적용 + localStorage
      _persistAccent({ accentColor: accent });   // 계정별 저장
      refreshAccentSwatches();
      showToast(`대표색이 ${ACCENT_LABELS[accent] || ""}(으)로 바뀌었어요`);
    };

    // 이미 추가해둔 커스텀 색 선택
    window.selectCustom = function(hex) {
      applyAccent("custom", hex);
      _persistAccent({ accentColor: "custom", accentCustom: hex });
      refreshAccentSwatches();
      showToast("대표색을 변경했어요");
    };

    // (+) 로 새 커스텀 색 추가 → 목록에 쌓이고 바로 적용 ((+)는 계속 남음)
    window.addCustom = function(hex) {
      const { list } = _getAccentState();
      let next = list;
      if (!list.some(h => h.toLowerCase() === hex.toLowerCase())) {
        next = [...list, hex].slice(-12);   // 최대 12개까지 보관
        try { localStorage.setItem("ff_accentCustomList", JSON.stringify(next)); } catch (e) {}
      }
      applyAccent("custom", hex);
      _persistAccent({ accentColor: "custom", accentCustom: hex, accentCustomList: next });
      refreshAccentSwatches();
      showToast("새 색을 추가했어요");
    };

    // 추가한 커스텀 색 삭제 (프리셋은 삭제 불가)
    window.removeCustom = function(hex) {
      const { accent, custom, list } = _getAccentState();
      const next = list.filter(h => h.toLowerCase() !== hex.toLowerCase());
      try { localStorage.setItem("ff_accentCustomList", JSON.stringify(next)); } catch (e) {}
      const patch = { accentCustomList: next };
      // 지우는 색이 지금 적용 중이면 기본색으로 되돌림
      if (accent === 'custom' && custom.toLowerCase() === hex.toLowerCase()) {
        applyAccent('orange');
        patch.accentColor = 'orange';
        patch.accentCustom = '';
      }
      _persistAccent(patch);
      refreshAccentSwatches();
      showToast("커스텀 색을 삭제했어요");
    };

    // ── 색상 팔레트 (직접 색 만들기) ──
    function _hslToHex(h, s, l) {
      s /= 100; l /= 100;
      const k = n => (n + h / 30) % 12;
      const a = s * Math.min(l, 1 - l);
      const f = n => {
        const c = l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
        return Math.round(255 * c).toString(16).padStart(2, "0");
      };
      return `#${f(0)}${f(8)}${f(4)}`;
    }
    function _currentPaletteHex() {
      const h = +document.getElementById("palH").value;
      const s = +document.getElementById("palS").value;
      const l = +document.getElementById("palL").value;
      return _hslToHex(h, s, l).toUpperCase();
    }
    window.updatePalette = function () {
      const hex = _currentPaletteHex();
      document.getElementById("palettePreview").style.background = hex;
      document.getElementById("paletteHex").textContent = hex;
    };
    window.openColorPalette = function () {
      document.getElementById("palH").value = 180;  // 색조 가운데
      document.getElementById("palS").value = 50;   // 선명도 가운데
      document.getElementById("palL").value = 50;   // 밝기 가운데
      document.getElementById("paletteOverlay").classList.add("open");
      updatePalette();
    };
    window.closeColorPalette = function () {
      document.getElementById("paletteOverlay").classList.remove("open");
    };
    window.confirmCustomColor = function () {
      const hex = _currentPaletteHex();
      addCustom(hex);            // 목록에 추가 + 즉시 적용 + 저장
      closeColorPalette();
    };

    // ── 친구 기능 ──
    function _frAva(u){

      return `<div class="fr-ava">${escapeHtml(ini)}</div>`;
    }

    window.closeFriends = function(){
      document.getElementById("friendsOverlay").classList.remove("open");

    // 마이페이지 본문 좌측 '친구' 카드 렌더 (요청 + 친구목록 + 추가)
    async function renderFriendsInline(){

      html += fr.length ? fr.map(u => `

              ${_frAva(u)}

            <div class="fr-btns">
              <button class="fr-btn del" onclick="frRemove('${u.uid}')">삭제</button>
            </div>
          </div>

          </div>`).join("") : `<div class="fr-empty">아직 친구가 없어요.<br>이메일로 친구를 추가해보세요!</div>`;

      if (sent.length){

        html += sent.map(u => `
          <div class="fr-item">
            ${_frAva(u)}
            <div class="fr-meta"><div class="fr-name">${escapeHtml(u.displayName||"이름 없음")}</div><div class="fr-mail">${escapeHtml(u.email)}</div></div>
            <div class="fr-btns"><button class="fr-btn cancel" onclick="frCancel('${u.uid}')">취소</button></div>
          </div>`).join("");

      card.innerHTML = html;
    }
    window.refreshFriendsUI = renderFriendsInline;   // 알림 벨에서 친구 수락 시 카드 갱신

    // ── 식당 모달 내 리뷰 (홈과 동일 동작) ──
    let _myReviewDraft = { rating: 0 };
    function _starsHtml(rating, interactive, restaurantId) {
      let s = "";
      for (let i = 1; i <= 5; i++) {
        const on = i <= rating;
        if (!interactive) { s += `<span class="star ${on?'on':''}">★</span>`; continue; }
        const handler = restaurantId !== undefined
          ? `setMyRevStar('${restaurantId}', ${i})`
          : `setReviewStar(${i})`;
        s += `<button class="star-btn ${on?'on':''}" onclick="${handler}" aria-label="${i}점">★</button>`;
      }
      return s;
    }
    async function renderReviews(restaurantId) {
      const area = document.getElementById("reviewArea");
      const avgEl = document.getElementById("reviewAvg");
      if (!area) return;
      area.innerHTML = `<div class="review-loading">리뷰 불러오는 중…</div>`;
      avgEl.textContent = "";
      if (!currentUser) { area.innerHTML = `<div class="review-empty">로그인하면 리뷰를 남길 수 있어요</div>`; return; }

      const friends = userData?.friends || [];
      const [mine, list] = await Promise.all([
        getMyReview(currentUser.uid, restaurantId),
        getRestaurantReviews(restaurantId, currentUser.uid, friends),
      ]);
      if (list.length) {
        const avg = list.reduce((a, r) => a + (r.rating||0), 0) / list.length;
        avgEl.innerHTML = `<span class="star on">★</span> ${avg.toFixed(1)} <span class="review-cnt">(${list.length})</span>`;
      }
      _myReviewDraft = { rating: mine?.rating || 0 };
      const myVis = mine?.visibility || "friends";
      const formHtml = `
        <div class="review-form">
          <div class="review-form-title">${mine ? "내 리뷰 수정" : "리뷰 남기기"}</div>
          <div class="star-row" id="starRow">${_starsHtml(_myReviewDraft.rating, true)}</div>
          <div class="review-quick-tags" id="reviewQuickTags">${quickTagsHtml(_myReviewDraft.rating, t=>`appendReviewTag('${t}')`)}</div>
          <input id="reviewText" class="review-input" maxlength="100" placeholder="한 줄 평 (선택)" autocomplete="off" value="${(mine?.text||'').replace(/"/g,'&quot;')}" />
          <div class="review-form-bottom">
            <select id="reviewVis" class="review-vis">
              <option value="friends" ${myVis==='friends'?'selected':''}>친구만</option>
              <option value="private" ${myVis==='private'?'selected':''}>나만</option>
            </select>
            <div style="display:flex;gap:6px">
              ${mine ? `<button class="review-del" onclick="handleDeleteReview('${restaurantId}')">삭제</button>` : ``}
              <button class="review-submit" onclick="handleSubmitReview('${restaurantId}')">${mine ? "저장" : "등록"}</button>
            </div>
          </div>
        </div>`;
      const others = list.filter(r => r.uid !== currentUser.uid);
      const listHtml = others.length
        ? others.map(r => `
          <div class="review-item">
            <div class="review-ava">${safeImageSrc(r.photoBase64) ? `<img src="${safeImageSrc(r.photoBase64)}" alt="">` : escapeHtml((r.displayName||'?').charAt(0).toUpperCase())}</div>
            <div class="review-body">
              <div class="review-top">
                <span class="review-name">${escapeHtml(r.displayName||'익명')}</span>
                <span class="review-stars">${_starsHtml(r.rating, false)}</span>
              </div>
              ${r.text ? `<div class="review-text">${escapeHtml(r.text)}</div>` : ``}
            </div>
          </div>`).join("")
        : `<div class="review-empty">아직 다른 리뷰가 없어요</div>`;
      area.innerHTML = formHtml + listHtml;
    }
    window.setReviewStar = function(n) {
      _myReviewDraft.rating = n;
      const row = document.getElementById("starRow");
      if (row) row.innerHTML = _starsHtml(n, true);
      const tagsEl = document.getElementById("reviewQuickTags");
      if (tagsEl) tagsEl.innerHTML = quickTagsHtml(n, t=>`appendReviewTag('${t}')`);
    };
    window.handleSubmitReview = async function(restaurantId) {
      if (!currentUser) { showToast("로그인이 필요해요"); return; }
      if (!_myReviewDraft.rating) { showToast("별점을 선택해주세요"); return; }
      const text = document.getElementById("reviewText").value.trim();
      const visibility = document.getElementById("reviewVis").value;
      const name  = userData?.displayName || currentUser.displayName || "사용자";
      const photo = userData?.photoBase64 || currentUser.photoURL || "";
      try {
        await setReview(currentUser.uid, name, photo, restaurantId, { rating: _myReviewDraft.rating, text, visibility });
        showToast("리뷰가 저장됐어요");
        renderReviews(restaurantId);
        renderMyReviews();
      } catch (e) { showToast("저장 실패. 다시 시도해주세요"); }
    };
    window.handleDeleteReview = async function(restaurantId) {
      if (!currentUser) return;
      try {
        await deleteReview(currentUser.uid, restaurantId);
        showToast("리뷰를 삭제했어요");
        renderReviews(restaurantId);
        renderMyReviews();
      } catch (e) { showToast("삭제 실패"); }
    };

    // ── 친구 활동 피드 ──
    // ── 재사용: 단계적 더보기 + 접기 ──
    // 구조: <div class="more-wrap" data-step="5" data-shown="5"><div class="more-items">아이템들</div><div class="more-ctrls"></div></div>
    window.moreLessRender = function(wrap) {
      const itemsBox = wrap.querySelector(".more-items");
      if (!itemsBox) return;
      const items = [...itemsBox.children];
      const step = +wrap.dataset.step || 5;
      let shown = Math.min(+wrap.dataset.shown || step, items.length);
      items.forEach((el, i) => { el.style.display = i < shown ? "" : "none"; });
      const ctrls = wrap.querySelector(".more-ctrls");
      let html = "";
      if (shown < items.length) {
        const remain = items.length - shown;
        const next = Math.min(step, remain);
        html += `<button class="fr-more" onclick="moreLessStep(this)">더보기 ${next}개 (남은 ${remain})</button>`;
      }
      if (shown > step) {
        html += `<button class="fr-more fr-less" onclick="moreLessCollapse(this)">접기</button>`;
      }
      if (ctrls) ctrls.innerHTML = html;
    };
    window.moreLessStep = function(btn) {
      const wrap = btn.closest(".more-wrap");
      const step = +wrap.dataset.step || 5;
      wrap.dataset.shown = (+wrap.dataset.shown || step) + step;
      moreLessRender(wrap);
    };
    window.moreLessCollapse = function(btn) {
      const wrap = btn.closest(".more-wrap");
      const step = +wrap.dataset.step || 5;
      wrap.dataset.shown = step;
      moreLessRender(wrap);
      wrap.scrollIntoView({ block: "nearest", behavior: "smooth" });
    };
    function moreWrap(itemsHtml, step) {
      return `<div class="more-wrap" data-step="${step||5}" data-shown="${step||5}"><div class="more-items">${itemsHtml}</div><div class="more-ctrls"></div></div>`;
    }

    const FEED_VERB = { like: "좋아요했어요", regular: "단골로 등록했어요", review: "리뷰를 남겼어요" };
    const FEED_ICON = { like: "❤️", regular: "🔖", review: "⭐" };

    async function renderFriendFeed() {
      const box = document.getElementById("friendFeedList");
      const wrap = document.getElementById("friendFeedWrap");
      if (!box || !currentUser) return;

      const friendIds = userData.friends || [];
      if (!friendIds.length) {
        box.innerHTML = `<div class="empty-mini"><div class="empty-mini-icon">👥</div><div class="empty-mini-text">친구를 추가하면 친구들의 활동이 여기 떠요</div></div>`;
        return;
      }

      const friends = await getUsersByIds(friendIds);
      const fmap = {};
      friends.forEach(f => { fmap[f.uid] = f; });

      // 공개 여부는 각 활동에 박제된 값(shared)으로 getFriendsFeed에서 이미 필터됨
      // (설정을 끄기 전 활동은 계속 보이고, 켠 이후 활동만 새로 보임)
      const feed = await getFriendsFeed(friendIds, 100);

      if (!feed.length) {
        box.innerHTML = `<div class="empty-mini"><div class="empty-mini-icon">🍽️</div><div class="empty-mini-text">아직 친구 활동이 없어요</div></div>`;
        return;
      }

      const itemHtml = (a) => {
        const r = allRestaurants.find(x => x.id === a.restaurantId);
        if (!r) return "";
        const f = fmap[a.uid] || {};
        const ava = safeImageSrc(f.photoBase64)
          ? `<img src="${safeImageSrc(f.photoBase64)}" alt="">`
          : escapeHtml((f.displayName || "?").charAt(0).toUpperCase());
        const extra = a.type === "review"
          ? `<div class="feed-review">${"★".repeat(a.rating||0)}<span class="feed-review-off">${"★".repeat(5-(a.rating||0))}</span>${a.text ? ` · ${escapeHtml(a.text)}` : ""}</div>`
          : "";
        return `
          <div class="feed-item" role="button" tabindex="0" onclick="openModal('${r.id}')">
            <div class="feed-ava">${ava}</div>
            <div class="feed-body">
              <div class="feed-line"><b>${escapeHtml(f.displayName||"친구")}</b>님이 <b>${escapeHtml(r.name)}</b>을(를) ${FEED_VERB[a.type]||"활동했어요"} ${FEED_ICON[a.type]||""}</div>
              ${extra}
              <div class="feed-time">${_timeAgo(a.ts)}</div>
            </div>
          </div>`;
      };

      const itemsHtml = feed.map(itemHtml).join("");
      box.innerHTML = feed.length
        ? moreWrap(itemsHtml, 5)
        : `<div class="empty-mini"><div class="empty-mini-text">표시할 활동이 없어요</div></div>`;
      const _w = box.querySelector(".more-wrap");
      if (_w) moreLessRender(_w);
    }

    function _timeAgo(ts) {
      if (!ts) return "";
      const s = Math.floor((Date.now() - ts) / 1000);
      if (s < 60) return "방금";
      if (s < 3600) return `${Math.floor(s/60)}분 전`;
      if (s < 86400) return `${Math.floor(s/3600)}시간 전`;
      return `${Math.floor(s/86400)}일 전`;
    }

    // ── 내가 남긴 리뷰 ──
    let _myReviews = [];  // 캐시

    function _buildReviewCard(rv) {
      const r = allRestaurants.find(x => x.id === rv.restaurantId);
      const name = r ? escapeHtml(r.name) : "(삭제된 식당)";
      const visMap = { friends: "친구만", private: "나만" };
      // 사진: 식당에 연결된 메뉴 중 첫 번째 사진 (scroll-card와 동일 방식)
      const menuWithPhoto = allMenus.find(m => String(m.restaurantId) === String(rv.restaurantId) && m.photo);
      const emoji = catEmoji[r?.category] || '🍽️';
      const thumbHtml = menuWithPhoto
        ? `<img src="${getStorageUrl(menuWithPhoto.photo)}" alt="" onerror="this.replaceWith(Object.assign(document.createElement('span'),{textContent:'${emoji}',style:'font-size:1.5rem'}))">`
        : `<span style="font-size:1.5rem">${emoji}</span>`;
      const clickHandler = r ? `onclick="if(!event.target.closest('.myrev-btn,.myrev-edit-form')) openModal('${r.id}')"` : "";
      return `
        <div class="myrev-card" id="myrev-${rv.restaurantId}" ${clickHandler}>
          <div class="myrev-thumb">${thumbHtml}</div>
          <div class="myrev-left">

    async function renderMyReviews() {
      const box = document.getElementById("myReviewsList");

      box.innerHTML = _myReviews.slice(0, 5).map(_buildReviewCard).join("");

          ? `<button class="btn-view-all" onclick="openViewall('reviews')">전체보기 ${_myReviews.length}개 ›</button>`

    function quickTagsHtml(rating, onclickFor) {
      const tags = QUICK_TAGS_BY_RATING[rating];
      if (!tags) return `<span class="review-quick-hint">별점을 선택하면 추천 태그가 나와요</span>`;
      return tags.map(t => `<button class="review-quick-tag" onclick="${onclickFor(t)}">${t}</button>`).join('');
    }

    window.setMyRevStar = function(restaurantId, n) {
      const row = document.getElementById(`myrev-star-${restaurantId}`);
      if (row) { row.innerHTML = _starsHtml(n, true, restaurantId); row.dataset.rating = n; }
      const tagsEl = document.getElementById(`myrev-tags-${restaurantId}`);
      if (tagsEl) tagsEl.innerHTML = quickTagsHtml(n, t=>`appendMyRevTag('${restaurantId}','${t}')`);
    };

    window.appendMyRevTag = function(restaurantId, tag) {
      const el = document.getElementById(`myrev-text-${restaurantId}`);
      if (!el) return;
      const cur = el.value.trim();
      el.value = cur ? cur + " · " + tag : tag;
      el.focus();
    };

    window.appendReviewTag = function(tag) {
      const el = document.getElementById("reviewText");
      if (!el) return;
      const cur = el.value.trim();
      el.value = cur ? cur + " · " + tag : tag;
      el.focus();
    };

    window.toggleMyRevEdit = function(restaurantId, rating, encodedText, visibility) {
      const form = document.getElementById(`myrev-edit-${restaurantId}`);
      if (!form) return;
      const isOpen = form.style.display !== "none";
      if (isOpen) { form.style.display = "none"; return; }
      if (rating !== undefined) {
        const row = document.getElementById(`myrev-star-${restaurantId}`);
        if (row) { row.innerHTML = _starsHtml(rating, true, restaurantId); row.dataset.rating = rating; }
      }
      if (encodedText !== undefined) {
        const el = document.getElementById(`myrev-text-${restaurantId}`);
        if (el) el.value = decodeURIComponent(encodedText);
      }
      if (visibility !== undefined) {
        const sel = document.getElementById(`myrev-vis-${restaurantId}`);
        if (sel) sel.value = visibility;
      }
      form.style.display = "block";
    };

    window.handleMyRevSave = async function(restaurantId) {
      if (!currentUser) return;
      const row    = document.getElementById(`myrev-star-${restaurantId}`);
      const rating = parseInt(row?.dataset.rating || 0);
      if (!rating) { showToast("별점을 선택해주세요"); return; }
      const text       = (document.getElementById(`myrev-text-${restaurantId}`)?.value || "").trim();
      const visibility = document.getElementById(`myrev-vis-${restaurantId}`)?.value || "friends";
      const name  = userData?.displayName || currentUser.displayName || "사용자";
      const photo = userData?.photoBase64 || currentUser.photoURL || "";
      try {
        await setReview(currentUser.uid, name, photo, restaurantId, { rating, text, visibility });
        showToast("리뷰가 수정됐어요");
        await renderMyReviews();
        // 전체보기 바텀시트가 열려있으면 갱신
        if (currentViewallType === 'reviews') openViewall('reviews');
      } catch (e) { showToast("저장 실패. 다시 시도해주세요"); }
    };

    window.handleMyRevDelete = function(restaurantId) {
      if (!currentUser) return;
      openActionConfirm({
        icon: ICONS.trash,
        title: "리뷰를 삭제할까요?",
        desc: "삭제한 리뷰는 복구할 수 없어요.",
        okLabel: "삭제",
        onConfirm: async () => {
          try {

            renderMyReviews();

            if (currentViewallType === 'reviews') openViewall('reviews');
          } catch (e) { showToast("삭제 실패"); }
        },
      });
    };

    // 친구 클릭 → 그 자리에서 취향 TOP 3 가로로 펼치기/접기
    window.frToggleTaste = async function(uid){
      const box = document.getElementById("frtaste-" + uid);
      if (!box) return;
      const opening = box.classList.contains("fr-hidden");
      box.classList.toggle("fr-hidden");
      if (!opening) return;                 // 접는 중이면 끝
      if (box.dataset.loaded) return;       // 이미 불러왔으면 재요청 안 함

      box.innerHTML = `<div class="fr-taste-loading">취향 불러오는 중…</div>`;
      try {
        const tp = await getTasteProfile(uid);
        const scores = tp?.tagScore || {};
        const entries = Object.entries(scores).sort((a,b)=>b[1]-a[1]);
        const total = entries.reduce((s,[,v])=>s+v, 0);
        const top3 = entries.slice(0, 3);
        if (!top3.length) {
          box.innerHTML = `<div class="fr-taste-empty">아직 취향 데이터가 없어요</div>`;
        } else {
          box.innerHTML = top3.map(([tag,v]) => {
            const pct = total ? Math.round(v/total*100) : 0;
            return `<div class="fr-taste-chip"><span class="fr-taste-tag">${escapeHtml(tag)}</span><span class="fr-taste-pct">${pct}%</span></div>`;
          }).join("");
        }
        box.dataset.loaded = "1";
      } catch(e) {
        box.innerHTML = `<div class="fr-taste-empty">취향을 불러올 수 없어요</div>`;
      }
    };

    // 친구의 좋아요한 맛집 보기 (공유) — 팝업으로
    window.frView = async function(uid){
      document.getElementById("friendsOverlay").classList.add("open");
      const detail = document.getElementById("friendDetailBody");
      detail.innerHTML = `<div class="fr-loading">불러오는 중…</div>`;

      const [[u], taste] = await Promise.all([
        getUsersByIds([uid]),
        getTasteProfile(uid).catch(() => null),
      ]);
      if (!u) { detail.innerHTML = `<div class="fr-empty">정보를 불러올 수 없어요</div>`; return; }
      document.getElementById("friendsTitle").textContent = `${u.displayName || "친구"}님`;

      if (u.shareLists === false) {
        detail.innerHTML = `<div class="fr-empty">이 친구가 목록을 비공개로 설정했어요</div>`;
        return;
      }

      // 식당 한 줄(썸네일 + 이름 + 카테고리, 클릭 시 상세)
      const restRow = (r) => {
        const emoji = catEmoji[r.category] || "🍽️";
        const thumb = r.photo
          ? `<img src="${getStorageUrl(r.photo)}" alt="" onerror="this.replaceWith(Object.assign(document.createElement('span'),{textContent:'${emoji}'}))">`
          : emoji;
        return `<div class="fr-rest" role="button" tabindex="0" onclick="closeFriends(); openModal('${r.id}')">
            <span class="fr-rest-thumb">${thumb}</span>
            <span class="fr-rest-name">${escapeHtml(r.name)}</span>
            <span class="fr-rest-cat">${escapeHtml(r.category||"")}</span>
          </div>`;
      };

      // 섹션(카드): 처음 5개 + 더보기
      const section = (key, emoji, title, ids) => {
        const list = (ids || []).map(id => allRestaurants.find(r => r.id === id)).filter(Boolean);
        let inner;
        if (!list.length) {
          inner = `<div class="fr-empty" style="padding:10px 0">목록이 비어있어요</div>`;
        } else {
          inner = moreWrap(list.map(restRow).join(""), 5);
        }
        return `<div class="fr-detail-card">
            <div class="fr-detail-title">${emoji} ${title} <span class="fr-detail-count">${list.length}</span></div>
            ${inner}
          </div>`;
      };

      // 취향 TOP5 (%)
      let tasteInner = `<div class="fr-empty" style="padding:10px 0">스와이프 기록이 없어요</div>`;
      const tagScore = taste?.tagScore || {};
      const entries = Object.entries(tagScore).sort((a,b) => b[1]-a[1]).slice(0,5);
      if (entries.length) {
        const total = Object.values(tagScore).reduce((a,b)=>a+b, 0) || 1;
        tasteInner = entries.map(([tag, score]) => {
          const pct = Math.round((score/total)*100);
          return `<div class="fr-taste">
              <div class="fr-taste-top"><span>${escapeHtml(tag)}</span><span class="fr-taste-pct">${pct}%</span></div>
              <div class="fr-taste-bar"><div style="width:${pct}%"></div></div>
            </div>`;
        }).join("");
      }

      detail.innerHTML =
        section("likes", "❤️", "좋아요한 음식", u.menuLikes) +
        section("regulars", "🔖", "단골 식당", u.regulars) +
        `<div class="fr-detail-card">
           <div class="fr-detail-title">🎯 취향 TOP 5</div>
           ${tasteInner}
         </div>`;
      detail.querySelectorAll(".more-wrap").forEach(moreLessRender);
    };
