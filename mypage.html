      document.getElementById("editOverlay").classList.add("open");
      document.body.style.overflow = "hidden";
    };

    window.closeEditProfile = function() {
      document.getElementById("editOverlay").classList.remove("open");
      document.body.style.overflow = "";
      pendingPhotoBase64 = null;
    };

    document.getElementById("editOverlay").addEventListener("click", e => {
      if (e.target === document.getElementById("editOverlay")) closeEditProfile();
    });

    // ─── 사진 크롭 ────────────────────────────

    let cropImg     = null;
    let cropScale   = 1;
    let cropOffsetX = 0;
    let cropOffsetY = 0;
    let cropSize    = 0;

    window.handlePhotoChange = function(e) {
      const file = e.target.files[0];
      e.target.value = "";
      if (!file) return;
      if (file.size > 10 * 1024 * 1024) { showToast("사진 크기는 10MB 이하로 해주세요"); return; }
      const reader = new FileReader();
      reader.onload = ev => {
        const img = new Image();
        img.onload = () => { cropImg = img; openCropper(); };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    };

    function openCropper() {
      const wrap = document.getElementById("cropWrap");
      const size = Math.min(wrap.clientWidth, wrap.clientHeight, 360);
      cropSize   = size;
      const canvas  = document.getElementById("cropCanvas");
      canvas.width  = size;
      canvas.height = size;
      const minSide = Math.min(cropImg.naturalWidth, cropImg.naturalHeight);
      cropScale  = size / minSide;
      cropOffsetX = (size - cropImg.naturalWidth  * cropScale) / 2;
      cropOffsetY = (size - cropImg.naturalHeight * cropScale) / 2;
      drawCropper();
      document.getElementById("cropOverlay").classList.add("open");
      document.body.style.overflow = "hidden";
      bindCropEvents();
    }

    function drawCropper() {
      const canvas = document.getElementById("cropCanvas");
      const ctx    = canvas.getContext("2d");
      const s      = cropSize;
      const r      = s/2 - 2;
      ctx.clearRect(0, 0, s, s);
      // 1) 원본 이미지 (전체 선명하게)
      ctx.drawImage(cropImg, cropOffsetX, cropOffsetY, cropImg.naturalWidth * cropScale, cropImg.naturalHeight * cropScale);
      // 2) 원 '바깥'만 어둡게 (evenodd: 사각형 - 원 = 바깥 영역)
      ctx.save();
      ctx.fillStyle = "rgba(0,0,0,0.4)";
      ctx.beginPath();
      ctx.rect(0, 0, s, s);
      ctx.arc(s/2, s/2, r, 0, Math.PI*2);
      ctx.fill("evenodd");
      ctx.restore();
      // 3) 원 테두리
      ctx.save();
      ctx.strokeStyle = "rgba(255,255,255,0.85)";
      ctx.lineWidth   = 2;
      ctx.beginPath();
      ctx.arc(s/2, s/2, r, 0, Math.PI*2);
      ctx.stroke();
      ctx.restore();
    }

    function bindCropEvents() {
      const wrap = document.getElementById("cropWrap");
      let dragging = false, lastX = 0, lastY = 0;
      wrap.onmousedown = e => { dragging = true; lastX = e.clientX; lastY = e.clientY; e.preventDefault(); };
      wrap.onmousemove = e => {
        if (!dragging) return;
        cropOffsetX += e.clientX - lastX;
        cropOffsetY += e.clientY - lastY;
        lastX = e.clientX; lastY = e.clientY;
        clampOffset(); drawCropper();
      };
      wrap.onmouseup = wrap.onmouseleave = () => { dragging = false; };
      wrap.onwheel = e => {
        e.preventDefault();
        zoomAt(cropSize/2, cropSize/2, e.deltaY < 0 ? 1.05 : 0.95);
        drawCropper();
      };
      let lastTouchDist = 0;
      wrap.ontouchstart = e => {
        e.preventDefault();
        if (e.touches.length === 2) { lastTouchDist = getTouchDist(e.touches); }
        else { lastX = e.touches[0].clientX; lastY = e.touches[0].clientY; }
      };
      wrap.ontouchmove = e => {
        e.preventDefault();
        if (e.touches.length === 2) {
          const dist = getTouchDist(e.touches);
          zoomAt(cropSize/2, cropSize/2, dist / lastTouchDist);
          lastTouchDist = dist;
        } else {
          cropOffsetX += e.touches[0].clientX - lastX;
          cropOffsetY += e.touches[0].clientY - lastY;
          lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
          clampOffset();
        }
        drawCropper();
      };
      wrap.ontouchend = e => { e.preventDefault(); };
    }

    function getTouchDist(touches) {
      const dx = touches[0].clientX - touches[1].clientX;
      const dy = touches[0].clientY - touches[1].clientY;
      return Math.sqrt(dx*dx + dy*dy);
    }

    function zoomAt(cx, cy, delta) {
      const minScale = cropSize / Math.min(cropImg.naturalWidth, cropImg.naturalHeight);
      const newScale = Math.max(minScale, Math.min(cropScale * delta, minScale * 5));
      const ratio    = newScale / cropScale;
      cropOffsetX    = cx - (cx - cropOffsetX) * ratio;
      cropOffsetY    = cy - (cy - cropOffsetY) * ratio;
      cropScale      = newScale;
      clampOffset();
    }

    function clampOffset() {
      const r  = cropSize / 2;
      const iw = cropImg.naturalWidth  * cropScale;
      const ih = cropImg.naturalHeight * cropScale;
      cropOffsetX = Math.min(r - (cropSize - r*2) / 2 + (cropSize/2 - r), Math.max(cropSize - iw, cropOffsetX));
      cropOffsetY = Math.min(r - (cropSize - r*2) / 2 + (cropSize/2 - r), Math.max(cropSize - ih, cropOffsetY));
    }

    window.closeCropper = function() { document.getElementById("cropOverlay").classList.remove("open"); };

    window.applyCrop = function() {
      const out = document.createElement("canvas");
      out.width = 400; out.height = 400;
      const ctx  = out.getContext("2d");
      const ratio = 400 / cropSize;
      ctx.beginPath();
      ctx.arc(200, 200, 200, 0, Math.PI*2);
      ctx.clip();
      ctx.drawImage(cropImg, cropOffsetX * ratio, cropOffsetY * ratio,
        cropImg.naturalWidth * cropScale * ratio, cropImg.naturalHeight * cropScale * ratio);
      pendingPhotoBase64 = out.toDataURL("image/jpeg", 0.85);
      const preview = document.getElementById("editPhotoPreview");
      preview.innerHTML = `
        <img src="${pendingPhotoBase64}" alt="미리보기" style="width:100%;height:100%;object-fit:cover;border-radius:50%" />
        <div class="edit-photo-overlay">${ICONS.camera}</div>`;
      closeCropper();
    };

    window.saveProfile = async function() {
      if (!currentUser) return;
      const saveBtn = document.getElementById("editSaveBtn");
      const newName = document.getElementById("editNameInput").value.trim();
      if (!newName) { showToast("이름을 입력해주세요"); return; }
      saveBtn.disabled = true;
      saveBtn.textContent = "저장 중...";
      const updates = { displayName: newName };
      if (pendingPhotoBase64) updates.photoBase64 = pendingPhotoBase64;
      try {
        await updateUserProfile(currentUser.uid, updates);
        userData.displayName = newName;
        if (pendingPhotoBase64) userData.photoBase64 = pendingPhotoBase64;
        updateNavAvatar(currentUser, userData);
        document.querySelector(".profile-name").textContent = `${newName}님`;
        const avatar = document.querySelector(".profile-avatar");
        if (avatar && pendingPhotoBase64) {
          avatar.innerHTML = `<img src="${pendingPhotoBase64}" alt="프로필" style="width:100%;height:100%;object-fit:cover" />`;
        }
        showToast("프로필이 저장됐어요 ✓");
        closeEditProfile();
      } catch (err) {
        console.error(err);
        showToast("저장 실패. 다시 시도해주세요");
      } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = "저장";
      }
    };

    // ─── 유틸 ─────────────────────────────────

    function animateCount(elId, target) {
      const el   = document.getElementById(elId);
      if (!el) return;
      const from = parseInt(el.textContent)||0;
      const t0   = performance.now();
      const step = now => {
        const p = Math.min((now-t0)/600,1);
        el.textContent = Math.round(from+(target-from)*(1-Math.pow(1-p,3)));
        if (p<1) requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    }

    function showToast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.classList.add("show");
      setTimeout(()=>t.classList.remove("show"), 2000);
    }

    // ─── 식당 상세 모달 ───────────────────────────

    const menuCache = {};
    let currentRestaurant = null;

    window.openModal = (id) => openModal(id);  // 인라인 onclick(친구 좋아요 보기)에서 호출
    async function openModal(restaurantId) {
      const restaurant = allRestaurants.find(r => r.id === restaurantId);
      if (!restaurant) return;
      currentRestaurant = restaurant;

      // 히어로 이미지
      const hero        = document.getElementById("modalHero");
      const placeholder = document.getElementById("modalHeroPlaceholder");
      placeholder.style.display = "flex";
      hero.querySelectorAll("img").forEach(i => i.remove());
      if (restaurant.photo) {
        const img = document.createElement("img");
        img.src = getStorageUrl(restaurant.photo);
        img.style.cssText = "width:100%;height:100%;object-fit:cover;position:absolute;inset:0";
        img.onerror = () => { img.remove(); placeholder.style.display = "flex"; };
        placeholder.style.display = "none";
        hero.appendChild(img);
      }

      // 기본 정보
      document.getElementById("modalName").textContent = restaurant.name;
      const badge  = document.getElementById("modalStatusBadge");
      const status = getOpenStatus(restaurant);
      const statusMap = {
        open:    { text: "영업중",      cls: "badge-open"    },
        break:   { text: "브레이크타임", cls: "badge-break"   },
        closed:  { text: "영업종료",    cls: "badge-closed"  },
        dayoff: { text: "휴무일",      cls: "badge-dayoff" },
      };
      const st = statusMap[status] || statusMap.closed;
      badge.textContent = st.text;
      badge.className   = `badge ${st.cls}`;

      const distVal = (restaurant.lat && restaurant.lng)
        ? formatDistance(CONFIG.HANSUNG_LAT, CONFIG.HANSUNG_LNG, restaurant.lat, restaurant.lng)
        : (restaurant.distance ? restaurant.distance + 'km' : '-');

      const metaRows = [
        { icon: ICONS.tag,    label: "카테고리", value: restaurant.category || "-" },
        { icon: ICONS.mapPin, label: "거리",     value: distVal },
        { icon: ICONS.clock,  label: "영업시간", value: restaurant.hours || "-" },
      ];
      if (restaurant.break_time && restaurant.break_time !== "없음")
        metaRows.push({ icon: ICONS.coffee, label: "브레이크", value: restaurant.break_time });
      if (restaurant.closed_day && restaurant.closed_day !== "없음")
        metaRows.push({ icon: ICONS.calendarX, label: "정기휴무", value: restaurant.closed_day });

      document.getElementById("modalMeta").innerHTML = metaRows.map(r => `
        <div class="modal-meta-row">
          <span class="modal-meta-icon">${r.icon}</span>
          <span class="modal-meta-label">${r.label}</span>
          <span class="modal-meta-value">${r.value}</span>
        </div>`).join("");

      // 태그
      const tagsEl = document.getElementById("modalTags");
      tagsEl.innerHTML = restaurant.tags
        ? restaurant.tags.split(",").map(t => `<span class="tag">${t.trim()}</span>`).join("")
        : "";

      // 메뉴
      if (!menuCache[restaurantId]) {
        menuCache[restaurantId] = await getMenusByRestaurant(restaurantId);
      }
      const menus = menuCache[restaurantId];
      const menuList = document.getElementById("modalMenuList");
      menuList.innerHTML = menus.length > 0
        ? menus.map(m => {
          const menuLiked = (userData?.menuLikes || []).includes(m.id);
          return `
          <div class="menu-item">
            <div class="menu-item-left">
              ${m.photo
                ? `<img class="menu-photo" src="${getStorageUrl(m.photo)}" alt="${m.name}" onerror="this.outerHTML='<div class=\'menu-photo-placeholder\'>🍽️</div>'" />`
                : `<div class="menu-photo-placeholder">🍽️</div>`}
              <span class="menu-name">${m.name}</span>
            </div>
            <div class="menu-item-right">
              <span class="menu-price">${m.price ? m.price.toLocaleString() + "원" : "-"}</span>
              <button class="menu-heart-btn${menuLiked ? ' active' : ''}" onclick="handleMenuHeart(event,'${m.id}')" id="menu-heart-${m.id}" aria-label="메뉴 좋아요">
                ${menuLiked ? ICONS.heartFill : ICONS.heart}
              </button>
            </div>
          </div>`;
        }).join("")
        : '<p style="color:var(--color-text-tertiary);font-size:0.8125rem">메뉴 정보가 없습니다</p>';

      // 단골 버튼 상태 (userData 기준 — 이미 로드된 상태)
      updateModalRegularBtn();

      const _sb = document.querySelector(".modal-scroll-body");
      if (_sb) _sb.scrollTop = 0;
      renderReviews(restaurantId);
      document.getElementById("modalOverlay").classList.add("open");
      document.body.style.overflow = "hidden";
      _lastFocusedBeforeModal = document.activeElement;       // 닫을 때 포커스 복원용
      const _sheet = document.getElementById("modalSheet");
      if (_sheet) _sheet.focus();

      setTimeout(() => initModalMap(restaurant), 400);
    }

    // ── 메뉴 좋아요 토글 ──
    window.handleMenuHeart = async function (e, menuId) {
      e.stopPropagation();
      if (!currentUser) { showToast("로그인이 필요합니다"); return; }
      const btn   = document.getElementById(`menu-heart-${menuId}`);
      const liked = (userData?.menuLikes || []).includes(menuId);
      const paint = (on) => {
        if (btn) { btn.innerHTML = on ? ICONS.heartFill : ICONS.heart; btn.classList.toggle("active", on); }
      };
      // 낙관적 업데이트
      if (liked) userData.menuLikes = (userData.menuLikes||[]).filter(id => id !== menuId);
      else       userData.menuLikes = [...(userData.menuLikes||[]), menuId];
      paint(!liked);
      refreshLikesUI();
      try {
        if (liked) await removeMenuLike(currentUser.uid, menuId);
        else       await addMenuLike(currentUser.uid, menuId, allMenus.find(m => m.id === menuId)?.restaurantId);
        showToast(liked ? "좋아요 취소" : "좋아요!");
      } catch (err) {
        // 저장 실패 → 롤백
        console.error(err);
        if (liked) userData.menuLikes = [...(userData.menuLikes||[]), menuId];
        else       userData.menuLikes = (userData.menuLikes||[]).filter(id => id !== menuId);
        paint(liked);
        refreshLikesUI();
        showToast("저장에 실패했어요. 다시 시도해주세요");
      }
    };

    function updateModalRegularBtn() {
      if (!currentRestaurant) return;
      const isRegular = (userData?.regulars || []).includes(currentRestaurant.id);
      const btn       = document.getElementById("modalRegularBtn");
      btn.classList.toggle("active", isRegular);
      document.getElementById("modalRegularIcon").innerHTML = isRegular ? ICONS.bookmarkFill : ICONS.bookmark;
      document.getElementById("modalRegularLabel").textContent = isRegular ? "단골 ✓" : "단골";
    }

    let _lastFocusedBeforeModal = null;

    window.closeModal = function () {
      document.getElementById("modalOverlay").classList.remove("open");
      document.body.style.overflow = "";
      if (_lastFocusedBeforeModal && _lastFocusedBeforeModal.focus) _lastFocusedBeforeModal.focus();
      _lastFocusedBeforeModal = null;
    };

    window.handleModalOutsideClick = function (e) {
      if (e.target === document.getElementById("modalOverlay")) closeModal();
    };

    // 식당 상세 모달 열려 있을 때: ESC 닫기 + Tab 포커스 트랩
    document.addEventListener("keydown", (e) => {
      const overlay = document.getElementById("modalOverlay");
      if (!overlay || !overlay.classList.contains("open")) return;
      if (e.key === "Escape") { e.preventDefault(); closeModal(); return; }
      if (e.key !== "Tab") return;
      const sheet = document.getElementById("modalSheet");
      const focusables = [...sheet.querySelectorAll('a[href],button:not([disabled]),input,select,textarea,[tabindex]:not([tabindex="-1"])')]
        .filter(el => el.offsetParent !== null);
      if (!focusables.length) return;
      const first = focusables[0], last = focusables[focusables.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    });

    // role="button"인 div(카드·행·링크)를 Enter/Space로도 실행 (키보드 접근성)
    document.addEventListener("keydown", (e) => {
      if (e.key !== "Enter" && e.key !== " ") return;
      const el = document.activeElement;
      if (el && el.tagName === "DIV" && el.getAttribute("role") === "button") {
        e.preventDefault();
        el.click();
      }
    });

    window.handleModalRegular = async function () {
      if (!currentUser) { showToast("로그인이 필요합니다"); return; }
      if (!currentRestaurant) return;
      const rid       = currentRestaurant.id;
      const isRegular = (userData?.regulars || []).includes(rid);
      // 낙관적 업데이트
      if (isRegular) userData.regulars = (userData.regulars||[]).filter(id => id !== rid);
      else           userData.regulars = [...(userData.regulars || []), rid];
      updateModalRegularBtn();
      refreshRegularsUI();
      try {
        if (isRegular) await removeRegular(currentUser.uid, rid);
        else           await addRegular(currentUser.uid, rid);
        showToast(isRegular ? "단골 해제" : "단골 등록");
      } catch (err) {
        // 저장 실패 → 롤백
        console.error(err);
        if (isRegular) userData.regulars = [...(userData.regulars || []), rid];
        else           userData.regulars = (userData.regulars||[]).filter(id => id !== rid);
        updateModalRegularBtn();
        refreshRegularsUI();
        showToast("저장에 실패했어요. 다시 시도해주세요");
      }
    };

    window.openKakaoMap = function () {
      if (!currentRestaurant) return;
      window.open(`https://map.kakao.com/link/map/${currentRestaurant.name},${currentRestaurant.lat},${currentRestaurant.lng}`, "_blank");
    };

    window.openKakaoNav = function () {
      if (!currentRestaurant) return;
      window.open(`https://map.kakao.com/link/from/한성대학교,${CONFIG.HANSUNG_LAT},${CONFIG.HANSUNG_LNG}/to/${currentRestaurant.name},${currentRestaurant.lat},${currentRestaurant.lng}`, "_blank");
    };

    function initModalMap(restaurant) {
      const mapEl = document.getElementById("modalMap");
      if (!mapEl) return;
      function drawMap() {
        mapEl.innerHTML = "";
        const hasCoord = restaurant.lat && restaurant.lng;
        const center   = new kakao.maps.LatLng(
          hasCoord ? restaurant.lat : CONFIG.HANSUNG_LAT,
          hasCoord ? restaurant.lng : CONFIG.HANSUNG_LNG
        );
        const map = new kakao.maps.Map(mapEl, { center, level: 4 });
        const makeMarkerImage = (fill) => {
          const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="32" height="42" viewBox="0 0 32 42"><path d="M16 0C7.2 0 0 7 0 15.6c0 10.5 14.4 25 15 25.6.6.5 1.4.5 2 0 .6-.6 15-15.1 15-25.6C32 7 24.8 0 16 0z" fill="${fill}"/><circle cx="16" cy="15" r="5.5" fill="#fff"/></svg>`;
          const url = "data:image/svg+xml;utf8," + encodeURIComponent(svg);
          return new kakao.maps.MarkerImage(url, new kakao.maps.Size(28, 37), { offset: new kakao.maps.Point(14, 37) });
        };
        const hansungPos = new kakao.maps.LatLng(CONFIG.HANSUNG_LAT, CONFIG.HANSUNG_LNG);
        new kakao.maps.Marker({ map, position: hansungPos, image: makeMarkerImage("#9CA3AF") });
        if (hasCoord) {
          const restPos = new kakao.maps.LatLng(restaurant.lat, restaurant.lng);
          new kakao.maps.Marker({ map, position: restPos, image: makeMarkerImage("#2563EB") });
          const bounds = new kakao.maps.LatLngBounds();
          bounds.extend(hansungPos);
          bounds.extend(restPos);
          map.setBounds(bounds, 60);
        }
      }
      if (window.kakao && window.kakao.maps) {
        kakao.maps.load(drawMap);
      } else {
        let retries = 0;
        const wait = setInterval(() => {
          if (window.kakao && window.kakao.maps) { clearInterval(wait); kakao.maps.load(drawMap); }
          else if (++retries > 10) clearInterval(wait);
        }, 300);
      }
    }
  </script>
