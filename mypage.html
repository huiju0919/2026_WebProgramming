<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FOOD FIRST — 마이페이지</title>
  <link rel="stylesheet" href="./common.css" />
  <style>
    /* ── 프로필 ── */
    .profile-section {
      background: var(--color-bg-card);
      padding: var(--spacing-lg) var(--spacing-md);
      border-bottom: 1px solid var(--color-border-light);
    }

    .profile-top {
      display: flex;
      align-items: center;
      gap: var(--spacing-md);
      margin-bottom: var(--spacing-lg);
    }

    .profile-avatar {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: var(--color-primary-light);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 700;
      color: var(--color-primary);
      overflow: hidden;
      flex-shrink: 0;
    }

    .profile-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .profile-info {
      flex: 1;
    }

    .profile-name {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 3px;
    }

    .profile-email {
      font-size: 13px;
      color: var(--color-text-secondary);
    }

    .btn-logout {
      padding: 8px 16px;
      background: var(--color-bg-input);
      border-radius: var(--radius-full);
      font-size: 13px;
      font-weight: 500;
      color: var(--color-text-secondary);
      cursor: pointer;
      border: none;
      font-family: var(--font-main);
    }

    /* ── 통계 ── */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      background: var(--color-bg-card);
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: var(--shadow-card);
    }

    .stat-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 8px;
      border-right: 1px solid var(--color-border-light);
    }

    .stat-item:last-child {
      border-right: none;
    }

    .stat-number {
      font-size: 22px;
      font-weight: 800;
      color: var(--color-primary);
    }

    .stat-label {
      font-size: 12px;
      color: var(--color-text-secondary);
      margin-top: 3px;
    }

    /* ── 섹션 ── */
    .section-wrap {
      padding: var(--spacing-md);
      margin-top: var(--spacing-md);
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .section-title {
      font-size: 16px;
      font-weight: 700;
    }

    .section-count {
      font-size: 13px;
      color: var(--color-text-secondary);
    }

    /* ── 식당 가로 스크롤 ── */
    .restaurant-scroll {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 4px;
    }

    .restaurant-scroll::-webkit-scrollbar { display: none; }

    .scroll-card {
      flex-shrink: 0;
      width: 140px;
      background: var(--color-bg-card);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-card);
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.15s;
    }

    .scroll-card:active {
      transform: scale(0.96);
    }

    .scroll-card-img {
      width: 100%;
      aspect-ratio: 1;
      background: var(--color-bg-input);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      overflow: hidden;
    }

    .scroll-card-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .scroll-card-info {
      padding: 8px;
    }

    .scroll-card-name {
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .scroll-card-meta {
      font-size: 11px;
      color: var(--color-text-secondary);
      margin-top: 2px;
    }

    /* ── 빈 상태 ── */
    .empty-mini {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px;
      gap: 8px;
      color: var(--color-text-tertiary);
      text-align: center;
      background: var(--color-bg-card);
      border-radius: var(--radius-lg);
    }

    .empty-mini-icon { font-size: 32px; }
    .empty-mini-text { font-size: 13px; }

    /* ── 비로그인 ── */
    .guest-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 60px var(--spacing-md);
      gap: var(--spacing-md);
      text-align: center;
    }

    .guest-icon { font-size: 64px; }
    .guest-title { font-size: 20px; font-weight: 700; }
    .guest-sub { font-size: 14px; color: var(--color-text-secondary); line-height: 1.6; }
  </style>
</head>
<body>
  <div class="app-container">

    <!-- 헤더 -->
    <header class="header">
      <span class="header-logo">FOOD FIRST</span>
      <span style="font-size:16px;font-weight:600">마이페이지</span>
      <div style="width:40px"></div>
    </header>

    <!-- 메인 콘텐츠 -->
    <div class="page-content" id="mainContent">
      <div class="spinner-wrap" style="height:50vh">
        <div class="spinner"></div>
        <span>불러오는 중...</span>
      </div>
    </div>

    <!-- 하단 내비게이션 -->
    <nav class="bottom-nav">
      <a href="./index.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        홈
      </a>
      <a href="./swipe.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17 12h-5v5h5v-5zM16 1v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2h-1V1h-2zm3 18H5V8h14v11z"/></svg>
        스와이프
      </a>
      <a href="./mypage.html" class="nav-item active">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
        마이
      </a>
    </nav>

  </div>

  <div class="toast" id="toast"></div>

  <script src="./config.js"></script>
  <script type="module">
    import { getRestaurants, getUserDoc, addLike, removeLike } from "./firebase.js";
    import { onAuthChanged, logout } from "./auth.js";

    let allRestaurants = [];
    let currentUser = null;
    let userData = null;

    onAuthChanged(async (user) => {
      currentUser = user;
      allRestaurants = await getRestaurants();

      if (!user) {
        renderGuest();
        return;
      }

      userData = await getUserDoc(user.uid);
      renderProfile();
    });

    // ── 비로그인 화면 ──
    function renderGuest() {
      document.getElementById("mainContent").innerHTML = `
        <div class="guest-section">
          <div class="guest-icon">👤</div>
          <div class="guest-title">로그인이 필요해요</div>
          <div class="guest-sub">로그인하면 좋아요한 맛집과<br/>스와이프 기록을 확인할 수 있어요</div>
          <button class="btn-primary" onclick="location.href='./login.html'" style="max-width:200px">
            로그인하기
          </button>
        </div>`;
    }

    // ── 로그인 화면 ──
    function renderProfile() {
      if (!currentUser || !userData) return;

      const likedIds = userData.likes || [];
      const recentIds = userData.recentViews || [];

      const likedRestaurants = likedIds
        .map(id => allRestaurants.find(r => r.id === id))
        .filter(Boolean);

      const recentRestaurants = recentIds
        .map(id => allRestaurants.find(r => r.id === id))
        .filter(Boolean);

      const nameInitial = (currentUser.displayName || "U")[0].toUpperCase();
      const catEmoji = { 한식:"🍚",중식:"🥢",일식:"🍣",양식:"🍝",분식:"🌮",패스트푸드:"🍔",아시아:"🍜",카페:"☕",기타:"🍽️" };

      document.getElementById("mainContent").innerHTML = `
        <!-- 프로필 -->
        <div class="profile-section">
          <div class="profile-top">
            <div class="profile-avatar">
              ${currentUser.photoURL
                ? `<img src="${currentUser.photoURL}" alt="프로필" onerror="this.outerHTML='${nameInitial}'" />`
                : nameInitial
              }
            </div>
            <div class="profile-info">
              <div class="profile-name">${currentUser.displayName || '사용자'}님</div>
              <div class="profile-email">${currentUser.email || ''}</div>
            </div>
            <button class="btn-logout" onclick="handleLogout()">로그아웃</button>
          </div>

          <!-- 통계 -->
          <div class="stats-row">
            <div class="stat-item">
              <div class="stat-number">${userData.swipeCount || 0}</div>
              <div class="stat-label">스와이프</div>
            </div>
            <div class="stat-item">
              <div class="stat-number">${likedIds.length}</div>
              <div class="stat-label">좋아요</div>
            </div>
            <div class="stat-item">
              <div class="stat-number">${recentIds.length}</div>
              <div class="stat-label">방문</div>
            </div>
          </div>
        </div>

        <!-- 좋아요한 맛집 -->
        <div class="section-wrap">
          <div class="section-header">
            <div class="section-title">좋아요한 맛집</div>
            <div class="section-count">${likedRestaurants.length}개</div>
          </div>
          ${likedRestaurants.length > 0
            ? `<div class="restaurant-scroll">
                ${likedRestaurants.map(r => `
                  <div class="scroll-card" onclick="openRestaurant('${r.id}')">
                    <div class="scroll-card-img">
                      ${r.photo
                        ? `<img src="./images/${r.photo}" alt="${r.name}" onerror="this.outerHTML='<span style=font-size:36px>${catEmoji[r.category]||'🍽️'}</span>'" />`
                        : `<span style="font-size:36px">${catEmoji[r.category]||'🍽️'}</span>`
                      }
                    </div>
                    <div class="scroll-card-info">
                      <div class="scroll-card-name">${r.name}</div>
                      <div class="scroll-card-meta">${r.category} · ${r.distance||'-'}km</div>
                    </div>
                  </div>`).join('')}
              </div>`
            : `<div class="empty-mini">
                <div class="empty-mini-icon">💔</div>
                <div class="empty-mini-text">아직 좋아요한 맛집이 없어요</div>
              </div>`
          }
        </div>

        <!-- 최근 본 맛집 -->
        <div class="section-wrap">
          <div class="section-header">
            <div class="section-title">최근 본 맛집</div>
            <div class="section-count">${recentRestaurants.length}개</div>
          </div>
          ${recentRestaurants.length > 0
            ? `<div class="restaurant-scroll">
                ${recentRestaurants.map(r => `
                  <div class="scroll-card" onclick="openRestaurant('${r.id}')">
                    <div class="scroll-card-img">
                      ${r.photo
                        ? `<img src="./images/${r.photo}" alt="${r.name}" onerror="this.outerHTML='<span style=font-size:36px>${catEmoji[r.category]||'🍽️'}</span>'" />`
                        : `<span style="font-size:36px">${catEmoji[r.category]||'🍽️'}</span>`
                      }
                    </div>
                    <div class="scroll-card-info">
                      <div class="scroll-card-name">${r.name}</div>
                      <div class="scroll-card-meta">${r.category} · ${r.distance||'-'}km</div>
                    </div>
                  </div>`).join('')}
              </div>`
            : `<div class="empty-mini">
                <div class="empty-mini-icon">👀</div>
                <div class="empty-mini-text">최근 본 맛집이 없어요</div>
              </div>`
          }
        </div>`;
    }

    // ── 로그아웃 ──
    window.handleLogout = async function () {
      await logout();
      window.location.href = "./login.html";
    };

    // ── 식당 상세 이동 (index.html로 이동해서 모달 열기) ──
    window.openRestaurant = function (restaurantId) {
      window.location.href = `./index.html?restaurant=${restaurantId}`;
    };

    function showToast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.classList.add("show");
      setTimeout(() => t.classList.remove("show"), 2000);
    }
  </script>
</body>
</html>
