  <script>

      const s = document.createElement("script");
      s.src = `//dapi.kakao.com/v2/maps/sdk.js?appkey=${CONFIG.KAKAO_MAP_KEY}&autoload=false`;
      s.onload = () => kakao.maps.load(initMap);

  <style>
    /* ── 취향 요약 카드 ── */
    .taste-card {
      margin: var(--spacing-md);
      padding: var(--spacing-lg);
      background: var(--color-primary);
      border-radius: var(--radius-xl);
      color: var(--color-text-white);
    }

    .taste-label {
      font-size: 0.75rem;
      font-weight: 500;
      opacity: 0.8;
      margin-bottom: 8px;
    }

    .taste-keywords {
      font-size: 1.5rem;
      font-weight: 800;
      margin-bottom: 6px;
      letter-spacing: -0.5px;
    }

    .taste-subtitle {
      font-size: 0.8125rem;
      opacity: 0.85;
    }

    /* ── 섹션 타이틀 ── */
    .section-title-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 var(--spacing-md);
      margin-bottom: 12px;
    }

    .section-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--color-primary);
    }

    .section-title {
      font-size: 1.0625rem;
      font-weight: 700;
    }

    /* ── 추천 카드 ── */
    .recommend-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 0 var(--spacing-md);
      margin-bottom: var(--spacing-lg);
    }

    .recommend-card {
      background: var(--color-bg-card);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-card);
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.15s;
    }

    .recommend-card:active {
      transform: scale(0.98);
    }

    .rc-inner {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px;
    }

    .rc-thumb {
      width: 72px;
      height: 72px;
      border-radius: var(--radius-md);
      background: var(--color-bg-input);
      flex-shrink: 0;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
    }

    .rc-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .rc-info {
      flex: 1;
      min-width: 0;
    }

    .rc-name {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 3px;
    }

    .rc-meta {
      font-size: 0.75rem;
      color: var(--color-text-secondary);
      margin-bottom: 7px;
    }

    .rc-arrow {
      color: var(--color-text-tertiary);
      font-size: 1.125rem;
      flex-shrink: 0;
    }

    /* ── 지도 ── */
    .map-section {
      padding: 0 var(--spacing-md);
      margin-bottom: var(--spacing-lg);
    }

    #kakaoMap {
      width: 100%;
      height: 220px;
      border-radius: var(--radius-lg);
      overflow: hidden;
      background: var(--color-bg-input);
    }

    /* ── 다시 탐색 버튼 ── */
    .bottom-actions {
      padding: var(--spacing-md);
      padding-bottom: calc(var(--nav-height) + 16px);
    }

    /* ── 로딩 ── */
    .ai-loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px var(--spacing-md);
      gap: 16px;
      text-align: center;
    }

    .ai-loading-title {
      font-size: 1.125rem;
      font-weight: 600;
    }

    .ai-loading-sub {
      font-size: 0.875rem;
      color: var(--color-text-secondary);
      line-height: 1.6;
    }

    /* ── 에러 ── */
    .error-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px var(--spacing-md);
      gap: 12px;
      text-align: center;
    }
  </style>
</head>

  <!-- 식당 상세 모달 -->
  <div class="modal-overlay" id="modalOverlay" onclick="handleOverlayClick(event)">

  <div class="toast" id="toast"></div>

  <script type="module">
    import {
      getMenusByRestaurant,
      addLike, removeLike, getUserDoc,
      addRegular, removeRegular,
      getStorageUrl, getOpenStatus, formatDistance, loadRestaurantData,
    } from "./firebase.js";
    import { onAuthChanged } from "./auth.js";

    // ── 상태 ──
    let recommendedRestaurants = [];
    let recommendedMenus       = [];
    let allRestaurants         = [];
    let allMenus               = [];
    let currentUser            = null;
    let userLikes              = [];
    let userRegulars           = [];
    let currentRestaurant      = null;

    // ── 인증 ──
    onAuthChanged(async (user) => {
      currentUser = user;
      if (user) {
        const userData = await getUserDoc(user.uid);
        userLikes    = userData.likes    || [];
        userRegulars = userData.regulars || [];
      }
    });

    // ── 메뉴 메모리 캐시 (모달 단위) ──
    const menuCache = {};

    async function init() {
      const swipeRaw = sessionStorage.getItem("swipeResult");
      if (!swipeRaw) { showError("스와이프 결과가 없습니다. 다시 시도해주세요."); return; }
      const swipeResult = JSON.parse(swipeRaw);

      const { restaurants, menus } = await loadRestaurantData();
      allRestaurants = restaurants;
      allMenus       = menus;

      await callGroq(swipeResult);
    }

    // 로딩 메시지 순환
    const loadingMsgs = [
      "스와이프 데이터를<br/>AI가 분석 중이에요 🤔",
      "좋아요·싫어요 패턴을<br/>파악하고 있어요 🔍",
      "취향에 딱 맞는 맛집을<br/>고르고 있어요 🍽️",
      "거의 다 됐어요!<br/>조금만 기다려주세요 ✨",
    ];
    let msgIdx = 0;
    const msgTimer = setInterval(() => {
      const el = document.getElementById("loadingMsg");
      if (!el) { clearInterval(msgTimer); return; }
      msgIdx = (msgIdx + 1) % loadingMsgs.length;
      el.innerHTML = loadingMsgs[msgIdx];
    }, 2000);

    init();
    
    // ── tagScore로 메뉴 후보 선별 ──
    function selectCandidateMenus(tagScore, dislikedRids, dislikeOnlyTags = [], count = 15) {
      const CATEGORIES = ["한식","중식","일식","양식","분식","패스트푸드","아시아"];
      const perCat     = Math.ceil(count / CATEGORIES.length);

      const scored = allMenus
        .filter(m => !dislikedRids.has(String(m.restaurantId)))
        .map(m => {
          const tags    = m.tags?.split(",").map(t => t.trim()) || [];
          const base    = tags.reduce((s, t) => s + (tagScore[t] || 0), 0);
          const penalty = tags.filter(t => dislikeOnlyTags.includes(t)).length * 2;
          return { ...m, _score: base - penalty };
        })
        .sort((a, b) => b._score - a._score);

      const catCount = {};
      const result   = [];
      for (const m of scored) {
        if (result.length >= count) break;
        const cat = m.category || "";
        catCount[cat] = catCount[cat] || 0;
        if (catCount[cat] >= perCat) continue;
        result.push(m);
        catCount[cat]++;
      }
      if (result.length < count) {
        const ids = new Set(result.map(m => m.id));
        for (const m of scored) {
          if (result.length >= count) break;
          if (!ids.has(m.id)) result.push(m);
        }
      }
      return result;
    }

    // ── Groq API 호출 ──
    async function callGroq(swipeResult) {
      try {
        const likes           = swipeResult.likes           || [];
        const dislikes        = swipeResult.dislikes        || [];
        const tagScore        = swipeResult.tagScore        || {};
        const dislikeOnlyTags = swipeResult.dislikeOnlyTags || [];

        const dislikedRids      = new Set(dislikes.map(d => String(d.restaurantId)));
        const candidates        = selectCandidateMenus(tagScore, dislikedRids, dislikeOnlyTags, 15);
        const candidateLines    = candidates.map(m => {
          const r = allRestaurants.find(r => String(r.id) === String(m.restaurantId));
          return `menu_id:${m.id}|메뉴명:${m.name}|식당:${r?.name || "-"}|카테고리:${m.category || r?.category || "-"}|태그:${m.tags || ""}`;
        }).join("\n");

        const sortedTags        = Object.entries(tagScore).sort((a, b) => b[1] - a[1]);
        const positiveTags      = sortedTags.filter(([, v]) => v > 0).slice(0, 6).map(([k, v]) => `${k}(${v})`);
        const dislikedMenuNames = dislikes.map(d => d.menuName).filter(Boolean);

        const prompt = `사용자 취향 데이터:
선호 태그(높은순): ${positiveTags.join(", ") || "없음"}
회피 태그(싫어요 전용): ${dislikeOnlyTags.join(", ") || "없음"} (이 태그 메뉴는 추천 제외)
좋아요한 메뉴: ${likes.map(l => l.menuName).filter(Boolean).join(", ") || "없음"}
싫어요한 메뉴: ${dislikedMenuNames.join(", ") || "없음"}

후보 메뉴 목록 (카테고리 다양성 확보됨):
${candidateLines}

위 후보 중 취향에 맞는 메뉴 ${CONFIG.RECOMMEND_COUNT}개를 골라 JSON으로만 출력.
규칙:
1. 회피 태그가 포함된 메뉴는 제외
2. 가능하면 서로 다른 카테고리에서 선택
3. taste_keywords: 선호 태그 중 대표 형용사 1~2개를 뽑아 "A하고 B한 맛"처럼 표현 (없으면 카테고리 기반)
4. summary 작성 규칙:
   - 각 메뉴의 키워드는 반드시 해당 메뉴의 태그에서만 추출한다
   - 태그 중 형용사를 A로, 명사를 B로 사용해 자연스러운 키워드를 만든다
   - 태그에 없는 단어는 절대 사용하지 않는다. 부정형 표현 절대 금지
   - 키워드 뒤에 마무리 문구를 붙인다. 친근하고 가볍게, 전체 50자 이내
{"taste_keywords":"키워드","summary":"통합 추천 문구","recommendations":[{"menu_id":"0311"}]}`;
        
        let data;
        for (let attempt = 1; attempt <= 3; attempt++) {
          const response = await fetch(
            "https://api.groq.com/openai/v1/chat/completions",
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${CONFIG.GROQ_API_KEY}`,
              },
              body: JSON.stringify({
                model: "llama-3.3-70b-versatile",
                messages: [
                  { role: "system", content: "You are a food recommendation expert. Always respond with valid JSON only, no explanation." },
                  { role: "user", content: prompt }
                ],
                response_format: { type: "json_object" },
                temperature: 0.7,
                max_tokens: 512,
              }),
            }
          );
          data = await response.json();

          if (data.error) {
            const status = response.status || 0;
            if ((status === 503 || status === 429) && attempt < 3) {
              const wait = attempt * 3000;
              document.getElementById("loadingMsg").innerHTML =
                `서버가 혼잡해요. ${wait/1000}초 후 재시도 중... (${attempt}/3)`;
              await new Promise(r => setTimeout(r, wait));
              continue;
            }
            throw new Error(`Groq API 오류: ${data.error.message || JSON.stringify(data.error)}`);
          }
          break;
        }

        const rawText = data.choices?.[0]?.message?.content || "";
        if (!rawText) throw new Error("Groq 응답이 비어있습니다.");

        const clean  = rawText.replace(/```json|```/g, "").trim();
        const result = JSON.parse(clean);

        const matched = result.recommendations
          .map(rec => {
            const recId  = String(rec.menu_id || "").trim();
            const menu   = allMenus.find(m => String(m.id) === recId);
            if (!menu) { console.warn("메뉴 매칭 실패:", rec.menu_id); return null; }
            const restaurant = allRestaurants.find(r => String(r.id) === String(menu.restaurantId));
            if (!restaurant) { console.warn("식당 매칭 실패:", menu.restaurantId); return null; }
            return { menu, restaurant };
          })
          .filter(Boolean)
          .slice(0, CONFIG.RECOMMEND_COUNT);

        if (matched.length === 0) throw new Error("추천 메뉴를 찾을 수 없습니다.");

        recommendedMenus       = matched.map(m => m.menu);
        recommendedRestaurants = matched.map(m => m.restaurant);

        clearInterval(msgTimer);
        renderResult(result);

      } catch (err) {
        console.error("Groq API 오류:", err);
        useFallback(swipeResult, err);
      }
    }

    // ── AI 실패 폴백: 좋아요 기반 랜덤 추천 ──
    function useFallback(swipeResult, err) {
      console.warn("폴백 추천 사용:", err);
      const liked   = (swipeResult.likes || [])
        .map(l => allRestaurants.find(r => r.id === l.restaurantId))
        .filter(Boolean);
      const pool    = liked.length > 0 ? liked : [...allRestaurants];
      pool.sort(() => Math.random() - 0.5);
      recommendedRestaurants = pool.slice(0, CONFIG.RECOMMEND_COUNT);
      recommendedMenus       = recommendedRestaurants.map(() => null);

      if (recommendedRestaurants.length > 0) {
        clearInterval(msgTimer);
        renderResult({ taste_keywords: null, summary: "AI 서버가 혼잡해요. 취향 기반 추천을 준비했어요 😊" });
      } else {
        showError("AI 추천에 실패했습니다. 다시 시도해주세요.");
      }
    }

    // ── 결과 렌더링 ──
    function renderResult(aiResult) {
      const main     = document.getElementById("mainContent");
      const summary  = aiResult.summary        || "";
      const keywords = aiResult.taste_keywords || "";
      const catEmoji = { 한식:"🍚",중식:"🥢",일식:"🍣",양식:"🍝",분식:"🌮",패스트푸드:"🍔",아시아:"🍜",카페:"☕",기타:"🍽️" };

      const cardsHtml = recommendedRestaurants.map((r, i) => {
        const menu   = recommendedMenus[i];
        const imgUrl = menu?.photo ? getStorageUrl(menu.photo) : null;
        const emoji  = catEmoji[r.category] || "🍽️";
        return `
          <div class="recommend-card" onclick="openModal('${r.id}')">
            <div class="rc-inner">
              <div class="rc-thumb">
                ${imgUrl
                  ? `<img src="${imgUrl}" alt="${menu.name}" onerror="onMenuImgError(this,'${menu.photo}')" />`
                  : `<span style="font-size:2rem">${emoji}</span>`}
              </div>
              <div class="rc-info">
                <div class="rc-name">${menu ? menu.name : r.name}</div>
                <div class="rc-meta">${r.name} · ${r.category}</div>
                <div class="tag-list" style="margin-bottom:4px">
                  ${r.tags ? r.tags.split(",").slice(0,3).map(t => `<span class="tag">${t.trim()}</span>`).join("") : ""}
                </div>
                <div style="display:flex;align-items:center;gap:8px">
                  <div class="rating"><span class="rating-star">★</span>${r.rating || '-'}</div>
                  <span style="font-size:0.75rem;color:var(--color-text-tertiary)">${['₩','₩₩','₩₩₩'][r.price_range-1] || ''}</span>
                </div>
              </div>
              <span class="rc-arrow">›</span>
            </div>
          </div>`;
      }).join("");

      main.innerHTML = `
        ${keywords ? `
        <div class="taste-card">
          <div class="taste-label">당신의 취향</div>
          <div class="taste-keywords">${keywords}</div>
          ${summary ? `<div class="taste-subtitle">${summary}</div>` : ""}
        </div>` : summary ? `
        <div style="margin:var(--spacing-md);padding:14px 16px;background:var(--color-primary-light);border-radius:var(--radius-lg);font-size:0.875rem;color:var(--color-primary-dark);line-height:1.6;font-weight:500">
          ✨ ${summary}
        </div>` : ""}

        <div class="section-title-row" style="margin-top:${keywords || summary ? '4px' : 'var(--spacing-md)'}">
          <div class="section-dot"></div>
          <div class="section-title">추천 맛집</div>
        </div>
        <div class="recommend-list">${cardsHtml}</div>

        <div class="section-title-row">
          <div class="section-dot"></div>
          <div class="section-title">위치</div>
        </div>
        <div class="map-section"><div id="kakaoMap"></div></div>

        <div class="bottom-actions">
          <button class="btn-primary" onclick="restartSwipe()">다시 탐색하기</button>
        </div>`;

      if (window.kakao && window.kakao.maps) kakao.maps.load(initMap);
    }

    // ── 카카오맵 초기화 ──
    window.initMap = function () {
      const mapEl = document.getElementById("kakaoMap");
      if (!mapEl || recommendedRestaurants.length === 0) return;

      const makeMarkerImage = (fill) => {
        const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="32" height="42" viewBox="0 0 32 42">
          <path d="M16 0C7.2 0 0 7 0 15.6c0 10.5 14.4 25 15 25.6.6.5 1.4.5 2 0 .6-.6 15-15.1 15-25.6C32 7 24.8 0 16 0z" fill="${fill}"/>
          <circle cx="16" cy="15" r="5.5" fill="#fff"/>
        </svg>`;
        const url = "data:image/svg+xml;utf8," + encodeURIComponent(svg);
        return new kakao.maps.MarkerImage(url, new kakao.maps.Size(32, 42), { offset: new kakao.maps.Point(16, 42) });
      };

      const center     = new kakao.maps.LatLng(CONFIG.HANSUNG_LAT, CONFIG.HANSUNG_LNG);
      const mapInstance = new kakao.maps.Map(mapEl, { center, level: 4 });

      // 한성대 마커 (회색)
      const hansungPos = new kakao.maps.LatLng(CONFIG.HANSUNG_LAT, CONFIG.HANSUNG_LNG);
      const hansungMkr = new kakao.maps.Marker({ map: mapInstance, position: hansungPos, image: makeMarkerImage("#9CA3AF") });
      new kakao.maps.InfoWindow({
        content: '<div style="display:inline-block;padding:2px 5px;font-size:0.6875rem;white-space:nowrap">한성대</div>',
      }).open(mapInstance, hansungMkr);

      const bounds = new kakao.maps.LatLngBounds();
      bounds.extend(hansungPos);

      // 추천 식당 마커 (파란색 + 번호)
      recommendedRestaurants.forEach((r, i) => {
        if (!r.lat || !r.lng) return;
        const pos = new kakao.maps.LatLng(r.lat, r.lng);
        const mkr = new kakao.maps.Marker({ map: mapInstance, position: pos, image: makeMarkerImage("#2563EB") });
        const iw  = new kakao.maps.InfoWindow({
          content: `<div style="display:inline-block;padding:2px 5px;font-size:0.6875rem;white-space:nowrap">${i+1}. ${r.name}</div>`,
        });
        iw.open(mapInstance, mkr);
        kakao.maps.event.addListener(mkr, "click", () => iw.open(mapInstance, mkr));
        bounds.extend(pos);
      });

      mapInstance.setBounds(bounds, 60);
    };

    // ── 모달 열기 ──
    window.openModal = async function (restaurantId) {
      const restaurant = allRestaurants.find(r => r.id === restaurantId);
      if (!restaurant) return;
      currentRestaurant = restaurant;

      // 히어로 이미지
      const heroEmoji = document.getElementById("modalHeroEmoji");
      const heroImg   = document.getElementById("modalHeroImg");
      const catEmoji  = { 한식:"🍚",중식:"🥢",일식:"🍣",양식:"🍝",분식:"🌮",패스트푸드:"🍔",아시아:"🍜",카페:"☕",기타:"🍽️" };
      const recIdx    = recommendedRestaurants.findIndex(r => r.id === restaurantId);
      const recMenu   = recIdx >= 0 ? recommendedMenus[recIdx] : null;
      const heroPhoto = recMenu?.photo || restaurant.photo;

      if (heroPhoto) {
        heroImg.src          = getStorageUrl(heroPhoto);
        heroImg.style.display = "block";
        heroEmoji.style.display = "none";
        heroImg.onerror = () => { heroImg.style.display = "none"; heroEmoji.style.display = "block"; };
      } else {
        heroEmoji.textContent   = catEmoji[restaurant.category] || "🍽️";
        heroImg.style.display   = "none";
        heroEmoji.style.display = "block";
      }

      // 영업 상태 (브레이크 타임 포함)
      const status   = getOpenStatus(restaurant);
      const statusMap = {
        open:   { text: "영업중",   cls: "badge-open"   },
        break:  { text: "브레이크", cls: "badge-break"  },
        closed: { text: "영업종료", cls: "badge-closed" },
      };
      document.getElementById("modalName").textContent = restaurant.name;
      const badge = document.getElementById("modalStatusBadge");
      badge.textContent = statusMap[status].text;
      badge.className   = `badge ${statusMap[status].cls}`;

      // 메타 정보
      const distanceValue = (restaurant.lat && restaurant.lng)
        ? formatDistance(CONFIG.HANSUNG_LAT, CONFIG.HANSUNG_LNG, restaurant.lat, restaurant.lng)
        : "-";
      const metaRows = [
        { icon: "🏷️", label: "카테고리", value: restaurant.category || "-" },
        { icon: "📍", label: "거리",    value: distanceValue },
        { icon: "🕐", label: "영업시간", value: restaurant.hours || "-" },
      ];
      if (restaurant.break_time && restaurant.break_time !== "없음")
        metaRows.push({ icon: "☕", label: "브레이크", value: restaurant.break_time });
      if (restaurant.closed_day && restaurant.closed_day !== "없음")
        metaRows.push({ icon: "📅", label: "정기휴무", value: restaurant.closed_day });

      document.getElementById("modalMeta").innerHTML = metaRows.map(r => `
        <div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--color-border-light)">
          <span style="font-size:0.9375rem;width:20px;text-align:center">${r.icon}</span>
          <span style="font-size:0.75rem;color:var(--color-text-tertiary);width:52px;flex-shrink:0">${r.label}</span>
          <span style="font-size:0.8125rem;color:var(--color-text-primary);font-weight:500">${r.value}</span>
        </div>`).join("");

      // 태그
      document.getElementById("modalTags").innerHTML = restaurant.tags
        ? restaurant.tags.split(",").map(t => `<span class="tag">${t.trim()}</span>`).join("") : "";

      document.getElementById("reasonBox").style.display = "none";

      // 메뉴
      if (!menuCache[restaurantId]) {
        menuCache[restaurantId] = await getMenusByRestaurant(restaurantId);
      }
      const menus = menuCache[restaurantId];
      const menuList = document.getElementById("modalMenuList");
      menuList.innerHTML = menus.length > 0
        ? menus.map(m => `
          <div class="menu-item">
            <div class="menu-item-left">
              ${m.photo
                ? `<img class="menu-photo" src="${getStorageUrl(m.photo)}" alt="${m.name}"
                     onerror="onMenuImgError(this,'${m.photo}')" />`
                : `<div class="menu-photo-placeholder">🍽️</div>`}
              <span class="menu-name">${m.name}</span>
            </div>
            <span class="menu-price">${m.price ? m.price.toLocaleString() + '원' : '-'}</span>
          </div>`).join('')
        : '<p style="color:var(--color-text-tertiary);font-size:0.8125rem">메뉴 정보가 없습니다</p>';

      updateModalSaveBtn();
      updateModalRegularBtn();

      document.getElementById("modalOverlay").classList.add("open");
      document.body.style.overflow = "hidden";

      setTimeout(() => initModalMap(restaurant), 400);
    };

    function updateModalSaveBtn() {
      if (!currentRestaurant) return;
      const liked = userLikes.includes(currentRestaurant.id);
      document.getElementById("modalSaveIcon").textContent = liked ? "❤️" : "🤍";
      document.getElementById("modalSaveBtn").classList.toggle("active", liked);
    }

    function updateModalRegularBtn() {
      if (!currentRestaurant) return;
      const isReg = userRegulars.includes(currentRestaurant.id);
      document.getElementById("modalRegularBtn").classList.toggle("active", isReg);
      document.getElementById("modalRegularLabel").textContent = isReg ? "단골 ✓" : "단골";
    }

    window.closeModal = function () {
      document.getElementById("modalOverlay").classList.remove("open");
      document.body.style.overflow = "";
    };

    window.handleOverlayClick = function (e) {
      if (e.target === document.getElementById("modalOverlay")) closeModal();
    };

    // ── 저장 (좋아요) 토글 ──
    window.handleSave = async function () {
      if (!currentUser)      { showToast("로그인이 필요합니다"); return; }
      if (!currentRestaurant) return;
      const liked = userLikes.includes(currentRestaurant.id);
      if (liked) {
        userLikes = userLikes.filter(id => id !== currentRestaurant.id);
        await removeLike(currentUser.uid, currentRestaurant.id);
        showToast("좋아요 취소");
      } else {
        userLikes.push(currentRestaurant.id);
        await addLike(currentUser.uid, currentRestaurant.id);
        showToast("저장되었습니다!");
      }
      updateModalSaveBtn();
    };

    // ── 단골 토글  ──
    window.handleModalRegular = async function () {
      if (!currentUser)      { showToast("로그인이 필요합니다"); return; }
      if (!currentRestaurant) return;
      const isReg = userRegulars.includes(currentRestaurant.id);
      if (isReg) {
        userRegulars = userRegulars.filter(id => id !== currentRestaurant.id);
        await removeRegular(currentUser.uid, currentRestaurant.id);
        showToast("단골 해제");
      } else {
        userRegulars.push(currentRestaurant.id);
        await addRegular(currentUser.uid, currentRestaurant.id);
        showToast("단골 등록! 🏆");
      }
      updateModalRegularBtn();
    };

    window.openNav = function () {
      if (!currentRestaurant) return;
      window.open(
        `https://map.kakao.com/link/from/한성대학교,${CONFIG.HANSUNG_LAT},${CONFIG.HANSUNG_LNG}/to/${currentRestaurant.name},${currentRestaurant.lat},${currentRestaurant.lng}`,
        "_blank"
      );
    };

    window.openKakaoMap = function () {
      if (!currentRestaurant) return;
      window.open(`https://map.kakao.com/link/map/${currentRestaurant.name},${currentRestaurant.lat},${currentRestaurant.lng}`, "_blank");
    };

    function initModalMap(restaurant) {
      const mapEl = document.getElementById("modalMap");
      if (!mapEl) return;
      function drawMap() {
        mapEl.innerHTML = "";
        const hasCoord = restaurant.lat && restaurant.lng;
        const center   = new kakao.maps.LatLng(
          hasCoord ? restaurant.lat : CONFIG.HANSUNG_LAT,
          hasCoord ? restaurant.lng : CONFIG.HANSUNG_LNG
        );
        const map = new kakao.maps.Map(mapEl, { center, level: 4 });
        const makeMarkerImage = (fill) => {
          const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="32" height="42" viewBox="0 0 32 42"><path d="M16 0C7.2 0 0 7 0 15.6c0 10.5 14.4 25 15 25.6.6.5 1.4.5 2 0 .6-.6 15-15.1 15-25.6C32 7 24.8 0 16 0z" fill="${fill}"/><circle cx="16" cy="15" r="5.5" fill="#fff"/></svg>`;
          const url = "data:image/svg+xml;utf8," + encodeURIComponent(svg);
          return new kakao.maps.MarkerImage(url, new kakao.maps.Size(32, 42), { offset: new kakao.maps.Point(16, 42) });
        };
        const hansungPos    = new kakao.maps.LatLng(CONFIG.HANSUNG_LAT, CONFIG.HANSUNG_LNG);
        const hansungMarker = new kakao.maps.Marker({ map, position: hansungPos, image: makeMarkerImage("#9CA3AF") });
        new kakao.maps.InfoWindow({
          content: '<div style="display:inline-block;padding:2px 5px;font-size:0.6875rem;white-space:nowrap;line-height:1.4">한성대</div>',
        }).open(map, hansungMarker);
        if (hasCoord) {
          const restPos    = new kakao.maps.LatLng(restaurant.lat, restaurant.lng);
          const restMarker = new kakao.maps.Marker({ map, position: restPos, image: makeMarkerImage("#2563EB") });
          new kakao.maps.InfoWindow({
            content: `<div style="display:inline-block;padding:2px 5px;font-size:0.6875rem;white-space:nowrap;line-height:1.4">${restaurant.name}</div>`,
          }).open(map, restMarker);
          const bounds = new kakao.maps.LatLngBounds();
          bounds.extend(hansungPos);
          bounds.extend(restPos);
          map.setBounds(bounds, 60);
        }
      }
      if (window.kakao && window.kakao.maps) {
        kakao.maps.load(drawMap);
      } else {
        let retries = 0;
        const wait = setInterval(() => {
          if (window.kakao && window.kakao.maps) { clearInterval(wait); kakao.maps.load(drawMap); }
          else if (++retries > 10) clearInterval(wait);
        }, 300);
      }
    }

    window.restartSwipe = function () {
      sessionStorage.clear();
      window.location.href = "./swipe.html";
    };

    // ── 이미지 에러 폴백 ──
    window.onMenuImgError = function (img, photo) {
      img.outerHTML = '<div class="menu-photo-placeholder">🍽️</div>';
    };

    function showError(msg) {
      clearInterval(msgTimer);
      document.getElementById("mainContent").innerHTML = `
        <div class="error-state">
          <div style="font-size:3rem">😢</div>
          <div style="font-size:1rem;font-weight:600">${msg}</div>
          <button class="btn-primary" onclick="location.href='./swipe.html'" style="max-width:200px">다시 스와이프하기</button>
        </div>`;
    }

    function showToast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.classList.add("show");
      setTimeout(() => t.classList.remove("show"), 2000);
    }
  </script>
</body>
</html>
