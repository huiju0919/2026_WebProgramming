<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FOOD FIRST — 추천 결과</title>
  <link rel="stylesheet" href="./common.css" />
  <!-- 카카오맵 SDK -->
  <script type="text/javascript">
    // config.js 로드 후 SDK 로드
    window.addEventListener("load", () => {
      const script = document.createElement("script");
      script.src = `//dapi.kakao.com/v2/maps/sdk.js?appkey=${CONFIG.KAKAO_MAP_KEY}&autoload=false`;
      script.onload = () => kakao.maps.load(initMap);
      document.head.appendChild(script);
    });
  </script>
  <style>
    /* ── 취향 요약 카드 ── */
    .taste-card {
      margin: var(--spacing-md);
      padding: var(--spacing-lg);
      background: var(--color-primary);
      border-radius: var(--radius-xl);
      color: var(--color-text-white);
    }

    .taste-label {
      font-size: 12px;
      font-weight: 500;
      opacity: 0.8;
      margin-bottom: 8px;
    }

    .taste-keywords {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 6px;
      letter-spacing: -0.5px;
    }

    .taste-subtitle {
      font-size: 13px;
      opacity: 0.85;
    }

    /* ── 섹션 타이틀 ── */
    .section-title-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 var(--spacing-md);
      margin-bottom: 12px;
    }

    .section-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--color-primary);
    }

    .section-title {
      font-size: 17px;
      font-weight: 700;
    }

    /* ── 추천 카드 ── */
    .recommend-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 0 var(--spacing-md);
      margin-bottom: var(--spacing-lg);
    }

    .recommend-card {
      background: var(--color-bg-card);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-card);
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.15s;
    }

    .recommend-card:active {
      transform: scale(0.98);
    }

    .rc-inner {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px;
    }

    .rc-thumb {
      width: 72px;
      height: 72px;
      border-radius: var(--radius-md);
      background: var(--color-bg-input);
      flex-shrink: 0;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
    }

    .rc-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .rc-info {
      flex: 1;
      min-width: 0;
    }

    .rc-name {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 3px;
    }

    .rc-meta {
      font-size: 12px;
      color: var(--color-text-secondary);
      margin-bottom: 7px;
    }

    .rc-arrow {
      color: var(--color-text-tertiary);
      font-size: 18px;
      flex-shrink: 0;
    }

    /* ── 미니 지도 ── */
    .map-section {
      padding: 0 var(--spacing-md);
      margin-bottom: var(--spacing-lg);
    }

    #kakaoMap {
      width: 100%;
      height: 220px;
      border-radius: var(--radius-lg);
      overflow: hidden;
      background: var(--color-bg-input);
    }

    /* ── 다시 탐색 버튼 ── */
    .bottom-actions {
      padding: var(--spacing-md);
      padding-bottom: calc(var(--nav-height) + 16px);
    }

    /* ── 상세 모달 (index.html과 동일) ── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 200;
      display: flex;
      align-items: flex-end;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }

    .modal-overlay.open {
      opacity: 1;
      pointer-events: all;
    }

    .modal-sheet {
      width: 100%;
      max-width: var(--max-width);
      margin: 0 auto;
      background: var(--color-bg-card);
      border-radius: var(--radius-xl) var(--radius-xl) 0 0;
      max-height: 90vh;
      overflow-y: auto;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
    }

    .modal-overlay.open .modal-sheet {
      transform: translateY(0);
    }

    .modal-hero {
      aspect-ratio: 16/9;
      background: var(--color-bg-input);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 64px;
    }

    .modal-close {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 32px;
      height: 32px;
      background: rgba(255,255,255,0.9);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      cursor: pointer;
      z-index: 1;
    }

    .modal-body { padding: var(--spacing-md); }
    .modal-title { font-size: 20px; font-weight: 700; }
    .modal-meta { font-size: 13px; color: var(--color-text-secondary); margin: 6px 0 10px; }
    .modal-divider { height: 1px; background: var(--color-border-light); margin: var(--spacing-md) 0; }
    .modal-section-title { font-size: 15px; font-weight: 600; margin-bottom: 12px; }

    .reason-box {
      background: var(--color-primary-light);
      border-radius: var(--radius-md);
      padding: 12px 14px;
      font-size: 13px;
      color: var(--color-primary-dark);
      line-height: 1.6;
      margin-bottom: var(--spacing-md);
    }

    .menu-list { display: flex; flex-direction: column; gap: 12px; }
    .menu-item { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .menu-item-left { display: flex; align-items: center; gap: 12px; }
    .menu-photo { width: 56px; height: 56px; border-radius: var(--radius-md); object-fit: cover; background: var(--color-bg-input); flex-shrink: 0; }
    .menu-photo-placeholder { width: 56px; height: 56px; border-radius: var(--radius-md); background: var(--color-bg-input); display: flex; align-items: center; justify-content: center; font-size: 24px; flex-shrink: 0; }
    .menu-name { font-size: 14px; font-weight: 500; }
    .menu-price { font-size: 14px; font-weight: 600; color: var(--color-primary); flex-shrink: 0; }
    .modal-btn-row { display: grid; grid-template-columns: 1fr 2fr; gap: 10px; padding: var(--spacing-md); padding-top: 0; }

    /* 로딩 */
    .ai-loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px var(--spacing-md);
      gap: 16px;
      text-align: center;
    }

    .ai-loading-title {
      font-size: 18px;
      font-weight: 600;
    }

    .ai-loading-sub {
      font-size: 14px;
      color: var(--color-text-secondary);
    }

    /* 에러 */
    .error-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px var(--spacing-md);
      gap: 12px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="app-container">

    <!-- 헤더 -->
    <header class="header">
      <div class="header-back">
        <a href="./swipe.html">
          <svg viewBox="0 0 24 24" fill="currentColor" width="24" height="24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
        </a>
      </div>
      <span class="header-logo">딱 맞는 맛집 찾았어요!</span>
      <div style="width:40px"></div>
    </header>

    <!-- 메인 콘텐츠 -->
    <div class="page-content" id="mainContent">
      <!-- AI 로딩 -->
      <div class="ai-loading" id="aiLoading">
        <div class="spinner" style="width:48px;height:48px;border-width:4px"></div>
        <div class="ai-loading-title">AI가 분석 중이에요</div>
        <div class="ai-loading-sub">스와이프 취향을 기반으로<br/>최적의 맛집을 찾고 있어요</div>
      </div>

    <!-- 하단 내비게이션 -->
    <nav class="bottom-nav">
      <a href="./index.html" class="nav-item">

        홈
      </a>
      <a href="./swipe.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17 12h-5v5h5v-5zM16 1v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2h-1V1h-2zm3 18H5V8h14v11z"/></svg>
        스와이프
      </a>
      <a href="./mypage.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
        마이
      </a>
    </nav>

  </div>

  <!-- 식당 상세 모달 -->
  <div class="modal-overlay" id="modalOverlay" onclick="handleOverlayClick(event)">
    <div class="modal-sheet">
      <div class="modal-hero" id="modalHero">
        <span id="modalHeroEmoji">🍽️</span>
        <img id="modalHeroImg" style="display:none;width:100%;height:100%;object-fit:cover;position:absolute;inset:0" />
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-body">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
          <h2 class="modal-title" id="modalName"></h2>
          <span class="badge" id="modalStatusBadge"></span>
        </div>
        <p class="modal-meta" id="modalMeta"></p>
        <div class="tag-list" id="modalTags"></div>
        <div class="reason-box" id="reasonBox" style="display:none"></div>
        <div class="modal-divider"></div>
        <h3 class="modal-section-title">메뉴</h3>
        <div class="menu-list" id="modalMenuList"></div>
      </div>
      <div class="modal-btn-row">
        <button class="btn-secondary" id="modalSaveBtn" onclick="handleSave()">🤍 저장</button>
        <button class="btn-primary" onclick="openNav()">길 찾기 ✈</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="./config.js"></script>
  <script type="module">
    import { getRestaurants, getMenusByRestaurant, addLike, removeLike, getUserDoc } from "./firebase.js";
    import { onAuthChanged } from "./auth.js";

    // ── 상태 ──
    let recommendedRestaurants = []; // 추천 3개
    let allRestaurants = [];
    let currentUser = null;
    let userLikes = [];
    let currentRestaurant = null;
    let aiReasons = {};   // { restaurantId: "추천 사유 텍스트" }
    let mapInstance = null;

    // ── 인증 ──
    onAuthChanged(async (user) => {
      currentUser = user;
      if (user) {
        const userData = await getUserDoc(user.uid);
        userLikes = userData.likes || [];
      }
    });

    // ── 초기화 ──
    async function init() {
      // sessionStorage에서 스와이프 결과 가져오기
      const swipeRaw = sessionStorage.getItem("swipeResult");
      if (!swipeRaw) {
        showError("스와이프 결과가 없습니다. 다시 시도해주세요.");
        return;
      }
      const swipeResult = JSON.parse(swipeRaw);
      allRestaurants = await getRestaurants();

      // Gemini API 호출
      await callGemini(swipeResult);
    }

    init();

    // ── Gemini API 호출 ──
    async function callGemini(swipeResult) {
      try {
        const likedRestaurants = swipeResult.likes.map(id =>
          swipeResult.allRestaurants.find(r => r.id === id)
        ).filter(Boolean);

        const dislikedRestaurants = swipeResult.dislikes.map(id =>
          swipeResult.allRestaurants.find(r => r.id === id)
        ).filter(Boolean);

        const prompt = `
당신은 식당 추천 전문가입니다.

사용자의 스와이프 결과를 분석해서 식당 ${CONFIG.RECOMMEND_COUNT}곳을 추천해주세요.

## 좋아요한 식당 (${likedRestaurants.length}개)
${likedRestaurants.map(r => `- ${r.name} (${r.category}) 태그: ${r.tags || '없음'}`).join('\n')}

## 싫어요한 식당 (${dislikedRestaurants.length}개)
${dislikedRestaurants.map(r => `- ${r.name} (${r.category}) 태그: ${r.tags || '없음'}`).join('\n')}

## 추천 가능한 식당 목록
${swipeResult.allRestaurants.map(r => `id:${r.id} name:${r.name} category:${r.category} tags:${r.tags || ''} distance:${r.distance || '?'}km`).join('\n')}

위 목록 중에서만 추천해주세요.
이미 좋아요/싫어요한 식당도 추천에 포함될 수 있습니다.

반드시 아래 JSON 형식으로만 응답하고 다른 텍스트는 포함하지 마세요:
{
  "taste_keywords": "사용자 취향을 2~3개 키워드로 (예: 얼큰·한식·혼밥)",
  "taste_summary": "좋아하시는 맛집 수를 포함한 한 줄 요약 (예: 8개의 맛집을 좋아하시는군요 🎯)",
  "recommendations": [
    {
      "id": "식당 id",
      "reason": "추천 사유 (20자 이내, 친근한 말투)"
    }
  ]
}`;

        const response = await fetch(
          `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${CONFIG.GEMINI_API_KEY}`,
          {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              contents: [{ parts: [{ text: prompt }] }],
              generationConfig: { temperature: 0.7, maxOutputTokens: 1000 },
            }),
          }
        );

        const data = await response.json();
        const rawText = data.candidates?.[0]?.content?.parts?.[0]?.text || "";
        const clean = rawText.replace(/```json|```/g, "").trim();
        const result = JSON.parse(clean);

        // 추천 식당 정보 매칭
        recommendedRestaurants = result.recommendations
          .map(rec => {
            const restaurant = allRestaurants.find(r => r.id === rec.id);
            if (!restaurant) return null;
            aiReasons[rec.id] = rec.reason;
            return restaurant;
          })
          .filter(Boolean)
          .slice(0, CONFIG.RECOMMEND_COUNT);

        renderResult(result);

      } catch (err) {
        console.error("Gemini API 오류:", err);
        showError("AI 추천에 실패했습니다. 다시 시도해주세요.");
      }
    }

    // ── 결과 렌더링 ──
    function renderResult(aiResult) {
      const main = document.getElementById("mainContent");

      const catEmoji = { 한식:"🍚",중식:"🥢",일식:"🍣",양식:"🍝",분식:"🌮",패스트푸드:"🍔",아시아:"🍜",카페:"☕",기타:"🍽️" };

      main.innerHTML = `
        <!-- 취향 요약 -->
        <div class="taste-card">
          <div class="taste-label">당신의 취향</div>
          <div class="taste-keywords">${aiResult.taste_keywords || '-'}</div>
          <div class="taste-subtitle">${aiResult.taste_summary || ''}</div>
        </div>

        <!-- 추천 맛집 -->
        <div class="section-title-row">
          <div class="section-dot"></div>
          <div class="section-title">추천 맛집</div>
        </div>

        <div class="recommend-list">
          ${recommendedRestaurants.map(r => `
            <div class="recommend-card" onclick="openModal('${r.id}')">
              <div class="rc-inner">
                <div class="rc-thumb">
                  ${r.photo
                    ? `<img src="./images/${r.photo}" alt="${r.name}" onerror="this.outerHTML='<span style=font-size:32px>${catEmoji[r.category]||'🍽️'}</span>'" />`
                    : `<span style="font-size:32px">${catEmoji[r.category] || '🍽️'}</span>`
                  }
                </div>
                <div class="rc-info">
                  <div class="rc-name">${r.name}</div>
                  <div class="rc-meta">${r.category} · ${r.distance ? r.distance + 'km' : '-'}</div>
                  <div class="tag-list">
                    ${r.tags ? r.tags.split(",").slice(0,3).map(t => `<span class="tag">${t.trim()}</span>`).join("") : ""}
                  </div>
                  <div style="display:flex;align-items:center;gap:8px;margin-top:4px">
                    <div class="rating"><span class="rating-star">★</span>${r.rating||'-'}</div>
                    <span style="font-size:12px;color:var(--color-text-tertiary)">${['₩','₩₩','₩₩₩'][r.price_range-1]||''}</span>
                  </div>
                </div>
                <span class="rc-arrow">›</span>
              </div>
            </div>`).join('')}
        </div>

        <!-- 지도 -->
        <div class="section-title-row">
          <div class="section-dot"></div>
          <div class="section-title">위치</div>
        </div>
        <div class="map-section">
          <div id="kakaoMap"></div>
        </div>

        <!-- 다시 탐색 -->
        <div class="bottom-actions">
          <button class="btn-primary" onclick="restartSwipe()">다시 탐색하기</button>
        </div>`;

      // 지도 초기화 (카카오맵 SDK 로드 완료 후)
      if (window.kakao && window.kakao.maps) {
        kakao.maps.load(initMap);
      }
    }

    // ── 카카오맵 초기화 ──
    window.initMap = function () {
      const mapEl = document.getElementById("kakaoMap");
      if (!mapEl || recommendedRestaurants.length === 0) return;

      const center = new kakao.maps.LatLng(
        recommendedRestaurants[0].lat || CONFIG.HANSUNG_LAT,
        recommendedRestaurants[0].lng || CONFIG.HANSUNG_LNG
      );

      mapInstance = new kakao.maps.Map(mapEl, {
        center,
        level: 4,
      });

      // 한성대 마커
      new kakao.maps.Marker({
        map: mapInstance,
        position: new kakao.maps.LatLng(CONFIG.HANSUNG_LAT, CONFIG.HANSUNG_LNG),
        title: "한성대학교",
      });

      // 추천 식당 마커
      recommendedRestaurants.forEach((r, i) => {
        if (!r.lat || !r.lng) return;
        const marker = new kakao.maps.Marker({
          map: mapInstance,
          position: new kakao.maps.LatLng(r.lat, r.lng),
          title: r.name,
        });

        const infoWindow = new kakao.maps.InfoWindow({
          content: `<div style="padding:5px 8px;font-size:13px;font-weight:600">${i+1}. ${r.name}</div>`,
        });

        kakao.maps.event.addListener(marker, "click", () => {
          infoWindow.open(mapInstance, marker);
        });
      });

      // 모든 마커 보이도록 범위 조정
      const bounds = new kakao.maps.LatLngBounds();
      bounds.extend(new kakao.maps.LatLng(CONFIG.HANSUNG_LAT, CONFIG.HANSUNG_LNG));
      recommendedRestaurants.forEach(r => {
        if (r.lat && r.lng) bounds.extend(new kakao.maps.LatLng(r.lat, r.lng));
      });
      mapInstance.setBounds(bounds);
    };

    // ── 모달 ──
    window.openModal = async function (restaurantId) {
      const restaurant = allRestaurants.find(r => r.id === restaurantId);
      if (!restaurant) return;
      currentRestaurant = restaurant;

      // 히어로
      const heroEmoji = document.getElementById("modalHeroEmoji");
      const heroImg = document.getElementById("modalHeroImg");
      const catEmoji = { 한식:"🍚",중식:"🥢",일식:"🍣",양식:"🍝",분식:"🌮",패스트푸드:"🍔",아시아:"🍜",카페:"☕",기타:"🍽️" };
      if (restaurant.photo) {
        heroImg.src = `./images/${restaurant.photo}`;
        heroImg.style.display = "block";
        heroEmoji.style.display = "none";
        heroImg.onerror = () => { heroImg.style.display = "none"; heroEmoji.style.display = "block"; };
      } else {
        heroEmoji.textContent = catEmoji[restaurant.category] || "🍽️";
        heroImg.style.display = "none";
        heroEmoji.style.display = "block";
      }

      // 영업 상태
      const isOpen = checkIsOpen(restaurant);
      document.getElementById("modalName").textContent = restaurant.name;
      const badge = document.getElementById("modalStatusBadge");
      badge.textContent = isOpen ? "영업중" : "영업종료";
      badge.className = `badge ${isOpen ? "badge-open" : "badge-closed"}`;

      let metaText = `${restaurant.category} · ${restaurant.distance ? restaurant.distance + 'km' : '-'} · ${restaurant.hours || '-'}`;
      if (restaurant.break_time && restaurant.break_time !== "없음") metaText += ` (브레이크 ${restaurant.break_time})`;
      if (restaurant.closed_day && restaurant.closed_day !== "없음") metaText += ` · 휴무: ${restaurant.closed_day}`;
      document.getElementById("modalMeta").textContent = metaText;

      // 태그
      document.getElementById("modalTags").innerHTML = restaurant.tags
        ? restaurant.tags.split(",").map(t => `<span class="tag">${t.trim()}</span>`).join("") : "";

      // AI 추천 사유
      const reasonBox = document.getElementById("reasonBox");
      if (aiReasons[restaurantId]) {
        reasonBox.textContent = `💡 ${aiReasons[restaurantId]}`;
        reasonBox.style.display = "block";
      } else {
        reasonBox.style.display = "none";
      }

      // 메뉴
      const menus = await getMenusByRestaurant(restaurantId);
      const menuList = document.getElementById("modalMenuList");
      if (menus.length > 0) {
        menuList.innerHTML = menus.map(m => `
          <div class="menu-item">
            <div class="menu-item-left">
              ${m.photo
                ? `<img class="menu-photo" src="./images/${m.photo}" alt="${m.name}" onerror="this.outerHTML='<div class=menu-photo-placeholder>🍽️</div>'" />`
                : `<div class="menu-photo-placeholder">🍽️</div>`
              }
              <span class="menu-name">${m.name}</span>
            </div>
            <span class="menu-price">${m.price ? m.price.toLocaleString() + '원' : '-'}</span>
          </div>`).join('');
      } else {
        menuList.innerHTML = '<p style="color:var(--color-text-tertiary);font-size:13px">메뉴 정보가 없습니다</p>';
      }

      // 저장 버튼
      const liked = userLikes.includes(restaurantId);
      document.getElementById("modalSaveBtn").textContent = liked ? "❤️ 저장됨" : "🤍 저장";

      document.getElementById("modalOverlay").classList.add("open");
      document.body.style.overflow = "hidden";
    };

    window.closeModal = function () {
      document.getElementById("modalOverlay").classList.remove("open");
      document.body.style.overflow = "";
    };

    window.handleOverlayClick = function (e) {
      if (e.target === document.getElementById("modalOverlay")) closeModal();
    };

    window.handleSave = async function () {
      if (!currentUser) { showToast("로그인이 필요합니다"); return; }
      if (!currentRestaurant) return;
      const liked = userLikes.includes(currentRestaurant.id);
      if (liked) {
        userLikes = userLikes.filter(id => id !== currentRestaurant.id);
        await removeLike(currentUser.uid, currentRestaurant.id);
        document.getElementById("modalSaveBtn").textContent = "🤍 저장";
        showToast("좋아요 취소");
      } else {
        userLikes.push(currentRestaurant.id);
        await addLike(currentUser.uid, currentRestaurant.id);
        document.getElementById("modalSaveBtn").textContent = "❤️ 저장됨";
        showToast("저장되었습니다!");
      }
    };

    window.openNav = function () {
      if (!currentRestaurant) return;
      const url = `https://map.kakao.com/link/from/한성대학교,${CONFIG.HANSUNG_LAT},${CONFIG.HANSUNG_LNG}/to/${currentRestaurant.name},${currentRestaurant.lat},${currentRestaurant.lng}`;
      window.open(url, "_blank");
    };

    window.restartSwipe = function () {
      sessionStorage.removeItem("swipeResult");
      sessionStorage.removeItem("swipeProgress");
      window.location.href = "./swipe.html";
    };

    // ── 유틸 ──
    function checkIsOpen(restaurant) {
      if (!restaurant.hours) return true;
      try {
        const now = new Date();
        const [startStr, endStr] = restaurant.hours.split("-");
        const [sh, sm] = startStr.trim().split(":").map(Number);
        const [eh, em] = endStr.trim().split(":").map(Number);
        const nowMin = now.getHours() * 60 + now.getMinutes();
        const startMin = sh * 60 + sm;
        const endMin = eh * 60 + em;
        if (endMin > startMin) return nowMin >= startMin && nowMin < endMin;
        return nowMin >= startMin || nowMin < endMin;
      } catch { return true; }
    }

    function showError(msg) {
      document.getElementById("mainContent").innerHTML = `
        <div class="error-state">
          <div style="font-size:48px">😢</div>
          <div style="font-size:16px;font-weight:600">${msg}</div>
          <button class="btn-primary" onclick="location.href='./swipe.html'" style="max-width:200px">다시 스와이프하기</button>
        </div>`;
    }

    function showToast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.classList.add("show");
      setTimeout(() => t.classList.remove("show"), 2000);
    }
  </script>
</body>
</html>
