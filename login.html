<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FOOD FIRST — 로그인</title>
  <link rel="stylesheet" href="./common.css" />
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: var(--color-bg);
    }

    .login-wrap {
      width: 100%;
      max-width: 360px;
      padding: var(--spacing-xl) var(--spacing-lg);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--spacing-lg);
    }

    .login-logo {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .login-logo-icon {
      width: 72px;
      height: 72px;
      background: var(--color-primary);
      border-radius: var(--radius-xl);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
    }

    .login-logo-name {
      font-size: 24px;
      font-weight: 800;
      color: var(--color-primary);
      letter-spacing: -0.5px;
    }

    .login-subtitle {
      font-size: 15px;
      color: var(--color-text-secondary);
      text-align: center;
      line-height: 1.5;
    }

    .login-card {
      width: 100%;
      background: var(--color-bg-card);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-card);
      padding: var(--spacing-xl);
      display: flex;
      flex-direction: column;
      gap: var(--spacing-md);
    }

    .btn-google {
      width: 100%;
      padding: 14px;
      background: var(--color-bg-card);
      border: 1.5px solid var(--color-border);
      border-radius: var(--radius-full);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 15px;
      font-weight: 600;
      color: var(--color-text-primary);
      transition: background 0.15s, border-color 0.15s;
      cursor: pointer;
      font-family: var(--font-main);
    }

    .btn-google:hover {
      background: var(--color-bg);
      border-color: var(--color-primary);
    }

    .btn-google:active {
      transform: scale(0.98);
    }

    .btn-google img {
      width: 20px;
      height: 20px;
    }

    .login-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--color-text-tertiary);
      font-size: 13px;
    }

    .login-divider::before,
    .login-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--color-border);
    }

    .login-note {
      font-size: 12px;
      color: var(--color-text-tertiary);
      text-align: center;
      line-height: 1.6;
    }

    .login-error {
      font-size: 13px;
      color: var(--color-danger);
      text-align: center;
      padding: 10px;
      background: #FFEBEE;
      border-radius: var(--radius-md);
      display: none;
    }

    .login-error.show {
      display: block;
    }

    /* 로딩 상태 */
    .btn-google.loading {
      opacity: 0.7;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="login-wrap">

    <div class="login-logo">
      <div class="login-logo-icon">🍴</div>
      <div class="login-logo-name">FOOD FIRST</div>
    </div>

    <p class="login-subtitle">당신의 완벽한 맛집을<br/>찾아드려요</p>

    <div class="login-card">

      <div id="loginError" class="login-error"></div>

      <button id="btnGoogle" class="btn-google" onclick="handleGoogleLogin()">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" />
        구글로 로그인
      </button>

      <div class="login-divider">또는</div>

      <button class="btn-primary" onclick="handleGuestMode()">
        둘러보기
      </button>

      <p class="login-note">
        로그인하면 좋아요, 스와이프 기록이 저장됩니다.<br/>
        둘러보기는 피드만 이용 가능합니다.
      </p>

    </div>

  </div>

  <!-- Firebase SDK -->
  <script src="./config.js"></script>
  <script type="module">
    import { loginWithGoogle, onAuthChanged } from "./auth.js";

    // 이미 로그인된 경우 피드로 이동
    onAuthChanged((user) => {
      if (user) window.location.href = "./index.html";
    });

    // 구글 로그인
    window.handleGoogleLogin = async function () {
      const btn = document.getElementById("btnGoogle");
      const errorEl = document.getElementById("loginError");

      btn.classList.add("loading");
      btn.textContent = "로그인 중...";
      errorEl.classList.remove("show");

      try {
        await loginWithGoogle();
        window.location.href = "./index.html";
      } catch (err) {
        console.error(err);
        errorEl.textContent = "로그인에 실패했습니다. 다시 시도해주세요.";
        errorEl.classList.add("show");
        btn.classList.remove("loading");
        btn.innerHTML = `<img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" /> 구글로 로그인`;
      }
    };

    // 둘러보기 (비로그인 피드)
    window.handleGuestMode = function () {
      sessionStorage.setItem("guestMode", "true");
      window.location.href = "./index.html";
    };
  </script>
</body>
</html>
