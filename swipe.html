<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FOOD FIRST — 스와이프</title>
  <link rel="stylesheet" href="./common.css" />
  <style>
    .swipe-page {
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* ── 진행 바 ── */
    .progress-wrap {
      padding: 16px var(--spacing-md) 8px;
      background: var(--color-bg-card);
    }

    .progress-info {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .progress-label {
      font-size: 13px;
      color: var(--color-text-secondary);
    }

    .progress-count {
      font-size: 15px;
      font-weight: 700;
    }

    .progress-bar-track {
      height: 4px;
      background: var(--color-bg-input);
      border-radius: var(--radius-full);
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: var(--color-primary);
      border-radius: var(--radius-full);
      transition: width 0.3s ease;
    }

    .hint-text {
      text-align: center;
      font-size: 13px;
      color: var(--color-text-tertiary);
      padding: 8px;
    }

    /* ── 카드 덱 영역 ── */
    .card-deck {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 var(--spacing-md);
      overflow: hidden;
    }

    /* ── 스와이프 카드 ── */
    .swipe-card {
      position: absolute;
      width: calc(100% - 32px);
      max-width: 380px;
      background: var(--color-bg-card);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-modal);
      overflow: hidden;
      cursor: grab;
      user-select: none;
      touch-action: none;
      will-change: transform;
      transition: box-shadow 0.2s;
    }

    .swipe-card:active {
      cursor: grabbing;
    }

    .swipe-card.is-dragging {
      transition: none;
    }

    .swipe-card.animate-out {
      transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94), opacity 0.4s;
    }

    /* 카드 이미지 */
    .swipe-card-img {
      width: 100%;
      aspect-ratio: 4/3;
      object-fit: cover;
      background: var(--color-bg-input);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 80px;
      pointer-events: none;
    }

    .swipe-card-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* 좋아요/싫어요 오버레이 */
    .swipe-overlay-like,
    .swipe-overlay-nope {
      position: absolute;
      top: 24px;
      padding: 6px 16px;
      border-radius: var(--radius-md);
      font-size: 22px;
      font-weight: 800;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.1s;
      border: 3px solid;
    }

    .swipe-overlay-like {
      left: 20px;
      color: var(--color-success);
      border-color: var(--color-success);
      transform: rotate(-10deg);
    }

    .swipe-overlay-nope {
      right: 20px;
      color: var(--color-danger);
      border-color: var(--color-danger);
      transform: rotate(10deg);
    }

    /* 카드 정보 */
    .swipe-card-info {
      padding: 14px;
    }

    .swipe-card-name {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .swipe-card-meta {
      font-size: 13px;
      color: var(--color-text-secondary);
      margin-bottom: 10px;
    }

    .swipe-card-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* ── 버튼 영역 ── */
    .swipe-buttons {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      padding: 16px var(--spacing-md) calc(var(--nav-height) + 16px);
      background: var(--color-bg);
    }

    .btn-nope {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: var(--color-bg-card);
      box-shadow: var(--shadow-card);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      border: none;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .btn-like {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: var(--color-primary);
      box-shadow: var(--shadow-btn);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      border: none;
      cursor: pointer;
      transition: transform 0.15s;
    }

    .btn-nope:active { transform: scale(0.9); }
    .btn-like:active { transform: scale(0.9); }

    /* ── 단계 전환 배너 ── */
    .phase-banner {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: var(--color-primary);
      color: white;
      padding: 16px 28px;
      border-radius: var(--radius-xl);
      font-size: 16px;
      font-weight: 600;
      text-align: center;
      box-shadow: var(--shadow-modal);
      z-index: 300;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }

    .phase-banner.show {
      opacity: 1;
    }

    /* ── 완료 화면 ── */
    .complete-screen {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      padding: var(--spacing-xl);
      text-align: center;
      gap: var(--spacing-md);
    }

    .complete-screen.show {
      display: flex;
    }

    .complete-icon {
      font-size: 72px;
    }

    .complete-title {
      font-size: 22px;
      font-weight: 700;
    }

    .complete-subtitle {
      font-size: 15px;
      color: var(--color-text-secondary);
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="app-container swipe-page">

    <!-- 헤더 -->
    <header class="header">
      <div class="header-back">
        <a href="./index.html">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
        </a>
      </div>
      <span class="header-logo">스와이프</span>
      <div style="width:40px"></div>
    </header>

    <!-- 진행 바 -->
    <div class="progress-wrap">
      <div class="progress-info">
        <span class="progress-label" id="progressLabel">취향 탐색 중</span>
        <span class="progress-count"><span id="currentCount">0</span> / <span id="totalCount">15</span></span>
      </div>
      <div class="progress-bar-track">
        <div class="progress-bar-fill" id="progressFill" style="width: 0%"></div>
      </div>
    </div>

    <p class="hint-text">좋으면 오른쪽 → 싫으면 왼쪽 ←</p>

    <!-- 카드 덱 -->
    <div class="card-deck" id="cardDeck">
      <div class="spinner-wrap">
        <div class="spinner"></div>
        <span>카드 준비 중...</span>
      </div>
    </div>

    <!-- 버튼 -->
    <div class="swipe-buttons" id="swipeButtons">
      <button class="btn-nope" onclick="swipeLeft()">✕</button>
      <button class="btn-like" onclick="swipeRight()">❤️</button>
    </div>

    <!-- 완료 화면 -->
    <div class="complete-screen" id="completeScreen">
      <div class="complete-icon">🎯</div>
      <div class="complete-title">취향 분석 완료!</div>
      <div class="complete-subtitle">AI가 최적의 맛집을 찾고 있어요</div>
      <div class="spinner"></div>
    </div>

    <!-- 하단 내비게이션 -->
    <nav class="bottom-nav">
      <a href="./index.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        홈
      </a>
      <a href="./swipe.html" class="nav-item active">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17 12h-5v5h5v-5zM16 1v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2h-1V1h-2zm3 18H5V8h14v11z"/></svg>
        스와이프
      </a>
      <a href="./mypage.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
        마이
      </a>
    </nav>

  </div>

  <!-- 단계 전환 배너 -->
  <div class="phase-banner" id="phaseBanner"></div>

  <script src="./config.js"></script>
  <script type="module">
    import { getRestaurants, incrementSwipeCount } from "./firebase.js";
    import { onAuthChanged } from "./auth.js";

    // ── 상수 ──
    const TOTAL = CONFIG.SWIPE.TOTAL;           // 15
    const FIRST = CONFIG.SWIPE.FIRST_PHASE;     // 8
    const SECOND = CONFIG.SWIPE.SECOND_PHASE;   // 7
    const CATEGORIES = ["한식","중식","일식","양식","분식","패스트푸드","아시아"];

    // ── 상태 ──
    let allRestaurants = [];
    let cardQueue = [];       // 15장 카드 목록
    let currentIndex = 0;
    let likes = [];           // 좋아요한 식당 id
    let dislikes = [];        // 싫어요한 식당 id
    let currentUser = null;
    let isDragging = false;
    let startX = 0, startY = 0, currentX = 0;
    let activeCard = null;
    let _mouseMoveHandler = null;
    let _mouseUpHandler = null;

    // ── 이어하기: sessionStorage 복원 ──
    function saveProgress() {
      sessionStorage.setItem("swipeProgress", JSON.stringify({
        cardQueue: cardQueue.map(r => r.id),
        currentIndex,
        likes,
        dislikes,
      }));
    }

    function loadProgress(allRestaurants) {
      const saved = sessionStorage.getItem("swipeProgress");
      if (!saved) return false;
      try {
        const data = JSON.parse(saved);
        const idMap = Object.fromEntries(allRestaurants.map(r => [r.id, r]));
        const queue = data.cardQueue.map(id => idMap[id]).filter(Boolean);
        if (queue.length !== TOTAL) return false;
        cardQueue = queue;
        currentIndex = data.currentIndex;
        likes = data.likes;
        dislikes = data.dislikes;
        return true;
      } catch { return false; }
    }

    // ── 초기화 ──
    onAuthChanged((user) => { currentUser = user; });

    async function init() {
      allRestaurants = await getRestaurants();

      // 이어하기 시도
      if (!loadProgress(allRestaurants)) {
        buildCardQueue();
      }

      renderCards();
      updateProgress();
    }

    init();

    // ── 카드 큐 구성 ──
    function buildCardQueue() {
      cardQueue = [];
      const usedIds = new Set();

      // ── 1단계: 카테고리 균등 배분 8장 ──
      // 7개 카테고리에서 1장씩 + 랜덤 1장
      const shuffledCats = [...CATEGORIES].sort(() => Math.random() - 0.5);
      for (const cat of shuffledCats.slice(0, 7)) {
        const pool = allRestaurants.filter(r => r.category === cat && !usedIds.has(r.id));
        if (pool.length === 0) continue;
        const picked = pool[Math.floor(Math.random() * pool.length)];
        cardQueue.push(picked);
        usedIds.add(picked.id);
      }
      // 나머지 1장 랜덤
      const remaining = allRestaurants.filter(r => !usedIds.has(r.id));
      if (remaining.length > 0) {
        const extra = remaining[Math.floor(Math.random() * remaining.length)];
        cardQueue.push(extra);
        usedIds.add(extra.id);
      }
      // 1단계 순서 셔플
      cardQueue = cardQueue.sort(() => Math.random() - 0.5);

      // ── 2단계는 1단계 완료 후 buildSecondPhase()에서 추가 ──
    }

    // 2단계 카드 구성 (1단계 완료 후 호출)
    function buildSecondPhase() {
      const usedIds = new Set(cardQueue.map(r => r.id));

      // 좋아요/싫어요 카테고리 집계
      const catLikes = {};
      const catDislikes = new Set();

      for (const id of likes) {
        const r = allRestaurants.find(r => r.id === id);
        if (r) catLikes[r.category] = (catLikes[r.category] || 0) + 1;
      }
      for (const id of dislikes) {
        const r = allRestaurants.find(r => r.id === id);
        if (r) catDislikes.add(r.category);
      }

      // 좋아요 없으면 싫어요 없는 카테고리 위주
      const likedCats = Object.keys(catLikes);
      let targetCats = [];

      if (likedCats.length === 0) {
        // 전부 싫어요인 극단 케이스 → 싫어요 없는 카테고리
        targetCats = CATEGORIES.filter(c => !catDislikes.has(c));
        if (targetCats.length === 0) targetCats = CATEGORIES; // 최후 fallback
      } else {
        // 좋아요 카테고리 비율로 2단계 구성
        // 싫어요만 있는 카테고리 제외
        targetCats = likedCats.filter(c => !catDislikes.has(c) || catLikes[c] > 0);
        if (targetCats.length === 0) targetCats = likedCats;
      }

      // 비율에 따라 7장 배분
      const totalLikes = targetCats.reduce((s, c) => s + (catLikes[c] || 1), 0);
      const allocations = {};
      let allocated = 0;
      targetCats.forEach(cat => {
        const n = Math.round(((catLikes[cat] || 1) / totalLikes) * SECOND);
        allocations[cat] = n;
        allocated += n;
      });

      // 오차 보정
      const diff = SECOND - allocated;
      if (diff !== 0 && targetCats.length > 0) {
        allocations[targetCats[0]] = (allocations[targetCats[0]] || 0) + diff;
      }

      // 카드 뽑기
      const secondPhase = [];
      for (const [cat, count] of Object.entries(allocations)) {
        const pool = allRestaurants.filter(r => r.category === cat && !usedIds.has(r.id));
        pool.sort(() => Math.random() - 0.5);
        for (let i = 0; i < count && i < pool.length; i++) {
          secondPhase.push(pool[i]);
          usedIds.add(pool[i].id);
        }
      }

      // 부족하면 랜덤으로 채움
      while (secondPhase.length < SECOND) {
        const pool = allRestaurants.filter(r => !usedIds.has(r.id));
        if (pool.length === 0) break;
        const picked = pool[Math.floor(Math.random() * pool.length)];
        secondPhase.push(picked);
        usedIds.add(picked.id);
      }

      cardQueue.push(...secondPhase.slice(0, SECOND));
      saveProgress();
      renderCards();
    }

    // ── 카드 렌더링 ──
    function renderCards() {
      const deck = document.getElementById("cardDeck");
      deck.innerHTML = "";

      // 현재 카드 + 다음 카드 2장만 렌더
      const toRender = cardQueue.slice(currentIndex, currentIndex + 2);
      if (toRender.length === 0) return;

      toRender.reverse().forEach((restaurant, i) => {
        const card = createCardEl(restaurant);
        if (i === 0) {
          // 뒤 카드 (살짝 작고 뒤에)
          card.style.transform = "scale(0.95) translateY(12px)";
          card.style.zIndex = "1";
          card.style.pointerEvents = "none";
        } else {
          // 앞 카드 (드래그 가능)
          card.style.zIndex = "2";
          card.id = "activeCard";
          initDrag(card);
        }
        deck.appendChild(card);
      });
    }

    function createCardEl(restaurant) {
      const card = document.createElement("div");
      card.className = "swipe-card";
      card.dataset.id = restaurant.id;
      card.dataset.category = restaurant.category;

      const catEmoji = { 한식:"🍚",중식:"🥢",일식:"🍣",양식:"🍝",분식:"🌮",패스트푸드:"🍔",아시아:"🍜",카페:"☕",기타:"🍽️" };

      card.innerHTML = `
        <div class="swipe-overlay-like" id="overlayLike">LIKE 👍</div>
        <div class="swipe-overlay-nope" id="overlayNope">NOPE 👎</div>
        <div class="swipe-card-img" id="cardImg-${restaurant.id}">
          ${restaurant.photo
            ? `<img src="./images/${restaurant.photo}" alt="${restaurant.name}" style="width:100%;height:100%;object-fit:cover" onerror="this.parentElement.innerHTML='<span style=font-size:80px>${catEmoji[restaurant.category]||'🍽️'}</span>'" />`
            : `<span style="font-size:80px">${catEmoji[restaurant.category] || '🍽️'}</span>`
          }
        </div>
        <div class="swipe-card-info">
          <div class="swipe-card-name">${restaurant.name}</div>
          <div class="swipe-card-meta">${restaurant.category} · ${restaurant.distance ? restaurant.distance + 'km' : '-'}</div>
          <div class="tag-list">
            ${restaurant.tags ? restaurant.tags.split(",").slice(0,3).map(t => `<span class="tag">${t.trim()}</span>`).join("") : ""}
          </div>
          <div class="swipe-card-bottom">
            <div class="rating"><span class="rating-star">★</span>${restaurant.rating || '-'}</div>
            <span style="font-size:13px;color:var(--color-text-tertiary)">${['₩','₩₩','₩₩₩'][restaurant.price_range-1]||''}</span>
          </div>
        </div>`;

      return card;
    }

    // ── 드래그 이벤트 ──
    function initDrag(card) {
      // 이전 마우스 핸들러 제거 (중복 등록 방지)
      if (_mouseMoveHandler) document.removeEventListener("mousemove", _mouseMoveHandler);
      if (_mouseUpHandler) document.removeEventListener("mouseup", _mouseUpHandler);
      _mouseMoveHandler = onDragMove;
      _mouseUpHandler = onDragEnd;
      // 터치
      card.addEventListener("touchstart", onDragStart, { passive: true });
      card.addEventListener("touchmove", onDragMove, { passive: true });
      card.addEventListener("touchend", onDragEnd);
      // 마우스
      card.addEventListener("mousedown", onDragStart);
      document.addEventListener("mousemove", _mouseMoveHandler);
      document.addEventListener("mouseup", _mouseUpHandler);
    }

    function onDragStart(e) {
      if (currentIndex >= cardQueue.length) return;
      isDragging = true;
      activeCard = document.getElementById("activeCard");
      if (!activeCard) return;
      const pt = e.touches ? e.touches[0] : e;
      startX = pt.clientX;
      startY = pt.clientY;
      activeCard.classList.add("is-dragging");
    }

    function onDragMove(e) {
      if (!isDragging || !activeCard) return;
      const pt = e.touches ? e.touches[0] : e;
      currentX = pt.clientX - startX;
      const currentY = pt.clientY - startY;
      const rotate = currentX * 0.08;
      activeCard.style.transform = `translate(${currentX}px, ${currentY}px) rotate(${rotate}deg)`;

      // 오버레이
      const threshold = 60;
      const likeOverlay = activeCard.querySelector(".swipe-overlay-like");
      const nopeOverlay = activeCard.querySelector(".swipe-overlay-nope");
      if (currentX > threshold) {
        likeOverlay.style.opacity = Math.min(1, (currentX - threshold) / 80);
        nopeOverlay.style.opacity = 0;
      } else if (currentX < -threshold) {
        nopeOverlay.style.opacity = Math.min(1, (-currentX - threshold) / 80);
        likeOverlay.style.opacity = 0;
      } else {
        likeOverlay.style.opacity = 0;
        nopeOverlay.style.opacity = 0;
      }
    }

    function onDragEnd() {
      if (!isDragging || !activeCard) return;
      isDragging = false;
      activeCard.classList.remove("is-dragging");

      const SWIPE_THRESHOLD = 100;
      if (currentX > SWIPE_THRESHOLD) {
        animateOut("right");
      } else if (currentX < -SWIPE_THRESHOLD) {
        animateOut("left");
      } else {
        // 원위치
        activeCard.style.transition = "transform 0.3s";
        activeCard.style.transform = "";
        setTimeout(() => { if (activeCard) activeCard.style.transition = ""; }, 300);
      }

      currentX = 0;
      document.removeEventListener("mousemove", _mouseMoveHandler);
      document.removeEventListener("mouseup", _mouseUpHandler);
      _mouseMoveHandler = null;
      _mouseUpHandler = null;
    }

    // ── 스와이프 처리 ──
    function animateOut(direction) {
      if (!activeCard) return;
      const tx = direction === "right" ? window.innerWidth + 200 : -window.innerWidth - 200;
      activeCard.classList.add("animate-out");
      activeCard.style.transform = `translate(${tx}px, 0) rotate(${direction === "right" ? 20 : -20}deg)`;
      activeCard.style.opacity = "0";

      const restaurantId = activeCard.dataset.id;

      setTimeout(() => {
        if (direction === "right") {
          likes.push(restaurantId);
        } else {
          dislikes.push(restaurantId);
        }
        currentIndex++;
        updateProgress();
        saveProgress();
        handleNextStep();
      }, 350);
    }

    function handleNextStep() {
      // 1단계 완료 → 2단계 카드 생성
      if (currentIndex === FIRST && cardQueue.length === FIRST) {
        showPhaseBanner("🎯 취향을 반영한 카드를 준비했어요!");
        buildSecondPhase();
        return;
      }

      // 전체 완료
      if (currentIndex >= TOTAL) {
        handleComplete();
        return;
      }

      renderCards();
    }

    async function handleComplete() {
      // 스와이프 횟수 저장
      if (currentUser) {
        await incrementSwipeCount(currentUser.uid);
      }

      // 결과 저장
      const swipeResult = {
        likes,
        dislikes,
        allRestaurants: allRestaurants.map(r => ({
          id: r.id,
          name: r.name,
          category: r.category,
          tags: r.tags,
          distance: r.distance,
          rating: r.rating,
          price_range: r.price_range,
        })),
      };
      sessionStorage.setItem("swipeResult", JSON.stringify(swipeResult));
      sessionStorage.removeItem("swipeProgress"); // 완료 후 이어하기 초기화

      // 완료 화면 표시 후 result.html로 이동
      document.getElementById("cardDeck").style.display = "none";
      document.getElementById("swipeButtons").style.display = "none";
      document.getElementById("completeScreen").classList.add("show");

      setTimeout(() => {
        window.location.href = "./result.html";
      }, 1500);
    }

    // ── 버튼 클릭 ──
    window.swipeRight = function () {
      activeCard = document.getElementById("activeCard");
      if (!activeCard) return;
      currentX = 150;
      animateOut("right");
    };

    window.swipeLeft = function () {
      activeCard = document.getElementById("activeCard");
      if (!activeCard) return;
      currentX = -150;
      animateOut("left");
    };

    // ── 진행 바 업데이트 ──
    function updateProgress() {
      document.getElementById("currentCount").textContent = currentIndex;
      document.getElementById("totalCount").textContent = TOTAL;
      document.getElementById("progressFill").style.width = `${(currentIndex / TOTAL) * 100}%`;
      document.getElementById("progressLabel").textContent =
        currentIndex < FIRST ? "취향 탐색 중" : "맞춤 카드";
    }

    // ── 단계 전환 배너 ──
    function showPhaseBanner(msg) {
      const banner = document.getElementById("phaseBanner");
      banner.textContent = msg;
      banner.classList.add("show");
      setTimeout(() => banner.classList.remove("show"), 2000);
    }
  </script>
</body>
</html>
