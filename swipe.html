<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FOOD FIRST — 스와이프</title>
  <script src="./config.js"></script>
  <script src="./theme.js"></script>
  <link rel="stylesheet" href="./common.css" />
  <link rel="stylesheet" href="./theme.css" />

  <style>
    .swipe-page {
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* ── 상단 네비 ── */
    .top-nav { flex-shrink: 0; background: var(--header-bg); border-bottom: 1px solid var(--color-border-light); }
    .top-nav-inner { display: flex; align-items: center; gap: 32px; height: 72px; max-width: var(--max-width); margin: 0 auto; padding: 0 32px; width: 100%; }
    .brand { display: inline-flex; align-items: center; gap: 10px; font-weight: 800; letter-spacing: -.5px; font-size: 19px; color: var(--color-primary); }
    .brand-mark { width: 32px; height: 32px; border-radius: 10px; background: var(--color-primary); color: #fff; display: inline-flex; align-items: center; justify-content: center; font-size: 17px; box-shadow: 0 4px 12px rgba(244,113,86,.35); }
    .nav-links { display: flex; gap: 4px; }
    .nav-link { padding: 8px 14px; border-radius: 999px; font-size: 14px; font-weight: 600; color: var(--color-text-secondary); transition: background .15s, color .15s; white-space: nowrap; }
    .nav-link:hover { background: var(--color-bg-input); color: var(--color-text-primary); }
    .nav-link.is-active { color: var(--color-text-primary); background: var(--color-bg-input); }
    .nav-right { display: flex; align-items: center; gap: 8px; margin-left: auto; }
    .avatar { width: 36px; height: 36px; border-radius: 999px; background: var(--color-primary-light); color: var(--color-primary); display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; }

    /* ── 진행 바 ── */
    .progress-wrap {
      flex-shrink: 0;
      padding: 16px var(--spacing-md) 8px;
      background: var(--color-bg-card);
    }
    .progress-info {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .progress-label {
      font-size: 13px;
      color: var(--color-text-secondary);
    }
    .progress-count {
      font-size: 15px;
      font-weight: 700;
    }
    .progress-bar-track {
      height: 8px;
      background: var(--color-bg-input);
      border-radius: var(--radius-full);
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      background: var(--color-primary);
      border-radius: var(--radius-full);
      transition: width 0.3s ease;
    }
    .hint-text {
      text-align: center;
      font-size: 13px;
      color: var(--color-text-tertiary);
      padding: 8px;
      transition: opacity 0.3s;
    }
    .hint-text.hidden {
      opacity: 0;
      pointer-events: none;
    }

    /* ── 카드 덱 영역 ── */
    .card-deck {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 100px;
      overflow: hidden;
      min-height: 0;
    }

    /* ── 스와이프 카드 ── */
    .swipe-card {
      position: absolute;
      width: calc(100% - 200px);
      max-width: 420px;
      background: var(--color-bg-card);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-modal);
      overflow: hidden;
      cursor: grab;
      user-select: none;
      touch-action: none;
      will-change: transform;
      transition: box-shadow 0.2s;
    }

    .swipe-card:active { cursor: grabbing; }
    .swipe-card.is-dragging { transition: none; }
    .swipe-card.animate-out {
      transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94), opacity 0.4s;
    }

    .swipe-card-img {
      width: 100%;
      aspect-ratio: 4/3;
      object-fit: cover;
      background: var(--color-bg-input);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 5rem;
      pointer-events: none;
    }

    .swipe-card-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* 좋아요/싫어요 오버레이 */
    .swipe-overlay-like,
    .swipe-overlay-nope {
      position: absolute;
      top: 50%;
      padding: 6px 16px;
      border-radius: var(--radius-md);
      font-size: 1.375rem;
      font-weight: 800;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.1s;
      border: 3px solid;
    }

    .swipe-overlay-like {
      left: 20px;
      color: var(--color-success);
      border-color: var(--color-success);
      transform: translateY(-50%) rotate(-10deg);
    }

    .swipe-overlay-nope {
      right: 20px;
      color: var(--color-danger);
      border-color: var(--color-danger);
      transform: translateY(-50%) rotate(10deg);
    }

    /* 스와이프 카드 */
    .swipe-card-info { padding: 14px; }
    .swipe-card-name { font-size: 1.25rem; font-weight: 700; word-break: keep-all; overflow-wrap: break-word; white-space: normal; margin-bottom: 4px; }
    .swipe-card-block-row { display: flex; justify-content: flex-end; margin-top: 8px; }

    /* ── 차단 버튼 ── */
    .btn-block-menu {
      padding: 5px 10px;
      background: rgba(0,0,0,0.06);
      border: none;
      border-radius: var(--radius-full);
      font-size: 0.6875rem;
      color: var(--color-text-tertiary);
      cursor: pointer;
      font-family: var(--font-main);
      transition: background 0.15s, color 0.15s;
      flex-shrink: 0;
      white-space: nowrap;
    }

    .btn-block-menu:hover {
      background: #FFEBEE;
      color: var(--color-danger);
    }

    /* ── 버튼 영역: card-deck과 같은 높이에 fixed 배치 → renderCards()에 영향 안 받음 ── */
    .swipe-buttons {
      position: fixed;
      bottom: 40px;
      left: 0;
      right: 0;
      display: flex;
      align-items: center;
      z-index: 50;
      pointer-events: none;
    }

    .swipe-btn-gutter {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .swipe-btn-spacer {
      flex: 0 0 calc(100% - 200px);
      max-width: 420px;
    }

    .btn-nope, .btn-like {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.125rem;
      border: none;
      cursor: pointer;
      transition: transform 0.15s;
      pointer-events: all;
    }

    .btn-nope {
      background: var(--color-bg-card);
      box-shadow: var(--shadow-card);
    }

    .btn-like {
      background: var(--color-primary);
      box-shadow: var(--shadow-btn);
    }

    .btn-nope:active { transform: scale(0.9); }
    .btn-like:active { transform: scale(0.9); }

    /* ── 단계 전환 배너 ── */
    .phase-banner {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: var(--color-primary);
      color: white;
      padding: 16px 28px;
      border-radius: var(--radius-xl);
      font-size: 1rem;
      font-weight: 600;
      text-align: center;
      box-shadow: var(--shadow-modal);
      z-index: 300;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }

    .phase-banner.show { opacity: 1; }

    /* ── 시작 모달 ── */
    .start-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: 400;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .start-modal-sheet {
      width: 100%;
      max-width: 360px;
      background: var(--color-bg-card);
      border-radius: var(--radius-xl);
      padding: var(--spacing-xl) var(--spacing-lg);
      display: flex;
      flex-direction: column;
      gap: var(--spacing-md);
      box-shadow: var(--shadow-modal);
      animation: popIn 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes popIn {
      from { transform: scale(0.88); opacity: 0; }
      to   { transform: scale(1);    opacity: 1; }
    }

    .start-modal-title {
      font-size: 1.25rem;
      font-weight: 800;
      text-align: center;
    }

    .start-modal-desc {
      font-size: 0.875rem;
      color: var(--color-text-secondary);
      text-align: center;
      line-height: 1.6;
    }

    .start-option-card {
      width: 100%;
      padding: 16px var(--spacing-md);
      border-radius: var(--radius-lg);
      border: 2px solid var(--color-border);
      background: var(--color-bg);
      display: flex;
      align-items: center;
      gap: 14px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      font-family: var(--font-main);
      text-align: left;
    }

    .start-option-card:hover, .start-option-card:active {
      border-color: var(--color-primary);
      background: var(--color-primary-light);
    }

    .start-option-icon { font-size: 1.75rem; flex-shrink: 0; }

    .start-option-text .option-title {
      font-size: 0.9375rem;
      font-weight: 700;
      color: var(--color-text-primary);
      margin-bottom: 3px;
    }

    .start-option-text .option-sub {
      font-size: 0.75rem;
      color: var(--color-text-secondary);
      line-height: 1.4;
    }

    .start-option-card.primary-card {
      border-color: var(--color-primary);
      background: var(--color-primary-light);
    }

    .taste-stats { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }

    .taste-tag-chip {
      font-size: 0.6875rem;
      background: var(--color-primary);
      color: #fff;
      padding: 2px 8px;
      border-radius: var(--radius-full);
      font-weight: 600;
    }

    /* ── 완료 화면 ── */
    .complete-screen {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      padding: var(--spacing-xl);
      text-align: center;
      gap: var(--spacing-md);
    }

    .complete-screen.show { display: flex; }
    .complete-icon  { font-size: 4.5rem; }
    .complete-title { font-size: 1.375rem; font-weight: 700; }
    .complete-subtitle { font-size: 0.9375rem; color: var(--color-text-secondary); line-height: 1.6; }

    /* ── 테마 토글 FAB ── */
    .theme-fab { position: fixed; bottom: 24px; right: 24px; z-index: 300; width: 48px; height: 48px; border-radius: 999px; background: var(--color-bg-card); border: 1px solid var(--color-border); color: var(--color-text-primary); display: inline-flex; align-items: center; justify-content: center; box-shadow: var(--shadow-card-hover); transition: transform .15s; }
    .theme-fab:hover { transform: scale(1.06); }
    .theme-fab svg { width: 20px; height: 20px; }
    .theme-fab .moon { display: none; }
    html[data-theme="dark"] .theme-fab .sun { display: none; }
    html[data-theme="dark"] .theme-fab .moon { display: block; }

    @media (min-width: 768px) {
      .card-deck { padding: 0 120px; }
      .swipe-card { width: calc(100% - 240px); max-width: 440px; }
      .swipe-btn-spacer { flex-basis: calc(100% - 240px); max-width: 440px; }
      .btn-nope, .btn-like { width: 82px; height: 82px; font-size: 2.25rem; }
    }
  </style>
</head>
<body>
  <div class="app-container swipe-page">

    <!-- 상단 네비게이션 -->
    <header class="top-nav">
      <div class="top-nav-inner">
        <a href="./index.html" class="brand"><span class="brand-mark">🍴</span>FOOD&nbsp;FIRST</a>
        <nav class="nav-links">
          <a href="./index.html" class="nav-link">홈</a>
          <a href="./swipe.html" class="nav-link is-active">스와이프</a>
          <a href="./mypage.html" class="nav-link">마이</a>
        </nav>
        <div class="nav-right"><a href="./mypage.html" class="avatar" title="마이페이지" id="navAvatar">나</a></div>
      </div>
    </header>

    <!-- 네비 아바타: 캐시된 프로필 사진 즉시 적용 ("나" 깜빡임 방지) -->
    <script src="./navavatar.js"></script>

    <!-- 진행 바 -->
    <div class="progress-wrap">
      <div class="progress-info">
        <span class="progress-label" id="progressLabel">취향 탐색 중</span>
        <span class="progress-count"><span id="currentCount">0</span> / <span id="totalCount">18</span></span>
      </div>
      <div class="progress-bar-track">
        <div class="progress-bar-fill" id="progressFill" style="width: 0%"></div>
      </div>
    </div>
    <p class="hint-text" id="hintText">← 싫으면 왼쪽  좋으면 오른쪽 →</p>

    <!-- 카드 덱 -->
    <div class="card-deck" id="cardDeck">
      <div class="spinner-wrap" id="deckSpinner">
        <div class="spinner"></div>
        <span>카드 준비 중...</span>
      </div>
    </div>

    <!-- 버튼: cardDeck 밖에 위치, position:absolute로 카드와 정렬 -->
    <div class="swipe-buttons" id="swipeButtons">
      <div class="swipe-btn-gutter"><button class="btn-nope" onclick="swipeLeft()">✕</button></div>
      <div class="swipe-btn-spacer"></div>
      <div class="swipe-btn-gutter"><button class="btn-like" onclick="swipeRight()">❤️</button></div>
    </div>

    <!-- 완료 화면 -->
    <div class="complete-screen" id="completeScreen">
      <div class="complete-icon">🎯</div>
      <div class="complete-title">취향 분석 완료!</div>
      <div class="complete-subtitle">AI가 최적의 맛집을 찾고 있어요</div>
      <div class="spinner"></div>
    </div>

  </div>

  <!-- 단계 전환 배너 -->
  <div class="phase-banner" id="phaseBanner"></div>

  <!-- 시작 모달 -->
  <div class="start-modal-overlay" id="startModalOverlay" style="display:none">
    <div class="start-modal-sheet">
      <div class="start-modal-title">🍽️ 어떻게 시작할까요?</div>
      <p class="start-modal-desc" id="startModalDesc"></p>

      <!-- 로딩 중 표시 -->
      <div id="startModalLoading" style="display:flex;align-items:center;justify-content:center;gap:8px;padding:8px 0;font-size:13px;color:var(--color-text-tertiary)">
        <div class="spinner" style="width:16px;height:16px;border-width:2px"></div>
        <span>취향 데이터 확인 중...</span>
      </div>

      <!-- 취향 기반 버튼 (로드 후 표시) -->
      <button class="start-option-card primary-card" id="btnTasteBased" onclick="startWithTaste()" style="display:none">
        <div class="start-option-icon">🎯</div>
        <div class="start-option-text">
          <div class="option-title">취향 기반으로 탐색</div>
          <div class="option-sub">지금까지 쌓인 취향 데이터를 반영해<br/>더 정확한 카드를 보여드려요</div>
          <div class="taste-stats" id="tasteStatChips"></div>
        </div>
      </button>

      <!-- 새로 시작 버튼 (로드 후 표시) -->
      <button class="start-option-card" id="btnFresh" onclick="startFresh()" style="display:none">
        <div class="start-option-icon">🔀</div>
        <div class="start-option-text">
          <div class="option-title">새로 시작</div>
          <div class="option-sub">취향 데이터 없이 0부터 탐색해요<br/>오늘은 색다른 걸 먹고 싶을 때!</div>
        </div>
      </button>
    </div>
  </div>

  <!-- 테마 토글 FAB -->
  <button class="theme-fab" id="themeFab" aria-label="테마 전환">
    <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M5 19l1.5-1.5M17.5 6.5 19 5"/></svg>
    <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
  </button>

  <script>
    // 테마 토글 FAB (theme.js와 동일한 ff_theme 키 사용)
    (function(){ var f=document.getElementById("themeFab"); if(!f)return;
      f.addEventListener("click",function(){ var h=document.documentElement;
        var n=h.getAttribute("data-theme")==="dark"?"light":"dark";
        h.setAttribute("data-theme",n); localStorage.setItem("ff_theme",n); }); })();
  </script>

  <script type="module">
    import {
      incrementSwipeCount, getTasteProfile, saveTasteProfile,
      getBlockedMenus, blockMenu,
      getStorageUrl, loadRestaurantData, updateNavAvatar, getUserDoc,
    } from "./firebase.js";
    import { onAuthChanged } from "./auth.js";
    // ── 상수 ──
    const TOTAL      = CONFIG.SWIPE.TOTAL;         // 18
    const FIRST      = CONFIG.SWIPE.FIRST_PHASE;   // 7
    const SECOND     = CONFIG.SWIPE.SECOND_PHASE;  // 7
    const THIRD      = CONFIG.SWIPE.THIRD_PHASE;   // 4
    const CATEGORIES = ["한식","중식","일식","양식","분식","패스트푸드","아시아"];

    const DETAIL_TAGS = ["매콤한","화끈한","바삭한","부드러운","크리미","기름진","쫄깃한","달콤한","새콤한"];

    // ── 상태 ──
    let allRestaurants = [];
    let allMenus = [];        // 전체 메뉴 목록
    let cardQueue = [];       // 15장 카드 목록 (각 항목에 selectedMenu 포함)
    let currentIndex = 0;
    let likes = [];           // 좋아요한 메뉴 정보 { restaurantId, menuId, main_attribute, tags }
    let dislikes = [];        // 싫어요한 메뉴 정보
    let currentUser = null;
    let isDragging = false;
    let startX = 0, startY = 0, currentX = 0;
    let activeCard = null;
    let _mouseMoveHandler = null;
    let _mouseUpHandler = null;

    // 취향 누적 데이터 (Firebase에서 불러온 기존 데이터)
    let seedTasteProfile = null;  // null = 새로 시작, object = 취향 기반
    let blockedMenuIds   = new Set(); // 명시적 차단 메뉴 id

    // ── 이어하기: sessionStorage 복원 ──
    function saveProgress() {
      // 완료 상태(currentIndex >= TOTAL)는 저장하지 않음
      // → result에서 뒤로가기로 돌아올 때 완료 세션이 이어하기로 오인되는 문제 방지
      if (currentIndex >= TOTAL) return;
      sessionStorage.setItem("swipeProgress", JSON.stringify({
        // restaurantId + selectedMenu.id 로 복원 키 저장
        cardQueue: cardQueue.map(r => ({
          restaurantId: r.id,
          menuId: r.selectedMenu?.id || null,
        })),
        currentIndex,
        likes,
        dislikes,
      }));
    }

    function loadProgress(allRestaurants, allMenus) {
      const saved = sessionStorage.getItem("swipeProgress");
      if (!saved) return false;
      try {
        const data = JSON.parse(saved);
        const restMap = Object.fromEntries(allRestaurants.map(r => [r.id, r]));
        const menuMap = Object.fromEntries(allMenus.map(m => [m.id, m]));
        const queue = data.cardQueue.map(({ restaurantId, menuId }) => {
          const r = restMap[restaurantId];
          if (!r) return null;
          return { ...r, selectedMenu: menuMap[menuId] || null };
        }).filter(Boolean);
        if (queue.length !== data.cardQueue.length || queue.length === 0) return false;
        // 이미 완료된 세션이면 복원하지 않고 새로 시작
        if (data.currentIndex >= TOTAL) return false;
        cardQueue = queue;
        currentIndex = data.currentIndex;
        likes = data.likes;
        dislikes = data.dislikes;
        return true;
      } catch { return false; }
    }

    // ── 초기화 ──
    // onAuthChanged가 currentUser를 세팅한 뒤 init 실행 (타이밍 보장)
    onAuthChanged((user) => {
      currentUser = user;
      if (user) {
        getUserDoc(user.uid).then(d => updateNavAvatar(user, d)).catch(() => updateNavAvatar(user));
      } else {
        updateNavAvatar(null);
      }
      // 최초 1회만 init 실행
      if (!window._swipeInitDone) {
        window._swipeInitDone = true;
        init();
      }
    });

    async function init() {
      try {
        // 식당 + 메뉴 캐시에서 로드 (없으면 Firestore)
        const { restaurants, menus } = await loadRestaurantData();
        allMenus = menus;
        allRestaurants = restaurants.map(r => ({
          ...r,
          menus: menus.filter(m => m.restaurantId === r.id),
        }));

        // 로그인 유저면 차단 메뉴 로드
        if (currentUser) {
          try {
            const blocked = await getBlockedMenus(currentUser.uid);
            blockedMenuIds = new Set(blocked.map(m => m.menuId));
          } catch (e) { /* 차단 목록 로드 실패 시 무시 */ }
        }

        // 이어하기가 있으면 모달 없이 바로 복원
        if (loadProgress(allRestaurants, allMenus)) {
          renderCards();
          updateProgress();
          return;
        }

        // 새 세션 시작 — 이전 결과 초기화 후 모달 표시
        sessionStorage.removeItem("swipeResult");
        await showStartModal();
      } catch (e) {
        console.error("swipe init 오류:", e);
        // 스피너 제거 후 에러 안내 표시
        const deck = document.getElementById("deckSpinner");
        if (deck) deck.innerHTML = `
          <div style="text-align:center;padding:24px;color:var(--color-text-secondary)">
            <div style="font-size:2rem;margin-bottom:12px">😢</div>
            <div style="font-size:15px;font-weight:600;margin-bottom:8px;color:var(--color-text-primary)">데이터를 불러오지 못했어요</div>
            <div style="font-size:13px;margin-bottom:20px">네트워크 연결을 확인하고 다시 시도해주세요</div>
            <button class="btn-primary" style="width:auto;padding:12px 28px"
              onclick="window._swipeInitDone=false;location.reload()">다시 시도</button>
          </div>`;
      }
    }

    // ── 시작 모달 표시 ──
    async function showStartModal() {
      const overlay   = document.getElementById("startModalOverlay");
      const descEl    = document.getElementById("startModalDesc");
      const loadingEl = document.getElementById("startModalLoading");
      const btnTaste  = document.getElementById("btnTasteBased");
      const btnFresh  = document.getElementById("btnFresh");
      const chipsEl   = document.getElementById("tasteStatChips");

      // 모달 표시 (로딩 상태)
      overlay.style.display = "flex";
      loadingEl.style.display = "flex";
      btnTaste.style.display = "none";
      btnFresh.style.display = "none";

      // 로그인 유저면 취향 데이터 확인
      if (currentUser) {
        try {
          const profile = await getTasteProfile(currentUser.uid);
          loadingEl.style.display = "none";

          if (profile && profile.sessionCount > 0) {
            seedTasteProfile = profile;

            const topTags = Object.entries(profile.tagScore || {})
              .sort((a, b) => b[1] - a[1])
              .slice(0, 5)
              .map(([tag]) => tag);

            descEl.textContent = `${profile.sessionCount}번의 스와이프 데이터가 있어요`;
            if (topTags.length > 0) {
              chipsEl.innerHTML = topTags
                .map(t => `<span class="taste-tag-chip">${t}</span>`)
                .join("");
            }
            btnTaste.style.display = "flex";
          } else {
            descEl.textContent = "아직 쌓인 취향 데이터가 없어요";
          }
        } catch (e) {
          loadingEl.style.display = "none";
          descEl.textContent = "새로운 탐색을 시작해보세요!";
        }
      } else {
        // 비로그인 — 바로 버튼 표시
        loadingEl.style.display = "none";
        descEl.textContent = "로그인하면 취향이 누적되어 더 정확한 추천을 받을 수 있어요";
      }

      // 항상 새로 시작 버튼은 표시
      btnFresh.style.display = "flex";
    }

    // ── 취향 기반 시작 ──
    window.startWithTaste = function () {
      document.getElementById("startModalOverlay").style.display = "none";
      // seedTasteProfile은 이미 set 된 상태
      buildCardQueue();
      renderCards();
      updateProgress();
    };

    // ── 새로 시작 ──
    window.startFresh = function () {
      document.getElementById("startModalOverlay").style.display = "none";
      seedTasteProfile = null;
      buildCardQueue();
      renderCards();
      updateProgress();
    };

    // ── 카드 큐 구성 (행렬 알고리즘) ──
    const ATTRIBUTES = ["meat","seafood","rice_noodle","spicy","greasy","mild","sweet_sour"];

    // ── 메뉴명 정규화 (중복 비교용, 원본은 그대로 유지) ──
    function normalizeMenuName(name) {
      if (!name) return "";
      return String(name)
        .replace(/\(.*?\)/g, "")              // (1인분), (2~3인) 등 괄호 제거
        .replace(/\s*(소|중|대|특)/g, "")   // 크기 표현 제거
        .replace(/\d+(kg|g|인분)/g, "")       // 용량/인분 표현 제거
        .replace(/^\d+\s*/, "")               // 앞자리 숫자 제거 (1kg 탕수육 → 탕수육)
        .trim();
    }

    // 배열을 무작위로 섞는 유틸
    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    // 배열에서 랜덤 1개 선택
    function randPick(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    function buildCardQueue() {
      cardQueue = [];

      // 카테고리, 속성 풀 모두 독립적으로 섞기
      const catPool  = shuffle(CATEGORIES);
      const usedAttrs    = new Set(); // 이미 사용한 속성 추적
      const usedRestIds  = new Set();
      const usedMenuNames = new Set(); // 같은 메뉴명 중복 방지

      for (const cat of catPool) {
        let picked     = null;
        let pickedMenu = null;

        // ── 이 카테고리에 속한 식당 목록을 매번 섞기 ──
        // → 실행할 때마다 다른 식당이 나옴
        const catRests = shuffle(
          allRestaurants.filter(r => r.category === cat && !usedRestIds.has(r.id))
        );

        // ── 시도 1: 아직 안 쓴 속성을 가진 메뉴 탐색 ──
        // 남은 속성도 섞어서 편향 없이 탐색
        const remainAttrs = shuffle(ATTRIBUTES.filter(a => !usedAttrs.has(a)));

        outer1:
        for (const r of catRests) {
          // 이 식당의 메뉴도 섞기 → 항상 같은 메뉴가 뽑히는 문제 해결
          const shuffledMenus = shuffle(r.menus || []);
          for (const attr of remainAttrs) {
            // 같은 메뉴명 중복 제외
            const matchMenus = shuffledMenus.filter(m =>
              m.main_attribute === attr &&
              !usedMenuNames.has(normalizeMenuName(m.name)) &&
              !blockedMenuIds.has(m.id)
            );
            if (matchMenus.length > 0) {
              picked     = r;
              pickedMenu = randPick(matchMenus);
              usedAttrs.add(attr);
              break outer1;
            }
          }
        }

        // ── 시도 2: 속성 제약 없이 카테고리 내 랜덤 식당·메뉴 ──
        if (!picked && catRests.length > 0) {
          // 이미 나온 메뉴명 제외하고 탐색
          for (const r of catRests) {
            const shuffledMenus = shuffle((r.menus || []).filter(m => !usedMenuNames.has(normalizeMenuName(m.name)) && !blockedMenuIds.has(m.id)));
            if (shuffledMenus.length > 0) {
              picked     = r;
              pickedMenu = shuffledMenus[0];
              if (pickedMenu?.main_attribute) usedAttrs.add(pickedMenu.main_attribute);
              break;
            }
          }
          // 그래도 없으면 중복 허용
          if (!picked) {
            picked = randPick(catRests);
            const shuffledMenus = shuffle(picked.menus || []);
            pickedMenu = shuffledMenus.length > 0 ? shuffledMenus[0] : null;
            if (pickedMenu?.main_attribute) usedAttrs.add(pickedMenu.main_attribute);
          }
        }

        if (!picked) continue;

        cardQueue.push({ ...picked, selectedMenu: pickedMenu });
        usedRestIds.add(picked.id);
        if (pickedMenu?.name) usedMenuNames.add(normalizeMenuName(pickedMenu.name));
      }

      // ── 7장 미만이면 남은 식당 랜덤으로 채움 ──
      if (cardQueue.length < CATEGORIES.length) {
        const pool = shuffle(
          allRestaurants.filter(r => !usedRestIds.has(r.id) && (r.menus || []).length > 0)
        );
        for (const r of pool) {
          if (cardQueue.length >= CATEGORIES.length) break;
          const menu = randPick(shuffle(r.menus));
          cardQueue.push({ ...r, selectedMenu: menu });
          usedRestIds.add(r.id);
        }
      }

      cardQueue = cardQueue.slice(0, CATEGORIES.length);
    }

    // ── 태그 점수 계산 ──
    // 1단계 완료 전(currentIndex < FIRST): seed 무시, 순수 탐색
    // 2단계부터: seed raw 정규화×0.1 + 현재 세션 likes 합산
    function calcTagScore() {
      // 현재 세션 likes → raw 점수
      const sessionScore = {};
      for (const item of likes) {
        const tags = item.tags?.split(",") || [];
        for (const t of tags) {
          const tag = t.trim();
          if (tag) sessionScore[tag] = (sessionScore[tag] || 0) + 1;
        }
      }

      // 1단계 완료 전이면 seed 반영 안 함
      if (!seedTasteProfile || currentIndex < FIRST) return sessionScore;

      // seed raw → 활용 시점 정규화 × 0.1
      const rawSeed   = seedTasteProfile.tagScore || {};
      const maxRaw    = Math.max(...Object.values(rawSeed), 1);
      const score     = { ...sessionScore };
      for (const [tag, raw] of Object.entries(rawSeed)) {
        const seedContrib = (raw / maxRaw) * 0.1;
        score[tag] = (score[tag] || 0) + seedContrib;
      }
      return score;
    }

    // 싫어요한 식당 id 목록 — 세션 내만 적용
    function getDislikedRestIds() {
      const ids = new Set();
      for (const item of dislikes) {
        if (item.restaurantId) ids.add(String(item.restaurantId));
      }
      return ids;
    }

    // 회피 태그 — 세션 내만 적용 (이전 세션 데이터 미사용)
    function getDislikeOnlyTags() {
      const likeTags    = new Set(
        likes.flatMap(l => l.tags?.split(",").map(t => t.trim()) || [])
      );
      const dislikeTags = new Set(
        dislikes.flatMap(d => d.tags?.split(",").map(t => t.trim()) || [])
      );
      return [...dislikeTags].filter(t => t && !likeTags.has(t));
    }

    // 메뉴의 태그 점수 합산
    // dislikeOnlyTags에 포함된 태그가 있으면 패널티
    function calcMenuScore(menu, tagScore, dislikeOnlyTags = []) {
      const tags = menu.tags?.split(",").map(t => t.trim()) || [];
      const baseScore = tags.reduce((sum, t) => sum + (tagScore[t] || 0), 0);
      const penalty   = tags.filter(t => dislikeOnlyTags.includes(t)).length * 2;
      return baseScore - penalty;
    }

    // ── 확신도(confidence) 계산 ──
    // 태그별로 좋아요/싫어요에 등장한 횟수 기반
    // confidence = 0   → 완전 미탐색 (한 번도 안 나옴)
    // confidence = 0.5 → 불확실 (좋아요=싫어요 or 미등장)
    // confidence = 1.0 → 완전 확신 (좋아요에만 등장)
    function calcConfidence() {
      const likeCount    = {};
      const dislikeCount = {};

      for (const item of likes) {
        const tags = item.tags?.split(",").map(t => t.trim()) || [];
        for (const t of tags) likeCount[t] = (likeCount[t] || 0) + 1;
      }
      for (const item of dislikes) {
        const tags = item.tags?.split(",").map(t => t.trim()) || [];
        for (const t of tags) dislikeCount[t] = (dislikeCount[t] || 0) + 1;
      }

      const conf = {};
      const allTags = new Set([...Object.keys(likeCount), ...Object.keys(dislikeCount)]);
      for (const t of allTags) {
        const l = likeCount[t]    || 0;
        const d = dislikeCount[t] || 0;
        conf[t] = (l + d) === 0 ? 0 : l / (l + d);
      }
      return conf;
    }

    // 좋아요 비율로 2단계 전략 결정
    function getSecondPhaseStrategy() {
      const total     = likes.length + dislikes.length;
      if (total === 0) return "EXPLORE";
      const likeRatio = likes.length / total;
      if (likeRatio >= 0.6) return "REFINE";   // 좋아요 많음 → 선호 속성 세분화
      if (likeRatio <= 0.3) return "EXPLORE";  // 싫어요 많음 → 새 속성 탐색
      return "MIXED";                           // 반반 → 대립 탐색
    }

    // ── 속성 유형 분류 ──
    // 재료 중심: 어떤 재료인지가 핵심 → 재료 대립 or 맛 대립 중 랜덤
    const MATERIAL_ATTRS = new Set(["meat", "seafood", "rice_noodle"]);
    // 맛 중심: 맛/느낌이 핵심 → 맛 세분화 탐색
    const FLAVOR_ATTRS   = new Set(["spicy", "greasy", "mild", "sweet_sour"]);

    // 속성별 세분화 탐색 태그 정의
    // 좋아요한 태그에서 이미 확인된 태그를 제외하고 나머지 중 1개를 골라 탐색
    const FLAVOR_EXPLORE = {
      spicy:      ["매콤한", "화끈한"],
      greasy:     ["기름진", "크리미"],
      mild:       ["국물/탕", "찜/삶기", "날것", "구이", "튀김", "볶음"],
      sweet_sour: ["달콤한", "새콤한", "단짠"],
    };

    // 재료 중심 속성의 재료 태그 목록
    const MATERIAL_TAGS = {
      meat:        ["소고기", "돼지고기", "닭고기", "양고기", "곱창/내장"],
      seafood:     ["새우", "생선", "조개류", "오징어·문어", "해물혼합"],
      rice_noodle: ["면", "밥"],
    };

    // 조리방식 태그 목록
    const COOKING_TAGS = ["구이", "튀김", "찜/삶기", "볶음", "조림", "국물/탕", "날것"];

    /**
     * 대립 카드 뽑기 — 변수 1개만 변경
     * @param likedItem  좋아요한 카드 정보
     * @param usedRests  이미 사용한 식당 id Set
     * @param tagScore        현재 태그 점수
     * @param dislikeOnlyTags 회피 태그 목록
     * @returns { r, m } 또는 null
     */
    function pickContrastCard(likedItem, usedRests, tagScore, dislikeOnlyTags = []) {
      const attr     = likedItem.main_attribute;
      const likedTags = likedItem.tags?.split(",").map(t => t.trim()) || [];

      let targetTags = []; // 이 태그를 가진 메뉴를 뽑겠다
      let fixedTags  = []; // 이 태그는 반드시 유지해야 한다 (변수 고정)

      if (MATERIAL_ATTRS.has(attr)) {
        // ── 재료 중심 속성 ──
        const myMaterials = MATERIAL_TAGS[attr] || [];
        // 내가 가진 재료 태그
        const myMat = likedTags.filter(t => myMaterials.includes(t));
        // 내가 가진 조리방식/맛 태그
        const myCook = likedTags.filter(t => COOKING_TAGS.includes(t));

        // 전략 랜덤 선택: 재료고정+맛변경 OR 맛고정+재료변경
        const strategy = Math.random() < 0.5 ? "재료고정" : "재료변경";

        if (strategy === "재료고정" && myMat.length > 0) {
          // 재료는 같게, 조리방식/맛을 다르게
          fixedTags  = myMat; // 재료 고정
          // 내가 가진 조리방식 제외한 다른 조리방식 타겟
          const otherCooks = COOKING_TAGS.filter(t => !likedTags.includes(t));
          targetTags = otherCooks.length > 0
            ? [otherCooks[Math.floor(Math.random() * otherCooks.length)]]
            : myMaterials.filter(t => !likedTags.includes(t)); // 없으면 재료 변경으로 fallback
        } else {
          // 재료를 다르게, 조리방식/맛은 같게
          fixedTags  = myCook.length > 0 ? myCook : []; // 조리방식 고정
          // 내가 가진 재료 제외한 다른 재료 타겟
          const otherMats = myMaterials.filter(t => !likedTags.includes(t));
          targetTags = otherMats.length > 0
            ? [otherMats[Math.floor(Math.random() * otherMats.length)]]
            : [myMaterials[Math.floor(Math.random() * myMaterials.length)]];
        }

      } else if (FLAVOR_ATTRS.has(attr)) {
        // ── 맛 중심 속성 ──
        const explores = FLAVOR_EXPLORE[attr] || [];
        // 이미 확인된 태그(좋아요에 있는 것) 제외
        const unexplored = explores.filter(t => !likedTags.includes(t));
        targetTags = unexplored.length > 0
          ? [unexplored[Math.floor(Math.random() * unexplored.length)]]
          : [explores[Math.floor(Math.random() * explores.length)]];
      }

      if (targetTags.length === 0) return null;

      // DB에서 targetTags 중 하나를 가지면서 fixedTags도 가진 메뉴 탐색
      let bestCandidate = null;
      let bestScore     = -Infinity;

      for (const r of allRestaurants) {
        if (usedRests.has(r.id)) continue; // usedRests에 싫어요 식당 id 포함됨

        for (const m of r.menus || []) {
          const mTags = m.tags?.split(",").map(t => t.trim()) || [];

          // targetTag 포함 여부
          const hasTarget = targetTags.some(t => mTags.includes(t));
          if (!hasTarget) continue;

          // fixedTag 포함 여부 (고정 태그가 있으면 반드시 포함)
          const hasFixed = fixedTags.length === 0 || fixedTags.some(t => mTags.includes(t));
          if (!hasFixed) continue;

          // 점수: tagScore 기반 + 고정 태그 일치 보너스
          const fixedBonus = fixedTags.filter(t => mTags.includes(t)).length * 3;
          const score      = calcMenuScore(m, tagScore, dislikeOnlyTags) + fixedBonus;

          if (score > bestScore) {
            bestScore = score;
            bestCandidate = { r, m };
          }
        }
      }

      // fixedTags 조건 완화 fallback: fixedTags 없이 targetTags만으로 재탐색
      if (!bestCandidate && fixedTags.length > 0) {
        for (const r of allRestaurants) {
          if (usedRests.has(r.id)) continue;
          for (const m of r.menus || []) {
            const mTags = m.tags?.split(",").map(t => t.trim()) || [];
            const hasTarget = targetTags.some(t => mTags.includes(t));
            if (!hasTarget) continue;
            const score = calcMenuScore(m, tagScore, dislikeOnlyTags);
            if (score > bestScore) {
              bestScore = score;
              bestCandidate = { r, m };
            }
          }
        }
      }

      return bestCandidate;
    }

    // 2단계 카드 구성 — 좋아요 비율에 따른 동적 전략
    function buildSecondPhase() {
      const usedRestIds     = new Set(cardQueue.map(r => r.id));
      const tagScore        = calcTagScore();
      const dislikedRestIds = getDislikedRestIds();
      const dislikeOnlyTags = getDislikeOnlyTags();
      const strategy        = getSecondPhaseStrategy(); // REFINE / EXPLORE / MIXED
      const secondPhase     = [];
      const pickedRests     = new Set(usedRestIds);
      const usedMenuNames   = new Set(cardQueue.map(r => normalizeMenuName(r.selectedMenu?.name)).filter(Boolean));

      // 싫어요 식당 제외
      for (const id of dislikedRestIds) pickedRests.add(id);

      // 메뉴명 중복 체크 헬퍼
      const addCard = (r, m) => {
        if (!r || !m) return false;
        if (usedMenuNames.has(normalizeMenuName(m?.name))) return false;
        secondPhase.push({ ...r, selectedMenu: m });
        pickedRests.add(r.id);
        if (m?.name) usedMenuNames.add(normalizeMenuName(m.name));
        return true;
      };

      // ── REFINE: 좋아요 >= 60% → 선호 속성 깊게 파고들기 ──
      // 좋아요한 것과 변수 1개만 바꾼 카드를 최대한 많이
      if (strategy === "REFINE") {
        // 좋아요 항목 1개당 대립 카드 1장
        for (const item of likes) {
          if (secondPhase.length >= SECOND) break;
          const result = pickContrastCard(item, pickedRests, tagScore, dislikeOnlyTags);
          if (result) addCard(result.r, result.m);
        }
        // 남은 장수: 좋아요 항목 반복하며 추가 대립 탐색
        const shuffled = shuffle(likes);
        let att = 0;
        while (secondPhase.length < SECOND && att < shuffled.length * 4) {
          const result = pickContrastCard(shuffled[att % shuffled.length], pickedRests, tagScore, dislikeOnlyTags);
          if (result) addCard(result.r, result.m);
          att++;
        }

      // ── EXPLORE: 싫어요 >= 70% → 아직 안 나온 속성/카테고리 탐색 ──
      // 기존 좋아요와 다른 새 영역 탐색
      } else if (strategy === "EXPLORE") {
        // 1단계에서 안 나온 속성 우선
        const usedAttrs = new Set(cardQueue.map(r => r.selectedMenu?.main_attribute).filter(Boolean));
        const freshAttrs = ATTRIBUTES.filter(a => !usedAttrs.has(a));

        const candidates = [];
        for (const r of allRestaurants) {
          if (pickedRests.has(r.id)) continue;
          for (const m of r.menus || []) {
            // 아직 안 나온 속성일수록 높은 점수 (탐색 우선)
            const freshBonus = freshAttrs.includes(m.main_attribute) ? 5 : 0;
            // dislikeOnly 태그와 겹치면 패널티
            const score = freshBonus + calcMenuScore(m, tagScore, dislikeOnlyTags);
            candidates.push({ r, m, score });
          }
        }
        candidates.sort((a, b) => b.score - a.score || Math.random() - 0.5);

        const catCount = {};
        const maxPerCat = Math.ceil(SECOND / CATEGORIES.length);
        for (const { r, m } of candidates) {
          if (secondPhase.length >= SECOND) break;
          if (pickedRests.has(r.id)) continue;
          if (usedMenuNames.has(normalizeMenuName(m?.name))) continue;
          const cat = r.category;
          catCount[cat] = catCount[cat] || 0;
          if (catCount[cat] >= maxPerCat) continue;
          addCard(r, m);
          catCount[cat]++;
        }

      // ── MIXED: 반반 → 좋아요 대립 + 싫어요 대립 혼합 ──
      } else {
        // 좋아요 항목 1개당 1장
        for (const item of likes) {
          if (secondPhase.length >= SECOND) break;
          const result = pickContrastCard(item, pickedRests, tagScore, dislikeOnlyTags);
          if (result) addCard(result.r, result.m);
        }
        // 싫어요 항목 1개당 1장 (이유 파악용)
        for (const item of dislikes) {
          if (secondPhase.length >= SECOND) break;
          const result = pickContrastCard(item, pickedRests, tagScore, dislikeOnlyTags);
          if (result) addCard(result.r, result.m);
        }
        // 남은 장수: 좋아요 추가 대립
        const shuffled = shuffle(likes);
        let att = 0;
        while (secondPhase.length < SECOND && att < shuffled.length * 3) {
          const result = pickContrastCard(shuffled[att % shuffled.length], pickedRests, tagScore, dislikeOnlyTags);
          if (result) addCard(result.r, result.m);
          att++;
        }
      }

      // ── fallback: 부족하면 tagScore 기반 카테고리 분산 ──
      if (secondPhase.length < SECOND) {
        const catCount  = {};
        const maxPerCat = Math.ceil((SECOND - secondPhase.length) / CATEGORIES.length);
        const candidates = [];
        for (const r of allRestaurants) {
          if (pickedRests.has(r.id)) continue;
          for (const m of r.menus || []) {
            candidates.push({ r, m, score: calcMenuScore(m, tagScore, dislikeOnlyTags) });
          }
        }
        candidates.sort((a, b) => b.score - a.score || Math.random() - 0.5);
        for (const { r, m } of candidates) {
          if (secondPhase.length >= SECOND) break;
          if (pickedRests.has(r.id)) continue;
          if (usedMenuNames.has(normalizeMenuName(m?.name))) continue;
          const cat = r.category;
          catCount[cat] = catCount[cat] || 0;
          if (catCount[cat] >= maxPerCat) continue;
          addCard(r, m);
          catCount[cat]++;
        }
      }

      // ── 최후 랜덤 채움 ──
      while (secondPhase.length < SECOND) {
        const pool = allRestaurants.filter(r => !pickedRests.has(r.id));
        if (pool.length === 0) break;
        addCard(randPick(pool), randPick(shuffle(randPick(pool).menus || [])) || null);
      }

      cardQueue.push(...secondPhase.slice(0, SECOND));
      saveProgress();
      renderCards();
    }

    // 3단계 카드 구성 — 확신도 기반 세부 취향 확정
    function buildThirdPhase() {
      const usedRestIds     = new Set(cardQueue.map(r => r.id));
      const tagScore        = calcTagScore();
      const dislikedRestIds = getDislikedRestIds();
      const dislikeOnlyTags = getDislikeOnlyTags();
      const confidence      = calcConfidence(); // 태그별 확신도 (0~1)

      // ── 우선순위 태그 결정 ──
      // 확신도 0.3~0.7 → 불확실 → 탐색 필요 (가장 높은 우선순위)
      // 확신도 > 0.7   → 높은 확신 → 최종 확인용
      // 미등장 DETAIL_TAGS → 탐색 필요
      const uncertain = DETAIL_TAGS.filter(t => {
        const c = confidence[t];
        return c === undefined || (c > 0.2 && c < 0.8);
      }).sort((a, b) => {
        // 확신도 0.5에 가까울수록 우선 (가장 불확실)
        const ca = confidence[a] ?? 0.5;
        const cb = confidence[b] ?? 0.5;
        return Math.abs(cb - 0.5) - Math.abs(ca - 0.5);
      });

      // 확신도 높은 좋아요 태그 (>= 0.7) → 확인용
      const confirmed = DETAIL_TAGS.filter(t => (confidence[t] || 0) >= 0.7)
        .sort((a, b) => (confidence[b] || 0) - (confidence[a] || 0));

      const priorityTags = [...uncertain, ...confirmed];

      // 좋아요 카테고리 상위 순
      const catLikeCount = {};
      for (const item of likes) {
        if (item.category) catLikeCount[item.category] = (catLikeCount[item.category] || 0) + 1;
      }
      const sortedCats = [...CATEGORIES].sort((a, b) =>
        (catLikeCount[b] || 0) - (catLikeCount[a] || 0)
      );

      const thirdPhase  = [];
      const pickedRests = new Set(usedRestIds);
      for (const id of dislikedRestIds) pickedRests.add(id);

      // 카테고리별로 1장씩, 확신도 낮은 세부태그 우선
      for (const cat of sortedCats) {
        if (thirdPhase.length >= THIRD) break;

        let bestCandidate = null;
        let bestScore     = -Infinity;

        for (const r of allRestaurants) {
          if (r.category !== cat) continue;
          if (pickedRests.has(r.id)) continue;

          for (const m of r.menus || []) {
            const mTags = m.tags?.split(",").map(t => t.trim()) || [];

            // 불확실 태그 포함할수록 고점 (확신도 0.5에 가까울수록 탐색 가치 높음)
            const uncertainScore = priorityTags.reduce((best, tag, idx) => {
              if (mTags.includes(tag)) {
                return Math.max(best, (priorityTags.length - idx) * 10);
              }
              return best;
            }, 0);

            const totalScore = uncertainScore + calcMenuScore(m, tagScore, dislikeOnlyTags);
            if (totalScore > bestScore) {
              bestScore = totalScore;
              bestCandidate = { r, m };
            }
          }
        }

        if (bestCandidate) {
          thirdPhase.push({ ...bestCandidate.r, selectedMenu: bestCandidate.m });
          pickedRests.add(bestCandidate.r.id);
        }
      }

      // 부족하면 랜덤으로 채움
      while (thirdPhase.length < THIRD) {
        const pool = allRestaurants.filter(r => !pickedRests.has(r.id));
        if (pool.length === 0) break;
        const r   = randPick(pool);
        const menu = randPick(shuffle(r.menus || [])) || null;
        thirdPhase.push({ ...r, selectedMenu: menu });
        pickedRests.add(r.id);
      }

      cardQueue.push(...thirdPhase.slice(0, THIRD));
      saveProgress();
      renderCards();
    }

    // ── 카드 렌더링 ──
    function renderCards() {
      const deck = document.getElementById("cardDeck");
      deck.innerHTML = "";

      // 버튼 표시 (스와이프 진행 중)
      const btns = document.getElementById("swipeButtons");
      if (btns) btns.style.display = "flex";

      const toRender = cardQueue.slice(currentIndex, currentIndex + 2);

      // 카드가 없는데 아직 완료가 아니면 다음 단계 강제 트리거
      if (toRender.length === 0) {
        if (currentIndex < TOTAL) {
          handleNextStep();
        }
        return;
      }

      // 뒤 카드 먼저 추가(zIndex 낮음), 앞 카드 나중에 추가(zIndex 높음)
      // → 항상 현재 카드(index 0)가 화면 앞에 표시됨
      const cards = toRender.map((restaurant, i) => {
        const card = createCardEl(restaurant);
        if (i === 0) {
          card.style.zIndex = "2";
          card.id = "activeCard";
          initDrag(card);
        } else {
          card.style.transform = "scale(0.95) translateY(12px)";
          card.style.zIndex = "1";
          card.style.pointerEvents = "none";
        }
        return card;
      });

      // 뒤 카드(i=1)부터 추가해서 앞 카드(i=0)가 위에 오도록
      [...cards].reverse().forEach(c => deck.appendChild(c));

      // DOM 추가 완료 후 이미지 로드 (컨테이너가 확실히 존재하는 시점)
      cards.forEach(card => {
        const photo    = card.dataset.photo;
        const fallback = card.dataset.fallback;
        if (photo) {
          const imgContainer = card.querySelector(".swipe-card-img");
          if (imgContainer) loadImage(photo, imgContainer, fallback);
        }
      });
    }

    // ── 이미지 로더 ──
    function loadImage(photoId, container, fallbackHtml) {
      const url = getStorageUrl(photoId);
      const img = new Image();
      img.onload  = () => {
        container.innerHTML = `<img src="${url}" style="width:100%;height:100%;object-fit:cover" alt="${String(photoId).padStart(4,'0')}" />`;
      };
      img.onerror = () => {
        // Storage에서 못 찾으면 이모지 폴백
        container.innerHTML = fallbackHtml;
      };
      img.src = url;
    }

    function createCardEl(restaurant) {
      const card = document.createElement("div");
      card.className = "swipe-card";
      card.dataset.id       = restaurant.id;
      card.dataset.category = restaurant.category;

      const catEmoji = { 한식:"🍚",중식:"🥢",일식:"🍣",양식:"🍝",분식:"🌮",패스트푸드:"🍔",아시아:"🍜",카페:"☕",기타:"🍽️" };
      const fallback = `<span style="font-size:80px">${catEmoji[restaurant.category] || "🍽️"}</span>`;
      const menu     = restaurant.selectedMenu || null;

      card.innerHTML = `
        <div class="swipe-overlay-like">LIKE 👍</div>
        <div class="swipe-overlay-nope">NOPE 👎</div>
        <div class="swipe-card-img">
          ${fallback}
        </div>
        <div class="swipe-card-info">
          <div class="swipe-card-name">${menu?.name || "-"}</div>
          ${menu?.id ? `<div class="swipe-card-block-row"><button class="btn-block-menu" onclick="handleBlockMenu(event,'${menu.id}','${(menu.name||'').replace(/'/g,"\'")}','${(restaurant.name||'').replace(/'/g,"\'")}')">다시 보지 않기</button></div>` : ''}
        </div>`;

      // photo 정보를 카드 엘리먼트에 저장해두고 DOM 추가 후 로드
      if (menu?.photo) {
        card.dataset.photo    = menu.photo;
        card.dataset.fallback = fallback;
      }

      return card;
    }

    // ── 드래그 이벤트 ──
    function initDrag(card) {
      // 이전 마우스 핸들러 제거 (중복 등록 방지)
      if (_mouseMoveHandler) document.removeEventListener("mousemove", _mouseMoveHandler);
      if (_mouseUpHandler) document.removeEventListener("mouseup", _mouseUpHandler);
      _mouseMoveHandler = onDragMove;
      _mouseUpHandler = onDragEnd;
      // 터치
      card.addEventListener("touchstart", onDragStart, { passive: true });
      card.addEventListener("touchmove", onDragMove, { passive: true });
      card.addEventListener("touchend", onDragEnd);
      // 마우스
      card.addEventListener("mousedown", onDragStart);
      document.addEventListener("mousemove", _mouseMoveHandler);
      document.addEventListener("mouseup", _mouseUpHandler);
    }

    let _animating = false; // 카드 애니메이션 중 입력 차단 플래그

    function onDragStart(e) {
      if (currentIndex >= cardQueue.length) return;
      if (_animating) return;
      // 버튼(다시 보지 않기 등) 클릭이면 드래그 시작 안 함
      if (e.target.closest("button")) return;
      isDragging = true;
      activeCard = document.getElementById("activeCard");
      if (!activeCard) return;
      const pt = e.touches ? e.touches[0] : e;
      startX = pt.clientX;
      startY = pt.clientY;
      activeCard.classList.add("is-dragging");
    }

    function onDragMove(e) {
      if (!isDragging || !activeCard) return;
      const pt = e.touches ? e.touches[0] : e;
      currentX = pt.clientX - startX;
      const currentY = pt.clientY - startY;
      const rotate = currentX * 0.08;
      activeCard.style.transform = `translate(${currentX}px, ${currentY}px) rotate(${rotate}deg)`;

      // 오버레이
      const threshold = 60;
      const likeOverlay = activeCard.querySelector(".swipe-overlay-like");
      const nopeOverlay = activeCard.querySelector(".swipe-overlay-nope");
      if (currentX > threshold) {
        likeOverlay.style.opacity = Math.min(1, (currentX - threshold) / 80);
        nopeOverlay.style.opacity = 0;
      } else if (currentX < -threshold) {
        nopeOverlay.style.opacity = Math.min(1, (-currentX - threshold) / 80);
        likeOverlay.style.opacity = 0;
      } else {
        likeOverlay.style.opacity = 0;
        nopeOverlay.style.opacity = 0;
      }
    }

    function onDragEnd() {
      if (!isDragging || !activeCard) return;
      isDragging = false;
      activeCard.classList.remove("is-dragging");

      // 마우스 핸들러 정리
      document.removeEventListener("mousemove", _mouseMoveHandler);
      document.removeEventListener("mouseup", _mouseUpHandler);
      _mouseMoveHandler = null;
      _mouseUpHandler = null;

      const SWIPE_THRESHOLD = 100;
      if (currentX > SWIPE_THRESHOLD) {
        animateOut("right");
      } else if (currentX < -SWIPE_THRESHOLD) {
        animateOut("left");
      } else {
        // 원위치 — 카드 제자리로 돌아온 후 드래그 핸들러 재등록
        const cardToRestore = activeCard;
        cardToRestore.style.transition = "transform 0.3s";
        cardToRestore.style.transform = "";
        // 오버레이도 초기화
        cardToRestore.querySelector(".swipe-overlay-like").style.opacity = 0;
        cardToRestore.querySelector(".swipe-overlay-nope").style.opacity = 0;
        setTimeout(() => {
          if (cardToRestore) {
            cardToRestore.style.transition = "";
            // 드래그 핸들러 재등록 (마우스 이벤트 복원)
            initDrag(cardToRestore);
          }
        }, 300);
      }

      currentX = 0;
    }

    // ── 스와이프 처리 ──
    function animateOut(direction) {
      if (!activeCard) return;
      _animating = true; // 애니메이션 중 입력 차단
      const tx = direction === "right" ? window.innerWidth + 200 : -window.innerWidth - 200;
      activeCard.classList.add("animate-out");
      activeCard.style.transform = `translate(${tx}px, 0) rotate(${direction === "right" ? 20 : -20}deg)`;
      activeCard.style.opacity = "0";

      const restaurantId = activeCard.dataset.id;

      setTimeout(() => {
        const r    = cardQueue[currentIndex];
        const menu = r?.selectedMenu || null;
        const item = {
          restaurantId:   r?.id || restaurantId,
          category:       r?.category || "",
          menuId:         menu?.id || "",
          menuName:       menu?.name || "",
          main_attribute: menu?.main_attribute || "",
          tags:           menu?.tags || "",
        };
        if (direction === "right") {
          likes.push(item);
        } else {
          dislikes.push(item);
        }
        currentIndex++;
        updateProgress();
        saveProgress();
        _animating = false; // 애니메이션 완료, 입력 허용
        handleNextStep();
      }, 350);
    }

    function handleNextStep() {
      // 전체 완료
      if (currentIndex >= TOTAL) {
        handleComplete();
        return;
      }

      // 1단계 완료 → 2단계 카드 생성
      // cardQueue에 아직 2단계 카드가 추가 안 됐을 때만 실행
      if (currentIndex === FIRST && cardQueue.length === FIRST) {
        showPhaseBanner("🎯 취향을 반영한 카드를 준비했어요!");
        buildSecondPhase();
        return;
      }

      // 2단계 완료 → 3단계 카드 생성
      if (currentIndex === FIRST + SECOND && cardQueue.length === FIRST + SECOND) {
        showPhaseBanner("✨ 마지막 단계! 세부 취향을 파악할게요");
        buildThirdPhase();
        return;
      }

      renderCards();
    }

    async function handleComplete() {
      // 스와이프 횟수 저장
      if (currentUser) {
        await incrementSwipeCount(currentUser.uid);
      }

      // 결과 저장
      const finalTagScore      = calcTagScore();
      const finalDislikeOnly   = getDislikeOnlyTags(); // 회피 태그

      // ── 취향 누적 데이터 Firebase에 저장 (로그인 유저만) ──
      if (currentUser) {
        try {
          // 현재 세션의 순수 데이터만 저장 (seed 제외, Firebase에서 직접 누적)
          const sessionTagScore = {};
          for (const item of likes) {
            const tags = item.tags?.split(",") || [];
            for (const t of tags) {
              const tag = t.trim();
              if (tag) sessionTagScore[tag] = (sessionTagScore[tag] || 0) + 1;
            }
          }
          await saveTasteProfile(currentUser.uid, { tagScore: sessionTagScore });
        } catch (e) {
          console.warn("취향 데이터 저장 실패:", e);
        }
      }

      const swipeResult = {
        likes,
        dislikes,
        tagScore: finalTagScore,
        dislikeOnlyTags: finalDislikeOnly,
        allRestaurants: allRestaurants.map(r => ({
          id: r.id,
          name: r.name,
          category: r.category,
          tags: r.tags,
          distance: r.distance,
          rating: r.rating,
          price_range: r.price_range,
          lat: r.lat,
          lng: r.lng,
          hours: r.hours,
          break_time: r.break_time,
          closed_day: r.closed_day,
          photo: r.photo,
          address: r.address,
          menuNames: (r.menus || []).map(m => m.name).join(", "),
        })),
      };
      sessionStorage.setItem("swipeResult", JSON.stringify(swipeResult));
      sessionStorage.removeItem("swipeProgress"); // 완료된 세션은 즉시 제거

      window.location.href = "./result.html";
    }

    // ── 다시 보지 않기 ──
    let _blockInProgress = false;
    window.handleBlockMenu = async function (e, menuId, menuName, restaurantName) {
      e.stopPropagation();
      e.preventDefault();
      // 드래그 중이거나 이미 처리 중이면 무시
      if (isDragging || _blockInProgress) return;
      _blockInProgress = true;
      // 로컬 차단 즉시 반영
      blockedMenuIds.add(menuId);
      // Firebase 저장 (로그인 유저만)
      if (currentUser) {
        try {
          await blockMenu(currentUser.uid, { menuId, menuName, restaurantName });
        } catch (err) { console.warn("차단 저장 실패:", err); }
      }
      // 현재 카드 왼쪽으로 날려버리기
      activeCard = document.getElementById("activeCard");
      if (activeCard) { currentX = -150; animateOut("left"); }
      setTimeout(() => { _blockInProgress = false; }, 500);
    };

    // ── 버튼 클릭 ──
    window.swipeRight = function () {
      activeCard = document.getElementById("activeCard");
      if (!activeCard) return;
      currentX = 150;
      animateOut("right");
    };

    window.swipeLeft = function () {
      activeCard = document.getElementById("activeCard");
      if (!activeCard) return;
      currentX = -150;
      animateOut("left");
    };

    // ── 진행 바 업데이트 ──
    function updateProgress() {
      document.getElementById("currentCount").textContent = currentIndex;
      document.getElementById("totalCount").textContent = TOTAL;
      document.getElementById("progressFill").style.width = `${(currentIndex / TOTAL) * 100}%`;

      // 1장 이상 스와이프하면 hint 숨기기
      const hintEl = document.getElementById("hintText");
      if (currentIndex >= 1) {
        hintEl.classList.add("hidden");
      }

      let label = "취향 탐색 중";
      if (currentIndex >= FIRST + SECOND) {
        label = "세부 취향 확정 중";
      } else if (currentIndex >= FIRST) {
        const strategy = getSecondPhaseStrategy();
        if (strategy === "REFINE")       label = "선호 취향 세분화 중";
        else if (strategy === "EXPLORE") label = "새로운 취향 탐색 중";
        else                             label = "취향 대립 검증 중";
      }
      document.getElementById("progressLabel").textContent = label;
    }

    // ── 단계 전환 배너 ──
    function showPhaseBanner(msg) {
      const banner = document.getElementById("phaseBanner");
      banner.textContent = msg;
      banner.classList.add("show");
      setTimeout(() => banner.classList.remove("show"), 2000);
    }
  </script>
</body>
</html>
